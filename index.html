      {t:"Don't invite this year",e:{L:-3,RT:-5},r:"You mail Rinpoche a group photo of all the members."}];}});
function visitCost(){let c=3500+(Y()-2021)*600; if(on('guest')) c=Math.round(c*.7); return c;}

/* ---------- 事件选择 ---------- */
function eligible(ev){
  if(ev.at||ev.qonly) return false;
  if(ev.ch&&!ev.ch.includes(ch())) return false;
  if(ev.months&&!ev.months.includes(Mo())) return false;
  if(!ev.rep&&S.seen[ev.id]!=null) return false;
  if(ev.rep&&S.seen[ev.id]!=null&&S.turn-S.seen[ev.id]<(ev.cd??6)) return false;
  if(ev.cond&&!ev.cond()) return false;
  if(S.endless&&['final','designate'].includes(ev.id)) return false;
  return true;
}
function buildPending(){
  const p=[];
  const d=ds();
  for(const id in EV){const ev=EV[id]; if(ev.at===d&&S.seen[id]==null&&(!ev.cond||ev.cond())) p.push({id});}
  S.queue=S.queue.filter(q=>{if(q.at<=S.turn){p.push({id:q.id,ctx:q.ctx});return false;}return true;});
  // departure / burnout / debt
  here().forEach(m=>{if(m.low>=12&&!m.flagged&&p.length<4){m.flagged=1;p.push({id:'departure',ctx:{m:m.id}});}});
  if(S.B>=88&&!p.some(x=>x.id==='burnout')) p.push({id:'burnout'});
  if(S.stats.negD>=2){S.stats.negD=0;p.push({id:'debt'});}
  // 仁波切年度来访（固定）
  if(Mo()===9&&EV.visit.cond()&&(S.seen.visit==null||S.turn-S.seen.visit>=11)) p.push({id:'visit'});
  // shadow
  const shadowP=S.H>=40?(Y()===2023||Y()===2024?.5:.25):0;
  if(shadowP&&eligibleRep('shadow')&&chance(shadowP)) p.push({id:'shadow',r:1});
  // random
  const evf=(S.opt&&S.opt.evf)||1;
  if(p.filter(x=>!['departure'].includes(x.id)).length<2&&(evf>=1||chance(evf))){
    const r=weightedPick(); if(r){r.r=1;p.push(r);}
    if(chance(.3*evf)){const r2=weightedPick(p.map(x=>x.id)); if(r2){r2.r=1;p.push(r2);}}
    if(evf>1&&chance(evf-1)){const r3=weightedPick(p.map(x=>x.id)); if(r3){r3.r=1;p.push(r3);}}
  }
  // silent event overrides month
  const si=p.find(x=>x.id==='silent'); if(si) return [si];
  return p.slice(0,6);
}
function eligibleRep(id){const ev=EV[id];return S.seen[id]==null||S.turn-S.seen[id]>=(ev.cd??6);}
function weightedPick(excl=[]){
  const pool=Object.values(EV).filter(ev=>!excl.includes(ev.id)&&eligible(ev)&&(ev.w||0)>0);
  let tot=pool.reduce((a,b)=>a+b.w,0); if(!tot) return null;
  let r=Math.random()*tot;
  for(const ev of pool){r-=ev.w;if(r<=0)return {id:ev.id};}
  return {id:pool[pool.length-1].id};
}
function nextEvent(){
  while(S.pending.length){
    const p=S.pending.shift(); const ev=EV[p.id]; if(!ev) continue;
    S.ctx=p.ctx||null;
    if(ev.prep&&!ev.prep()) continue;
    if(p.id==='departure'&&!ctxMem()) continue;
    if(p.id==='departure'){const m=ctxMem(); if(m.left) continue;}
    S.seen[p.id]=S.turn;
    if(ev.silent){S.phase='silent';S.cur={id:p.id};return true;}
    if(ev.pre) ev.pre();
    S.cur={id:p.id,ctx:S.ctx,text:ev.text()}; S.res=null; S.phase='event';
    return true;
  }
  return false;
}
function getOpts(ev){return typeof ev.opts==='function'?ev.opts():ev.opts;}
function choose(i){
  const ev=EV[S.cur.id]; S.ctx=S.cur.ctx; const o=getOpts(ev)[i]; if(!o) return;
  if(o.req&&!o.req()) return;
  const b={L:S.L,T:S.T,D:S.D,H:S.H,n:act().length};
  let extra=soft(()=>{ap(o.e);return o.fx?o.fx():'';}); clampAll();
  const res=[o.r,extra].filter(Boolean).join(' ');
  S.res={choice:o.t,text:res,d:{L:S.L-b.L,T:S.T-b.T,D:S.D-b.D,H:S.H-b.H,n:act().length-b.n}};
  save(); render();
}
function cont(){ S.res=null; S.cur=null; if(!nextEvent()){ if(S._ret){S.phase=S._ret;S._ret=null;} else settle(); } save(); render(); }

/* ---------- 月度流程 ---------- */
const WK=4, ACT_SCALE=.3;
function runActs(){
  const keys=['L','T','D','H','M','B','self','RT','HA','HP','KN'],b={};keys.forEach(k=>b[k]=S[k]);
  const st=Object.assign({},S.stats),mc=new Map(S.members.map(x=>[x,x.c]));
  S.acts.forEach(id=>{const a=ACTS.find(x=>x.id===id); if(a) a.run();});
  keys.forEach(k=>S[k]=b[k]+(S[k]-b[k])*ACT_SCALE);
  ['admin','council','guide','retreat'].forEach(k=>S.stats[k]=st[k]+(S.stats[k]-st[k])*ACT_SCALE);
  S.stats.acts=(S.stats.acts||0)+S.acts.length;
  S.members.forEach(x=>{if(mc.has(x))x.c=mc.get(x)+(x.c-mc.get(x))*ACT_SCALE;});
}
function weekEvents(){
  let p=[];
  if(S.wk===0){
    const all=buildPending();all.forEach(e=>e.wk=e.r?ri(0,WK-1):0);
    S.mplan=all.filter(e=>e.wk>0);p=all.filter(e=>e.wk===0);
  } else {
    p=(S.mplan||[]).filter(e=>e.wk===S.wk);S.mplan=(S.mplan||[]).filter(e=>e.wk!==S.wk);
    S.queue=S.queue.filter(q=>{if(q.at<=S.turn){p.push({id:q.id,ctx:q.ctx});return false;}return true;});
    here().forEach(m=>{if(m.low>=12&&!m.flagged&&p.length<4){m.flagged=1;p.push({id:'departure',ctx:{m:m.id}});}});
    if(S.B>=88&&!p.some(x=>x.id==='burnout')&&eligibleRep('burnout'))p.push({id:'burnout'});
  }
  return p.slice(0,4);
}
function startMonth(){
  S._actNote=[];
  soft(runActs);
  S.actsDone=S.acts.slice(); if(S.acts.length)S.lastActs=S.acts.slice(); S.acts=[];
  clampAll();
  S.pending=weekEvents();
  if(!nextEvent()) settle();
  save(); render();
}
function settle(){ soft(settle0); applyCheats(); if(S.autoM===S.turn&&S.report&&!S.report.monthEnd&&!window._nr){nextMonth();return;} if(S.opt&&S.opt.quick&&S.report&&!S.report.monthEnd&&!S.report.notes.length&&!window._nr){nextMonth();} }
function settle0(){
  ensureLayout();
  const notes=(S._actNote||[]).slice(); S._actNote=[];
  const lines=[];
  const cap=capacity(); const m=Mo(); const monthEnd=S.wk===WK-1;
  // 稀释度与周日共修（每周）
  const maxDil=allowedMax(); S.dil=Math.min(S.dil,maxDil);
  const dil=S.dil;
  S.L+=(dil-50)/35/WK; S.T+=(50-dil)/100*2.4/WK;
  const LB=layoutEval();
  const visitors=Math.max(0,Math.min(Math.round(LB.park*1.6*LB.visMult),Math.round(cap*.55*(1-dil/100)*(.25+S.T/100)+S.H/14)));
  const pres=here();

  const c=document.createElement('canvas');c.width=g[0].length;c.height=g.length;const x=c.getContext('2d');

}

function ropeSVG(v,color){
  // 像素钢丝：两根柱子，绳子按 4px 台阶下垂，住持的小人站在当前数值处
  const W=150,H=18; const sag=Math.round(7-v/100*5);
  let s=`<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" shape-rendering="crispEdges" aria-hidden="true">`;
  s+=`<rect x="0" y="3" width="3" height="15" fill="#3d5688"/><rect x="${W-3}" y="3" width="3" height="15" fill="#3d5688"/><rect x="0" y="16" width="${W}" height="2" fill="#0a1222"/>`;
  const yAt=x=>{const t=x/W;return 5+Math.round(4*t*(1-t)*sag);};
  for(let x=3;x<W-3;x+=3) s+=`<rect x="${x}" y="${yAt(x)}" width="3" height="1" fill="${color}"/>`;
  const px=Math.round(3+v/100*(W-12)); const py=yAt(px+3);
  s+=`<image href="${spriteURL(playerTraits(),'tiny')}" x="${px}" y="${py-9}" width="7" height="9" style="image-rendering:pixelated"/>`;
  return s+'</svg>';
}

    {t:"Raise feed for him through churches and the member chat",e:{T:3,B:4,r:{chuy:5},f:{droughtDone:1}},r:"Hank donates a truckload of hay. \"I owe the cows,\" he says."},
    {t:"Sorry, can't help",e:{f:{droughtDone:1},r:{chuy:-3}},r:"He sells three head. In a photo from the auction barn, you recognize one of them."}]});
E({id:'cow_tiktok',tag:"Media · Comedy",title:"Cow at the Stupa",ch:[3,4],w:5,cond:()=>S.f.cattleGraze&&S.fac.stupa>0&&!S.f.cowViral,
  text:()=>`A tourist posts a video: a longhorn slowly circles the white stupa three times, then lies down beside the prayer wheel. Caption: "Even the cows are doing kora."`,
  opts:[{t:"Repost it: \"More diligent than any of us\"",e:{H:14,f:{cowViral:1}},fx(){post(80000);return "Eighty thousand shares. Chuy says the cow is named Biscuit and has never once walked in a straight line.";}},
    {t:"No comment",e:{H:6,f:{cowViral:1}},r:"The video goes viral anyway. Chuy prints a screenshot and hangs it in his barn."}]});
E({id:'peaches',tag:"People · Chuy",title:'Peaches',ch:[3,4],w:6,cond:()=>S.npc.chuy>=8&&!S.f.peachesDone,
  text:()=>`Chuy's daughter Lupe knocks on the door. Peaches, their oldest cow, can't stand up anymore; the vet says it's a matter of days. "My dad's too embarrassed to ask," she says, "but he wants to know if you could... say something for her? He says you're the only people who take animals seriously."`,
  opts:[{t:"Take a few members to the ranch to chant and dedicate merit for Peaches",e:{M:5,L:1,T:2,r:{chuy:8},f:{peachesDone:1}},fx(){return has('hank')?"Hank comes too. Halfway through the chanting, this man who has barbecued beef for forty years crouches beside Peaches and keeps stroking her head.":"Peaches dies early the next morning. Chuy says she went quietly.";}},
    {t:"Teach Lupe a short dedication prayer so the family can say it themselves",e:{M:3,r:{chuy:5},f:{peachesDone:1}},r:"Later, Lupe copies the dedication onto a board in the cattle pen."}]});
E({id:'land_P2',tag:"Land · South Meadow",title:"Saturday Market",qonly:1,
  text:()=>`The South Meadow runs right along the county road. Nima Sherpa, who runs a momo stand in Dallas, drives past, stops, looks for a long time, then comes to find you: "How about a market here on Saturdays? I sell momos, the local farmers sell vegetables and honey. You charge a little for stalls."`,
  opts:[{t:"Start a Saturday market",e:{T:3,add:'nima',f:{market:1}},r:"Eleven stalls show up the first Saturday. Unlocked \"Market Stall\" — the more along the road, the more income."},
    {t:"Holidays only",e:{T:1,f:{marketFest:1}},r:"Around Losar and Thanksgiving, the South Meadow gets lively for a while."},
    {t:"Decline; keep the South Meadow quiet",e:{L:1},r:"Nima says he understands, then buys a membership."}]});
E({id:'market_inspect',tag:"Neighbors & City Hall",title:"Health Inspection",ch:[2,3,4],w:6,cond:()=>S.f.market&&!S.f.inspectDone,
  text:()=>`The county health inspector comes to the market and points at Nima's steamer: "How long has this meat filling been sitting at room temperature?" Nima says: "In my village, three days is fine."`,
  opts:[{t:"Get proper permits for every vendor",e:{D:-400,T:2,f:{inspectDone:1}},r:"From then on the market is strung with a row of laminated permits. Nima says they're the most expensive prayer flags he's ever seen."},
    {t:"Offer the inspector a momo",e:{f:{inspectDone:1}},fx(){if(chance(.5)){ap({T:3});return "He eats two, issues a \"correct within 30 days\" notice, and buys a box to go.";}ap({D:-600});return "He declines the momo and writes a fine.";}}]});
E({id:'market_influencer',tag:"Media",title:"Hidden Gem",ch:[2,3,4],w:5,cond:()=>S.f.market&&!S.f.influDone,
  text:()=>`A home-decor blogger from the Magnolia orbit posts a video: "Hidden gem on Lake Waco: farmhouse-chic Buddhist temple + Saturday market." In it she calls the stupa "that white thing."`,
  opts:[{t:"Welcome more tourists",e:{H:10,D:600,L:-1,gen:2,tourist:true,f:{influDone:1}},r:"The next Saturday, traffic backs up on the county road for twenty minutes."},
    {t:"Put up a sign at the market entrance explaining the Dharma",e:{H:5,L:1,f:{influDone:1}},r:"The sign runs three hundred words. Most people just photograph the prayer-flag pattern on it."}]});
E({id:'land_P3',tag:"Land · North Slope",title:"Bones on the North Slope",qonly:1,
  text:()=>`While grading a foundation on the North Slope, the excavator bucket strikes a bone longer than a man. The Waco Mammoth National Monument is not far away. Dr. Lin, a Baylor paleontologist, arrives first thing the next morning, crouches at the edge of the pit, voice trembling.`,
  opts:[{t:"Stop work; hand it to Baylor to excavate",e:{T:5,H:8,M:2,f:{fossil:1}},r:"The dig lasts six months. The paper's acknowledgments thank you by name — your real names, this time."},
    {t:"Build a small display pavilion, open to the public",e:{D:-800,T:3,H:5,f:{fossilShow:1}},fx(){placeOrTray('fossil');return '';},r:"The pavilion's sign reads both \"Pleistocene Columbian Mammoth\" and \"All compounded things are impermanent.\""},
    {t:"Quietly fill it in and keep building",e:{M:-3},fx(){queue('fossil_found',10);return "You tell yourself it was just a rock.";}}]});
E({id:'fossil_found',tag:"Media",title:"The Mammoth That Was Reburied",qonly:1,
  text:()=>`A member posts the old excavator photo on Facebook and asks: "What's this?" Dr. Lin replies in the comments with a single exclamation mark.`,
  opts:[{t:"Apologize; invite Baylor to dig it up again",e:{T:-2,H:10,f:{fossil:1}},r:"The mammoth is unearthed a second time. This time it makes KWTX."},
    {t:"Delete the post",e:{T:-5,H:6},r:"The screenshots already exist."}]});
E({id:'land_P4',tag:"Land · Oak Grove",title:"Golden-cheeked Warbler",qonly:1,
  text:()=>`A U.S. Fish and Wildlife Service surveyor hears a birdsong in your newly bought oak grove: the golden-cheeked warbler, an endangered bird that breeds nowhere on Earth but Central Texas. "This grove," she says, "is best left alone."`,
  opts:[{t:"Pledge protection: only retreat cabins and small objects here",e:{T:4,L:2,M:3,f:{warblerProtect:1}},r:"You hang a sign at the edge of the grove: \"Warblers in retreat. Please do not disturb.\""},
    {t:"Apply for a permit, build as planned",e:{D:-600},r:"The permit comes through, along with twenty pages of seasonal construction restrictions."},
    {t:"Ignore it",e:{},fx(){queue('warbler_fine',8);return "You put the surveyor's card in a drawer.";}}]});
E({id:'warbler_fine',tag:"Neighbors & City Hall",title:"The Fine",qonly:1,
  text:()=>`The surveyor returns with a fine: clearing understory brush during breeding season, in violation of the Endangered Species Act.`,
  opts:[{t:"Pay the fine and pledge protection",e:{D:-3000,f:{warblerProtect:1}},r:"You now have a grove you can't build in, and a federal employee who drops by often to listen to the birds."},
    {t:"Hire a lawyer to contest it",e:{D:-1500,T:-3},r:"The lawyer says your chances \"depend on the bird.\""}]});
E({id:'land_P5',tag:"Land · Northwest Woods",title:"Hunting Season",qonly:1,
  text:()=>`In November a hunter named Wade knocks on the door with a deer tag. Every year the previous owner leased the Northwest Woods to him and his brothers for deer season. "It's been that way since my granddad's day." He finishes and glances at your mala.`,
  opts:[{t:"No more hunting",e:{L:2,T:-2,f:{noHunt:1}},r:"Wade says nothing. The next fall, there are so many deer in the woods it looks like they're holding a meeting."},
    {t:"Keep leasing hunting season",e:{L:-4,f:{huntLease:1}},r:"An extra rent check every fall. Tenzin asks how this differs from opening a barbecue joint."},
    {t:"Hunters may come, but only to sit",e:{L:1,T:1},fx(){if(chance(.4)){ap({gen:1});return "Wade actually comes. He sits at the edge of the woods all afternoon and never fires a shot. Later he becomes a Sunday practice regular.";}return "Wade laughs: \"Sitting is hunting. You just don't shoot.\" He never comes back.";}}]});
E({id:'land_P6',tag:"Land · Bottomland",title:"Floodplain",qonly:1,
  text:()=>`Only after buying the southwest bottomland do you notice it's shaded blue on the county's FEMA flood map. In heavy rain, the little pond becomes a big pond.`,
  opts:[{t:"Dig a drainage ditch",e:{D:-1200,f:{drained:1}},r:"The ditch is dug. The pond is still there; it just stays put."},
    {t:"Make it a wetland and let it grow",e:{L:1,T:1,f:{wetland:1}},r:"The next spring a flock of egrets arrives. Hartley's grad student says it could go into the \"ecological turn\" chapter of the dissertation."},
    {t:"Leave it for now",e:{},fx(){queue('pond_flood',ri(4,9));return "You look up at the sky. The sky is very blue.";}}]});
E({id:'pond_flood',tag:"Texas Conditions",title:"The Pond Rises",qonly:1,
  text:()=>`A night of downpour, and the bottomland pond spills over the berms into the parking lot. Sunday morning, three cars are stuck in the mud.`,
  opts:[{t:"Everyone pushes cars, then digs a ditch",e:{D:-1200,T:2,c:{all:2},f:{drained:1}},r:"Pushing cars builds more unity than group practice."},
    {t:"Ask Chuy to bring his tractor",req:()=>S.npc.chuy>=4,rq:"Requires a friendship with Chuy",e:{r:{chuy:2},T:2},r:"Chuy's tractor hauls the cars out one by one. He won't take money."}]});
E({id:'land_P7',tag:"Land · Lakeshore",title:"Army Corps of Engineers",qonly:1,
  text:()=>`Lake Waco is managed by the U.S. Army Corps of Engineers. The second week after you buy the lakeshore, Ms. Pruett of the Corps pulls up in a white pickup with a handout on shoreline use permits: docks require approval, and no building at the water's edge without one.`,
  opts:[{t:"Apply for the permit by the book",e:{D:-400,f:{shorePermit:1}},r:"Permit granted. Unlocked \"Dock.\""},
    {t:"Offer her butter tea",e:{},fx(){if(chance(.5)){S.f.shorePermit=1;return "She takes a sip, frowns, takes another. \"The process is the process,\" she says, \"but I'll give it a nudge.\"";}return "She politely declines: \"We can't accept anything. Including tea.\"";}}]});
E({id:'land_P8',tag:"Land · Lakeshore",title:"The Shallows",qonly:1,
  text:()=>`The south end of the lakeshore has a stretch of shallows where, at dusk, the sun sets right on the treetops across the water. Tenzin says it would be a good place for water offerings. Ms. Pruett's white pickup pauses for a moment in the distance.`,
  opts:[{t:"Apply for a dock permit",e:{D:-400,f:{shorePermit:1}},r:"Unlocked \"Dock.\""},
    {t:"Leave it as it is",e:{L:2},r:"You set a flat stone in the shallows. In the evenings, someone is usually sitting on it."}]});
E({id:'fangsheng',tag:"Dharma & Purity",title:"Life Release",ch:[2,3,4],w:7,cond:()=>S.layout&&S.layout.items.some(i=>i.t==='dock')&&!S.f.fangDone,
  text:()=>`During Saga Dawa, a few members buy two hundred fish from the bait shop to release off the dock. A Parks and Wildlife game warden happens to be at the lake: "Those are non-native. Put them in and there'll be trouble."`,
  opts:[{t:"Skip the release; clean up the shoreline instead",e:{T:4,L:0,f:{fangDone:1}},r:"You haul out eleven bags of trash, an old refrigerator, and a 1993 license plate."},
    {t:"Release only native fish the warden approves",e:{L:2,T:2,D:-200,f:{fangDone:1}},r:"The warden helps you pick the fish. When they're released, he puts his palms together too, briefly."},
    {t:"Release them anyway",e:{L:1,f:{fangDone:1}},fx(){ap({D:-800,T:-4,H:8});return "Fine: $800. KWTX headline: \"Waco Buddhists 'Liberate' Invasive Species into Lake.\"";}}]});

/* --- 神父 Ortiz --- */
E({id:'ortiz',tag:"Interfaith · New Face",title:"The Priest",ch:[1,2],w:6,cond:()=>has('rosa')&&!S.f.ortizMet&&S.turn>=8,
  text:()=>`Father Ortiz from Rosa's parish comes out to the farm. He says he hasn't come to bring anyone back; he just wanted to see "where Rosa goes every Saturday." He stands before the altar a long while, looking at Green Tara: "She wears green, just like Our Lady of Guadalupe."`,
  opts:[{t:"Ask him to sit and listen to the Praises to Tara",e:{T:3,r:{ortiz:5},f:{ortizMet:1}},r:"Afterward he says: \"We say the Hail Mary over and over like that, too.\""},
    {t:"Debate him in earnest on Our Lady versus Tara",e:{L:1,r:{ortiz:2},f:{ortizMet:1}},r:"You argue until dark. Neither convinces the other. You agree to continue next time."},
    {t:"Exchange polite pleasantries",e:{f:{ortizMet:1}},r:"He leaves a copy of the parish Mass schedule."}]});
E({id:'guadalupe',tag:"Interfaith · Ortiz",title:"December 12",months:[12],ch:[2,3],w:14,cond:()=>has('rosa')&&S.npc.ortiz>=3&&!S.f.guadDone,
  text:()=>`On the Feast of Our Lady of Guadalupe, the parish procession will pass along the county road. Rosa proposes that a Green Tara thangka walk part of the way alongside the image of the Virgin. Father Ortiz says he is "personally not opposed," then adds: "But the bishop may have opinions."`,
  opts:[{t:"Carry the Green Tara thangka in the procession",e:{T:5,L:-1,H:5,f:{guadDone:1},q:[['bishop',2]],c:{rosa:10}},r:"A mariachi band plays the same song for two ladies in green. Rosa cries."},
    {t:"Just offer roses by the roadside",e:{T:3,f:{guadDone:1},c:{rosa:4}},r:"You set out a hundred roses along the county road. As the procession passes, people nod to you."},
    {t:"Decline; don't make trouble for the priest",e:{L:1,f:{guadDone:1}},r:"Rosa says she understands, but she doesn't come to practice that day."}]});
E({id:'bishop',tag:"Interfaith · Ortiz",title:"A Letter from the Bishop",qonly:1,
  text:()=>`Father Ortiz has received a letter from the bishop's office asking him to "clarify the parish's relationship with non-Christian groups." He shows it to you: "I'll write back. I just wanted you to know."`,
  opts:[{t:"Step back quietly so he isn't put in a bind",e:{r:{ortiz:6},T:-1},r:"He shakes your hand: \"Thank you for understanding our bishop better than I do.\""},
    {t:"Write an open letter in his support",e:{H:6,r:{ortiz:2}},fx(){const s=ri(-3,4);ap({T:s});return s>=0?"The letter is picked up by a Catholic news site. The comments are surprisingly gentle.":"The bishop's office does not respond. Ortiz is reassigned to another parish for three months.";}},
    {t:"Invite him for tea and talk about nothing",e:{M:2,r:{ortiz:4}},r:"You spend the whole afternoon over tea. You talk about baseball."}]});
E({id:'ortiz_end',tag:"Interfaith · Ortiz",title:"Retirement",ch:[4],w:8,cond:()=>S.npc.ortiz>=6&&!S.f.ortizEnd,
  text:()=>`Father Ortiz is retiring, going home to San Antonio to look after his sister. On his last visit to the farm he says: "I've prayed the rosary my whole life. Today I'd like to hear you recite the Heart Sutra."`,
  opts:[{t:"Recite the Heart Sutra for him",e:{M:4,L:1,f:{ortizEnd:1}},r:"At \"form is emptiness,\" he closes his eyes."},
    {t:"He prays the rosary, you recite the Heart Sutra, together",e:{T:4,M:3,f:{ortizEnd:1}},r:"The two chants weave together like two rivers. Rosa stands in the doorway and doesn't come in."}]});

/* --- 医院 Dr. Okonkwo --- */
E({id:'icu',tag:"People · Hospice",title:"The ICU iPad",at:'2020-12',
  text:()=>`Dr. Amara Okonkwo, director of spiritual care at a Waco hospital, calls. A Vietnamese American Buddhist is critically ill with COVID in the ICU, and the family can't get in. "His daughter asked if anyone could chant for him over an iPad. I searched the whole city. I only found you."`,
  opts:[{t:"Go online and chant right away",e:{M:5,L:1,T:2,r:{okonkwo:6}},r:"A nurse props the iPad at the bedside. You chant for forty minutes. At two in the morning Dr. Okonkwo texts: \"He's gone. Very peacefully. Thank you.\""},
    {t:"Ask the Nguyen family to chant with you in Vietnamese",req:()=>has('hanh'),rq:"Requires the Nguyens",e:{M:6,T:3,r:{okonkwo:6},c:{hanh:10}},r:"Hạnh's grandmother chants Amitabha. At home, the patient's daughter chants along, crying too hard to get the words out."},
    {t:"Refer them to a Vietnamese temple in Houston",e:{M:1,r:{okonkwo:2}},r:"The temple's monk is online that same night. Dr. Okonkwo saves your number in her phone."}]});
E({id:'chaplain',tag:"People · Hospice",title:"Volunteer Chaplains",ch:[2,3],w:6,cond:()=>S.npc.okonkwo>=4&&!S.f.chaplain,
  text:()=>`Dr. Okonkwo wants to start an interfaith volunteer chaplaincy program: weekly visits to sit with dying patients on the wards. "No proselytizing," she says. "You just have to sit there and not be afraid."`,
  opts:[{t:"Bring three members to the training",e:{B:5,T:4,M:4,f:{chaplain:1}},fx(){here().slice(0,3).forEach(x=>x.c+=6);return "On the first day of training, the instructor says: \"The hardest part of sitting with the dying is not trying to fix them.\" All three members write it down in their notebooks.";}},
    {t:"Go alone",e:{B:8,S:3,M:3,f:{chaplain:1}},r:"Every Thursday afternoon, you sit in the hospital corridor for two hours."},
    {t:"Decline",e:{},r:"She says it's fine — she'll hold a spot for you."}]});
E({id:'hospice',tag:"People · Hospice",title:"The Veteran's Last Night",ch:[3,4],w:6,cond:()=>S.f.chaplain&&has('dale')&&!S.f.hospiceDone,
  text:()=>`Dr. Okonkwo calls: in the hospice ward there's a Vietnam veteran who has no religion and won't see a chaplain. The nurses say he keeps calling out the name of a buddy from his unit. Dale hears this, stands up, and goes for his car keys.`,
  opts:[{t:"Send Dale, and go with him",e:{M:5,c:{dale:12},f:{hospiceDone:1}},r:"Dale sits by the bed all night. He chants nothing. He only tells the old soldier: \"Mission's over. You can go home now.\""},
    {t:"Let Dale go alone",e:{M:4,c:{dale:8},B:-3,f:{hospiceDone:1}},r:"Dale comes back the next day, sits in the back row of the shrine room for a long time, then begins doing prostrations."}]});

/* --- 尼师 Sonam --- */
E({id:'sonam',tag:"Teachers & Lineage · New Face",title:"The Nun",ch:[2,3],w:6,cond:()=>!S.f.sonamDone&&S.turn>=28,
  text:()=>`A letter from Rinpoche: one of his students in Nepal, Ani Sonam Lhamo, has completed two three-year retreats and would like to come stay in America for three months. "Her English is not good," the letter says, "but her practice is."`,
  opts:[{t:"Clear a room in the farmhouse for her",e:{add:'sonam',L:4,RT:4,f:{sonamDone:1}},r:"She rises at four every morning; by five, the farmhouse is full of chanting. After three months she says: \"It is quiet here. I am staying.\""},
    {t:"Arrange for her to stay at the Dallas center",e:{RT:-2,f:{sonamDone:1}},r:"The Dallas center is delighted. Rinpoche replies with one word: \"Good.\" You can't tell what this \"Good\" means."}]});
E({id:'sonam_lobsang',tag:"Kagyu Politics",title:"Who Leads the Retreat",ch:[2,3,4],w:6,cond:()=>has('sonam')&&!S.f.sonamQ,
  text:()=>`Rinpoche's attendant Lobsang calls, courteous as ever: "Having a nun lead a men's retreat may not be entirely appropriate." Sonam isn't angry. She just smiles and goes on shelling beans.`,
  opts:[{t:"Back Sonam to lead the retreat",e:{L:1,RT:-2,c:{sonam:10},f:{sonamQ:1,sonamLead:1}},r:"You say: \"She has spent more time in retreat than all of us put together.\" Lobsang is silent for a long time."},
    {t:"Ask Rinpoche to decide",e:{f:{sonamQ:1}},fx(){if(chance(.65)){S.f.sonamLead=1;ap({RT:2,c:{sonam:6}});return "Rinpoche's reply is a single line: \"Whoever practices well, leads.\"";}ap({c:{sonam:-6}});return "Rinpoche says, \"Wait a while.\" Sonam goes on shelling beans.";}},
    {t:"Do as Lobsang says",e:{RT:2,c:{sonam:-15},f:{sonamQ:1}},r:"Sonam nods. That night she sits alone by the lake until very late."}]});
E({id:'sonam_retreat',tag:"Practice · Retreat",title:"Women's Retreat",ch:[3,4],w:8,cond:()=>has('sonam')&&S.f.sonamLead&&S.fac.cabin>0&&!S.f.sonamRetreat,
  text:()=>`Sonam offers to lead a month-long women's retreat. Signing up: Rosa, Hạnh, two Baylor grad students, and a retired judge from Austin.`,
  opts:[{t:"Full support",e:{L:5,M:3,f:{sonamRetreat:1}},fx(){if(!S.f.localGuide){S.f.localGuide='Ani Sonam Lhamo';S.f.localGuideId='sonam';}return "On the day they come out, the retired judge says: \"I handed down sentences for thirty years. This is the first time I've felt fully judged.\" Sonam becomes the center's retreat instructor.";}},
    {t:"Hold the men's retreat first",e:{c:{sonam:-8},f:{sonamRetreat:1}},r:"Sonam says fine. The women's retreat is pushed to the following year."}]});

/* --- Tex 与牛仔竞技 --- */
E({id:'tex',tag:"Dana · New Face",title:"The Oil Widower",ch:[3],w:6,cond:()=>!S.f.texDone,
  text:()=>`Bill "Tex" Haverford, seventy-eight, made his fortune in Permian Basin oil; his wife died last year. She came to your Sunday practice twice while she was alive. Tex writes a check for $40,000: "Build a 'Haverford Ranch Buddhist Temple,' with a bronze longhorn at the front gate. She loved longhorns."`,
  opts:[{t:"Accept, bronze longhorn and all",e:{D:40000,L:-6,H:8,f:{texDone:1,longhorn:1,refusedAll:false}},fx(){placeOrTray('longhorn');return '';},r:"The bronze longhorn goes up at the gate, finished before the stupa. Tourists love to take pictures with it."},
    {t:"Accept only the no-strings part",e:{f:{texDone:1}},fx(){if(chance(.5)){ap({D:12000,M:2});S.f.refusedAll=false;return "Tex grunts, crosses out \"Ranch Temple,\" and writes $12,000 instead. \"She didn't like being told what to do either.\"";}ap({L:1});return "Tex puts the check back in his pocket: \"My wife said you folks were stubborn. She was right.\"";}},
    {t:"Decline; invite him to come sit on Sundays",e:{L:2,M:3,f:{texDone:1,texSits:1}},r:"He actually comes. Every Sunday he sits in the back row in his cowboy hat and says nothing."}]});
E({id:'tex_rodeo',tag:"Culture Clash · Comedy",title:"Rodeo Night",ch:[3,4],w:6,cond:()=>S.f.longhorn&&!S.f.rodeoDone,
  text:()=>`Tex wants to hold a "Rodeo Night" on the farm for his late wife's birthday: bronc riding, calf roping, fireworks to close. "You folks don't kill," he says. "Nobody gets killed here either. Just thrown around some."`,
  opts:[{t:"Agree, but no calf roping",e:{D:2500,T:4,L:-2,H:6,f:{rodeoDone:1}},r:"The young bronc rider gets thrown seven times. Chuy says it's the gentlest rodeo he's ever seen."},
    {t:"Make it a memorial dinner with floating lanterns",e:{L:2,T:2,M:3,f:{rodeoDone:1}},r:"Tex sets the first lantern on the lake and says something very quietly. You don't catch it, and you don't ask."},
    {t:"Refuse",e:{f:{rodeoDone:1}},r:"Tex holds Rodeo Night on Chuy's ranch instead, and still invites you all."}]});
E({id:'tex_end',tag:"People · Tex",title:"The Will",ch:[4],w:7,cond:()=>(S.f.texSits||S.f.longhorn||S.f.rodeoDone)&&!S.f.texEnd,
  text:()=>`Tex dies in his sleep. A lawyer brings an envelope: the will leaves you a sum of money, with a handwritten note in a crooked hand: "She said this was the quietest place in Texas. Sit a little longer for the both of us."`,
  opts:[{t:"Hold forty-nine days of rites for Tex and his wife",e:{D:15000,L:2,M:5,f:{texEnd:1}},r:"On the forty-ninth day, Chuy, Hank and a few old cowboys come and stand in the back row, hats in hand."},
    {t:"Donate all of it to Dr. Okonkwo's hospice program",e:{T:5,M:8,f:{texEnd:1}},r:"The program is renamed \"The Haverford Companions.\" You think Tex would like the name, since it doesn't have the word \"Buddhist\" in it."}]});

/* --- East Waco 的 Shirley --- */
E({id:'shirley',tag:"Neighbors · New Face",title:"You Keep Buying Land",qonly:1,
  text:()=>`Marcus's aunt, Shirley Washington, who has lived in East Waco for seventy years, comes to the farm with Marcus. She looks at the new fence and says slowly: "I've seen how a place gets bought up. First one lot, then a whole street. Where do you plan to stop?"`,
  opts:[{t:"Promise to buy only vacant land near the farm, and fund East Waco's community land trust",e:{D:-500,T:5,r:{shirley:6,marcus:3},f:{landTrust:1}},r:"Shirley nods: \"I'll remember you said that.\" She does. She comes back every year to ask."},
    {t:"Explain it's for practice, not investment",e:{T:1,r:{shirley:1}},r:"She says: \"That's what everybody says.\""},
    {t:"Ask her to stay for lunch",e:{T:2,r:{shirley:3}},r:"She eats two momos and says they're not quite as good as the dumplings at her church."}]});
E({id:'juneteenth',tag:"Interfaith · Calendar",title:"June 19",months:[6],ch:[2,3,4],rep:1,cd:11,w:12,cond:()=>S.npc.shirley>=1,
  text:()=>`June 19th, Juneteenth: the day in 1865 when word from Galveston, Texas finally reached the last people still held in slavery. East Waco's community park has barbecue, a parade and a gospel choir. Shirley asks if you're coming.`,
  opts:[{t:"Everyone volunteers",e:{T:4,M:2,r:{shirley:3,marcus:2}},r:"Hank runs the grill, using jackfruit. Shirley takes a bite: \"Next time put some meat in it, baby.\""},
    {t:"Bring a prayer flag to hang by the choir stage",e:{T:2,H:3,r:{shirley:1}},r:"Just as the choir reaches \"Lift Every Voice,\" the wind stirs the prayer flag."},
    {t:"Not this year",e:{},r:"Shirley says nothing. The next day Marcus calls to ask if you're sick."}]});

/* --- 球员 Kyle --- */
E({id:'kyle',tag:"People · New Face",title:"The Linebacker",ch:[2,3],w:5,cond:()=>!S.f.kyleDone,
  text:()=>`Kyle Brennan, a linebacker on the Baylor football team, got a concussion mid-season, and the team doctor suggested he try meditation. He has two hundred thousand followers on Instagram. Before stepping inside, he asks: "Can I take pictures in here?"`,
  opts:[{t:"Welcome, but no photos please",e:{add:'kyle',L:1,f:{kyleDone:1}},r:"He hands his phone to Dale for safekeeping. Forty minutes later, he says it's the first time in three months his head hasn't hurt."},
    {t:"Let him shoot whatever he wants",e:{add:'kyle',H:12,L:-2,gen:3,tourist:true,f:{kyleDone:1}},r:"The video gets a million views. The next Sunday, thirty people show up in green jerseys."},
    {t:"Introduce him to Dale's veterans' class",req:()=>has('dale'),rq:"Requires Dale",e:{add:'kyle',c:{dale:5},f:{kyleDone:1}},r:"Dale and Kyle become friends fast. Both know what it's like to take hits to the head."}]});
E({id:'kyle_nil',tag:"Dana · Satire",title:"Energy Drink",ch:[2,3,4],w:5,cond:()=>has('kyle')&&!S.f.nilDone,
  text:()=>`Kyle has signed an NIL endorsement deal with an energy drink company. They want to shoot an ad in your shrine room: Kyle meditating before the Buddha, then opening his eyes and taking a swig. Tagline: "Find Your Zen. Then Crush It."`,
  opts:[{t:"Refuse",e:{L:2,c:{kyle:-8},f:{nilDone:1}},r:"Kyle says he understands. The ad ends up being shot at a Japanese restaurant."},
    {t:"Accept",e:{D:5000,L:-5,H:10,f:{nilDone:1}},r:"After the ad airs, the shrine room gets two hundred new Google reviews, most of them asking where to buy the drink."},
    {t:"Ranch only — not in the shrine room",e:{D:2500,L:-1,H:5,f:{nilDone:1}},r:"The ad featured cattle, a windmill and a stand of live oaks. No Buddhas. The sponsor said it felt \"more Texas.\""}]});

/* --- 警员 Garza、拉比 Feld、Joy Kim 牧师 --- */
E({id:'garza',tag:"People · Community",title:"Community Liaison Officer",ch:[2,3,4],w:6,cond:()=>(S.seen.harass_armed!=null||S.seen.harass_unarmed!=null||S.seen.vandal!=null)&&!S.f.garzaDone,
  text:()=>`Luis Garza, community liaison officer with the Waco PD, drives out to the farm. He read the report on what happened last time, he says, and feels the department "didn't do enough." He'd like you to teach a class at the police academy: "What to do when you walk into a place of worship you don't recognize."`,
  opts:[{t:"Teach the class",e:{T:4,B:5,r:{garza:5},f:{garzaDone:1}},r:"The first question: \"Do we take our shoes off?\" You say yes. All forty cadets look down at their boots."},
    {t:"Bring Dale along",req:()=>has('dale'),rq:"Requires Dale",e:{T:5,c:{dale:8},r:{garza:5},f:{garzaDone:1}},r:"Dale talks about veterans and trauma. The classroom goes very quiet."},
    {t:"Decline",e:{f:{garzaDone:1}},r:"Garza leaves you his personal number."}]});
E({id:'seder',tag:"Interfaith",title:"Passover Seder",months:[4],ch:[2,3,4],w:8,cond:()=>!S.f.sederDone,
  text:()=>`Rabbi Hannah Feld of a Waco synagogue invites you all to a Passover seder. On the invitation she has written: "We tell a story about leaving, and about exile. I think your Tibetan friends will understand."`,
  opts:[{t:"Go with Tenzin",req:()=>has('tenzin'),rq:"Requires Tenzin",e:{T:3,c:{tenzin:8},f:{sederDone:1}},r:"When they reach \"Next year in Jerusalem,\" Tenzin says softly, \"Next year in Lhasa.\" The rabbi hears him and raises her glass."},
    {t:"Bring a plate of momos",e:{T:3,H:1,f:{sederDone:1}},r:"Momo dough is leavened. Laughing, the rabbi sets them on a separate table: \"Nothing leavened during Passover. Tomorrow, though.\""},
    {t:"Decline",e:{f:{sederDone:1}},r:"The rabbi writes back: \"You're invited next year too.\""}]});
E({id:'vandal',tag:"Neighbors · Hate",title:"Words on the Barn",ch:[2,3],w:5,cond:()=>!S.f.vandalDone,
  text:()=>`Sunday morning, two words have been sprayed in white paint across the red wall of the barn: GO HOME. Tenzin stands in front of it. "Do they know where my home is?" That same week, someone smashes the windows of Rev. Joy Kim's Korean Presbyterian church.`,
  opts:[{t:"Ask the neighbors to help repaint",e:{T:5,M:2,f:{vandalDone:1}},r:"Forty people come, including Chuy, Shirley and two Baptist families who have never set foot here. After the painting, everyone eats lunch in front of the barn."},
    {t:"Call the police, and hold a vigil with Rev. Joy Kim",e:{T:4,M:3,f:{vandalDone:1}},r:"At the vigil, the Presbyterian choir sings a Korean hymn, and you recite a dedication of merit."},
    {t:"Leave the words up for a month, as a reminder",e:{L:1,H:5,f:{vandalDone:1}},r:"Over the month, more than thirty people drive out just to see the wall. On day thirty-one, you paint over it."}]});
E({id:'joykim',tag:"Interfaith",title:"Joint Prayer",ch:[3,4],w:5,cond:()=>S.f.vandalDone&&!S.f.joyDone,
  text:()=>`Rev. Joy Kim proposes an annual joint prayer service, hosted in rotation by the city's minority faith communities: the Korean Presbyterians, the Vietnamese temple, the Islamic center, the synagogue, and you. "We need Waco to get used to us."`,
  opts:[{t:"Host the first one",e:{T:5,D:-400,H:4,f:{joyDone:1}},fx(){if(!S.f.councilAsked){S.f.councilAsked=1;queue('council_seat',2);}return '';},r:"For the first time, the barn shrine room is full of people of five faiths. Marcus says it's the most crowded \"Waco\" he has ever seen."},
    {t:"Attend, but don't host",e:{T:2,f:{joyDone:1}},r:"The first one is held at the mosque. The butter tea you bring is drunk to the last drop."}]});
E({id:'drought',tag:"Texas Conditions",title:"Burn Ban",ch:[2,3,4],months:[7,8],w:6,cond:()=>!S.f.burnBan||S.turn-S.f.burnBan>12,
  text:()=>`The county issues a burn ban: fifty days without rain, and no open flames outdoors of any kind. The fire chief calls personally to make sure you heard: "That includes those butter candles of yours."`,
  opts:[{t:"Put out every outdoor butter lamp",e:{L:-1,T:2},fx(){S.f.burnBan=S.turn;return "That month, for the first time, there are no lamps before the stupa. Someone online writes: \"Even the Buddhists are scared of a Texas summer.\"";}},
    {t:"Move all the lamps indoors",e:{D:-150},fx(){S.f.burnBan=S.turn;return "The shrine room becomes a steamer basket. The A/C bill goes up by a hundred and fifty dollars.";}}]});

E({id:'lorraine',tag:"Neighbors · New Face",title:"The Pie Next Door",ch:[1,2],w:7,cond:()=>!S.f.lorraineMet&&S.turn>=4,
  text:()=>`Lorraine Pickett from the farm next door, eighty-two, widowed three years. She stands at the door holding a pecan pie still giving off steam: "I've been Baptist since 1958. I just wanted to see what on earth you all do on Sundays that's so quiet."`,
  opts:[{t:"Invite her in to sit a while",e:{T:3,add:'lorraine',f:{lorraineMet:1}},r:"She sits in the back row for forty minutes without moving. On her way out: \"A sight quieter than our choir. I like quiet.\""},
    {t:"Accept the pie; give her some butter tea",e:{T:2,f:{lorraineMet:1}},r:"She calls the next day: \"That tea was salty. Did you all mix something up?\""}]});
E({id:'lorraine_pie',tag:"Comedy",title:"The Pie War",ch:[2,3],w:5,cond:()=>has('lorraine')&&has('hank')&&!S.f.pieDone,
  text:()=>`Lorraine hears that Hank is making "Buddhist barbecue" and announces a showdown before Thanksgiving: her pecan pie against his smoked jackfruit pie. The judges: the entire membership.`,
  opts:[{t:"Hold the Pie War",e:{T:4,c:{lorraine:8,hank:8},f:{pieDone:1}},r:"Lorraine wins, three to two. Hank says he was beaten fair and square, then asks for the recipe."},
    {t:"Declare them both winners",e:{T:2,f:{pieDone:1}},r:"Lorraine says, \"So this is that 'Middle Way' of yours. I don't agree with it.\""}]});
E({id:'lorraine_pastor',tag:"Interfaith",title:"Her Pastor",ch:[2,3],w:5,cond:()=>has('lorraine')&&!S.f.lorPastor,
  text:()=>`Lorraine's pastor pays her a home visit and gently cautions her not to be "led astray." The next week she arrives with a Bible and a cushion. "I told him I pray here. I just don't do it out loud."`,
  opts:[{t:"Tell her praying here is just fine",e:{T:3,c:{lorraine:10},f:{lorPastor:1}},r:"From then on she sits in the back row every Sunday, Bible on her knees."},
    {t:"Suggest she not make trouble; go back to church for now",e:{c:{lorraine:-10},M:2,f:{lorPastor:1}},r:"She says, \"I'm eighty-two, honey. I know where I'm going.\""}]});
E({id:'lorraine_end',tag:"People",title:"The Last Pie",ch:[4],w:7,cond:()=>has('lorraine')&&!S.f.lorEnd,
  text:()=>`Lorraine died in her sleep. Her daughter drives down from Dallas and hands you a yellowed card: the pecan pie recipe. On the back: "For the quiet folks by the lake. The funeral will be at our church, but ask them to come sit a while."`,
  opts:[{t:"Everyone attends her Baptist funeral",e:{T:5,M:4,f:{lorEnd:1}},fx(){leave(mem('lorraine'),"passed away peacefully");return "You fill the last two pews. In the eulogy the pastor says, \"In her later years she found a kind of quiet.\" He doesn't say where she found it, but he glances your way.";}},
    {t:"Dedicate merit for her in the shrine room, then go to the funeral",e:{L:1,T:3,M:4,f:{lorEnd:1}},fx(){leave(mem('lorraine'),"passed away peacefully");return "That Sunday you bake a pie from her recipe and set it on the offering table.";}}]});
E({id:'bo_noise',tag:"Neighbors & City Hall",title:"Conch at Dawn",ch:[1,2],w:6,cond:()=>!S.f.boMet&&S.turn>=6,
  text:()=>`At 5:30 a.m., Sheriff's Deputy Bo Tillman pulls up at your gate. Someone has called in "a man blowing a horn down by the lake." He looks at the conch in your hand. "Is that… an instrument?"`,
  opts:[{t:"Explain, and promise nothing before 7 a.m.",e:{T:2,r:{bo:4},f:{boMet:1}},r:"He writes in his notebook: \"Seashell. After seven.\" Then he asks if he can give it a try."},
    {t:"Offer him tea and play it for him",e:{r:{bo:6},H:2,f:{boMet:1}},r:"When you finish, he says, \"Beats my nephew's trombone.\" The caller never calls again."}]});
E({id:'bo_warning',tag:"Texas Conditions",title:"The Deputy Calls",ch:[2,3,4],months:[4,5],w:6,cond:()=>S.npc.bo>=4&&!S.f.boWarn,
  text:()=>`Three in the afternoon, Bo calls: "Something on radar is headed for the lake. You folks have anything going on today?" There are over twenty people in the shrine room.`,
  opts:[{t:"Evacuate now to the shelter or the sturdiest room",e:{T:3,f:{boWarn:1}},fx(){return on('shelter')?"Twenty-some people file into the storm shelter in good order. When the wind has passed, Bo drives by for a look and gives a thumbs-up.":"Everyone crowds into the innermost room and recites long-life prayers for half an hour. A few shingles come off the roof.";}},
    {t:"Thank him; keep practicing",e:{L:1,f:{boWarn:1}},fx(){if(on('shelter'))return "The tornado turns aside two miles out.";ap({D:-800});return "Hail smashes the windshields of three cars in the parking lot. The insurance company wants to know \"why you didn't evacuate.\"";}}]});
E({id:'bo_deer',tag:"Comedy",title:"Deer on the County Road",ch:[2,3,4],w:4,cond:()=>S.npc.bo>=4&&!S.f.deerDone,
  text:()=>`A whitetail has been hit on the county road, right outside your gate. Bo calls: "By the book, we'd just haul it off. But I figured you all might… want to say something first?"`,
  opts:[{t:"Take a few people to chant for it",e:{M:3,L:1,r:{bo:3},f:{deerDone:1}},r:"Bo stands off to one side, hat in his hands."},
    {t:"Thank him for the thought",e:{r:{bo:1},f:{deerDone:1}},r:"He says, \"No problem. Just thought I'd ask.\""}]});
E({id:'amira',tag:"Interfaith · New Face",title:"A Place to Pray",ch:[2,3,4],w:6,cond:()=>!S.f.amiraMet&&(roomsOn('interfaith').length>0||S.turn>=40),
  text:()=>`Dr. Amira Haddad, a pediatrician from Syria, works at a hospital in Waco. Passing the farm one Friday afternoon, she asks if she might borrow a quiet corner to pray: "The mosque is too far, and I only have twenty minutes."${roomsOn('interfaith').length?" You take her to the interfaith prayer room.":''}`,
  opts:[{t:"Tell her to come any time",e:{T:4,f:{amiraMet:1}},r:"She leaves a small prayer rug here. After that she comes every Friday."},
    {t:"Take her to the quietest room, and give her the mosque's Zoom schedule",e:{T:2,f:{amiraMet:1}},r:"She smiles. \"I know the mosque's Zoom schedule. What I want is a place where I don't have to explain myself.\""}]});
E({id:'iftar',tag:"Interfaith",title:"Iftar",months:[3,4],ch:[2,3,4],w:8,cond:()=>S.f.amiraMet&&!S.f.iftarDone,
  text:()=>`Ramadan. Amira proposes holding an iftar dinner at the farm, inviting families from the mosque along with your members. At sunset, the call to prayer and the conch will sound over the same lake.`,
  opts:[{t:"Host iftar in the dining hall or by the barn",e:{T:5,M:3,D:-200,f:{iftarDone:1}},r:"At the moment of sunset, forty people eat their first date together. Hank's smoked jackfruit vanishes."},
    {t:"Invite only Amira's family",e:{T:2,f:{iftarDone:1}},r:"Her two children chase butterflies around the stupa until dark."}]});
E({id:'volkov_eeg',tag:"Academia · New Face",title:"The EEG Cap",ch:[2,3],w:5,cond:()=>!S.f.eegDone,
  text:()=>`Prof. Dmitri Volkov of Baylor's Department of Psychology and Neuroscience wants to recruit long-term practitioners for an EEG study: put on a 64-channel electrode cap and measure how the complexity of brain signals changes during sitting meditation. "I have no interest in enlightenment," he says. "I am interested only in Lempel-Ziv complexity."`,
  opts:[{t:"Encourage members to volunteer",e:{T:3,H:4,f:{eegDone:1,eegStudy:1}},r:"Hank signs up first. He asks whether the cap can go on over his cowboy hat."},
    {t:"Only those who have finished ngöndro",e:{L:2,f:{eegDone:1,eegStudy:1}},r:"Volkov says the sample is too small. You say practice has always been a small sample."},
    {t:"Decline: practice is not data",e:{L:1,f:{eegDone:1}},r:"He leaves politely, then goes to see Chad. The following week, Chad's center hangs a banner: \"SCIENTIFICALLY VALIDATED.\""}]});
E({id:'volkov_paper',tag:"Academia · Media",title:"The Paper",ch:[3,4],w:6,cond:()=>S.f.eegStudy&&!S.f.paperDone,
  text:()=>`Volkov's paper is out: during sitting meditation, the brain-signal complexity of long-term practitioners differs significantly from controls. The press release is headlined "Science Proves Meditation Changes the Brain." The paper itself says "correlation, not causation."`,
  opts:[{t:"Explain \"correlation isn't causation\" in a talk",e:{L:2,T:1,f:{paperDone:1}},r:"The members listen closely. Later, Volkov retweets the recording of your talk."},
    {t:"Post the press release by the door",e:{H:10,gen:2,tourist:true,L:-2,f:{paperDone:1}},r:"A wave of people arrives wanting to \"change their brains.\" They ask how long they have to sit before they \"level up.\""}]});
E({id:'jasmine',tag:"People · New Face",title:"Night-Shift Nurse",at:'2020-11',
  text:()=>`Jasmine Reyes, an ICU nurse, drives straight to the farm after a night shift. Still in scrubs, she sits in the parking lot a long while before coming in. "I lost eleven people this month," she says. "I don't want to cry in front of my patients."`,
  opts:[{t:"Sit with her, say nothing",e:{add:'jasmine',M:3},r:"She sits for an hour, then says, \"Thank you for not giving me a lecture.\""},
    {t:"Teach her a simple breathing practice",e:{add:'jasmine',L:-1,c:{jasmine:5}},r:"She says she'll use it while changing into her PPE."}]});
E({id:'jasmine_shift',tag:"People · Hospice",title:"Bedside to Bedside",ch:[2,3],w:5,cond:()=>has('jasmine')&&S.f.chaplain&&!S.f.jasDone,
  text:()=>`Jasmine asks whether she can join Dr. Okonkwo's volunteer spiritual care program. "In the ward I used to be there to save people," she says. "Now I want to learn how to be with them."`,
  opts:[{t:"Recommend her",e:{c:{jasmine:12},T:2,M:3,f:{jasDone:1}},r:"She becomes the program's most popular volunteer with patients, because she knows how to silence the IV pump alarm."},
    {t:"Remind her to look after herself first",e:{c:{jasmine:4},f:{jasDone:1}},r:"She says, \"I know. That's why I come here.\""}]});
E({id:'kunga',tag:"People · New Face",title:"Losar Rap",months:[2],ch:[2,3,4],w:9,cond:()=>has('tenzin')&&!S.f.kungaMet,
  text:()=>`Tenzin's cousin Kunga Tashi comes down from Minneapolis for Losar. He's a Tibetan-language rapper with eighty thousand YouTube subscribers. He wants to perform a new song at the Losar party, with lyrics about "snow mountains," "exile" and "the Texas wind."`,
  opts:[{t:"Let him perform at the party",e:{add:'kunga',T:3,H:6,c:{tenzin:6},f:{kungaMet:1}},r:"The elders frown; the young people clap along. Tenzin's father watches the video and says, \"The beat is wrong. The words are right.\""},
    {t:"Ask him to start with a traditional doha",e:{add:'kunga',L:2,f:{kungaMet:1}},r:"He sings one of Milarepa's songs of realization, then says, \"That's rap too. Nine hundred years old.\""}]});
E({id:'kunga_viral',tag:"Media",title:"Snow Mountains & Texas",ch:[2,3,4],w:5,cond:()=>has('kunga')&&!S.f.kungaViral,
  text:()=>`Kunga's music video shot at the farm goes viral: him rapping in front of the stupa, with windmills, longhorns and prayer flags behind him. In the comments, young people in Dharamsala and young people in Texas are talking in memes.`,
  opts:[{t:"Share it",e:{H:12,gen:2,f:{kungaViral:1}},fx(){post(60000);return "Sixty thousand shares. The following week, a few young Tibetans drive four hours up from Houston.";}},
    {t:"Keep it low-key",e:{H:4,f:{kungaViral:1}},r:"The video goes viral anyway. Kunga says, \"This place is just too photogenic.\""}]});
E({id:'agnes',tag:"Interfaith · New Face",title:"Contemplation",ch:[2,3,4],w:5,cond:()=>!S.f.agnesMet&&S.turn>=30,
  text:()=>`Sister Mary Agnes of a Waco convent comes to visit. She has taught Centering Prayer for forty years. She wants to know how your visualization differs from their contemplation: "We let go of every image; you give rise to images. Perhaps we're on two sides of the same mountain."`,
  opts:[{t:"She leads Centering Prayer; you lead a visualization",e:{T:3,L:1,f:{agnesMet:1}},r:"After both practices, the room stays silent a long time. One member says, \"I can't tell which was which anymore.\" Sister Agnes smiles. \"Then it worked.\""},
    {t:"Seriously discuss the doctrinal differences",e:{L:2,f:{agnesMet:1}},r:"You talk for three hours, from \"emptiness\" to \"kenosis.\" As she leaves she says, \"Next time I'll bring our prioress.\""}]});
E({id:'agnes_retreat',tag:"Interfaith · Practice",title:"Joint Day of Silence",ch:[3,4],w:5,cond:()=>S.f.agnesMet&&!S.f.agnesRetreat,
  text:()=>`Sister Agnes proposes a joint day of silence: nuns and Buddhists on the same lakeshore, not a word spoken from sunrise to sunset.`,
  opts:[{t:"Do it",e:{L:3,T:3,M:3,f:{agnesRetreat:1}},r:"All day long, only the windmill, the birds and the trucks far off on the county road. At dusk, the sisters stand with you by the lake for a while, then everyone goes their own way."},
    {t:"Just invite the sisters for a visit",e:{T:1,f:{agnesRetreat:1}},r:"After their tour, they leave a bunch of wildflowers in the shrine room."}]});
E({id:'caroline_permit',tag:"Admin · Boss",title:"Building Permit",ch:[2,3,4],w:7,cond:()=>bldArea()>140&&!S.f.permitDone,
  text:()=>`Caroline Hu, the mayor's aide, calls in person: the county has noticed your square footage is "growing rather quickly." She requires retroactive building permits and a fire report, "especially regarding those butter candles."`,
  opts:[{t:"Have an architect complete all the drawings",e:{D:-1500,T:2,f:{permitDone:1}},r:"The drawings go in. Caroline replies with a one-word email: \"Received.\""},
    {t:"Go explain at City Hall yourself",e:{B:8,f:{permitDone:1}},fx(){if(chance(.5)){ap({T:2});return "You bring a box of momos and photos of every room. She looks them over and says, \"More up to code than my own remodel.\"";}ap({D:-2500});return "The paperwork is incomplete. You pay a fine.";}}]});
E({id:'caroline_fire',tag:"Admin",title:"Fire Inspection",ch:[2,3,4],w:5,cond:()=>S.f.permitDone&&!S.f.fireDone,
  text:()=>`The fire marshal comes to inspect. In every shrine room the inspector counts butter lamps and writes in his notebook for a long time.`,
  opts:[{t:"Switch everything to LED",e:{L:-2,T:2,f:{fireDone:1,led:1}},r:"Inspection passed. Tenzin says, \"The Buddha will understand. The fire department won't.\""},
    {t:"Add extinguishers and smoke alarms; keep the butter lamps",e:{D:-600,f:{fireDone:1}},r:"A red fire extinguisher now stands by every shrine room door. Members get used to taking off their shoes beside it."}]});
E({id:'monarch_ev',tag:"Texas Conditions",title:"Monarchs",months:[10],ch:[2,3,4],w:12,rep:1,cd:11,cond:()=>S.layout&&S.layout.items.some(i=>i.t==='monarch'),
  text:()=>`October. The monarchs fly south along I-35 toward Mexico. Thousands settle on your Monarch Waystation and around the stupa, like orange prayer flags.`,
  opts:[{t:"Teach on impermanence",e:{L:2,T:1},r:"A butterfly lands on your mala and stays a long time."},
    {t:"Open it to local school visits",e:{T:4,H:4},r:"Three school buses arrive. A child asks, \"Do they know where they're going?\" You say, \"They remember.\""}]});
E({id:'pecan_ev',tag:"Land · Pecan Orchard",title:"Pecan Harvest",months:[11],ch:[2,3,4],w:12,rep:1,cd:11,cond:()=>owned('P9'),
  text:()=>`November, and the pecans are ripe. Chuy says knock them down with long poles. Hank says use a tree shaker. Lorraine says when she was a girl they picked them up one at a time on their knees.`,
  opts:[{t:"Everyone gathers pecans together",e:{T:3,c:{all:2},D:300},r:"An afternoon of gathering. Someone says it's harder than prostrations."},

E({id:'wednesday',tag:"Daily Life",title:"Wednesday Night",ch:[1,2,3,4],w:4,rep:1,cd:5,
  text:()=>pick([`Only three people come to Wednesday night's reading group. You're on chapter four of the Bodhicharyavatara; outside the window, the windmill creaks.`,`The power goes out on Wednesday night. You light butter lamps and keep reading. Halfway through, someone says, "Now this is more like it."`,`Wednesday night, a trucker who has never been here before pushes open the door and asks if this is "that place where you can sit and not talk."`]),
  opts:[{t:"Keep reading as usual",e:{L:1,c:{all:1}},r:"By the time you finish, it's ten o'clock."},{t:"Instead, talk about how everyone's week went",e:{T:1,c:{all:2}},r:"You talk late into the night. Some people cry; some laugh."}]});
E({id:'potluck',tag:"Daily Life",title:"Potluck",ch:[2,3,4],w:4,rep:1,cd:6,
  text:()=>`Potluck after Sunday practice: Vietnamese spring rolls, Texas chili, Tibetan momos, and a Jell-O salad nobody will admit to bringing.`,
  opts:[{t:"Stay to the very end",e:{T:2,B:-3,c:{all:1}},r:"The Jell-O salad was Lorraine's. Nobody dares say a thing."},{t:"Go home early to rest",e:{B:-6},r:"You watch everyone from the window and think this is fine too."}]});

  else {R(0,0,W,H,'#7a1f1b');R(0,0,W,30,'#5a1612');for(let x=0;x<W;x+=24)R(x,30,12,6,'#f0be4c');R(W/2-80,60,160,200,'#3a1a14');R(W/2-70,70,140,190,'#5a2a1a');R(W/2-6,70,12,190,'#3a1a14');R(W/2-110,40,30,220,'#b8402c');R(W/2+80,40,30,220,'#b8402c');R(0,300,W,H-300,'#8a6440');for(let y=300;y<H;y+=10)R(0,y,W,2,'#7a5636');for(let i=0;i<20;i++)R(10+i*36,10+(i%2)*4,14,10,['#2f5d9a','#efe6d0','#d24b31','#41a682','#f0be4c'][i%5]);}
  // 人物
  const people=snap.ids.map(id=>mem(id)).filter(Boolean);
  const list=[{t:playerTraitsFor(S.origin,S.name),n:S.name,player:1}].concat(people.map(m=>({t:traitsFor(m),n:m.n})));
  const max=60,shown=list.slice(0,max),extra=list.length-shown.length;
  const sc=shown.length<=16?4:shown.length<=32?3:2;const sz=16*sc,gapx=sz+6;
  const perRow=Math.max(1,Math.floor((W-40)/gapx));const rows=Math.ceil(shown.length/perRow);
  // 前排中间放住持：把列表重排成从后往前
  const rowsArr=[];let idx=1;const front=[shown[0]];

  rowsArr.reverse();rowsArr.push(front.slice(1,Math.ceil(front.length/2)).concat([front[0]]).concat(front.slice(Math.ceil(front.length/2))));
  const baseY=H-70-sz;const total=rowsArr.length;
  rowsArr.forEach((row,ri)=>{const y=baseY-(total-1-ri)*(sz-sc*5);const x0=(W-row.length*gapx)/2+3;

function findSpot(t){

    if(t==='stupa')s=waterDist(r)*6+Math.abs(x-24)*.3;
    else if(t==='dock')s=Math.abs(y-24)+Math.abs(x-10);

  if(r.silent) return `<h2>The week passes</h2><p class="hint">No change in resources. No choices.</p><div class="go"><button class="btn" data-a="next">Next week</button></div>`;
  const nm=id=>(ACTS.find(a=>a.id===id)||{}).n||id;
  const nn=Math.min(3,r.notes.length);
  const n=per(26,200+nn*40);
  return `<h2>${r.monthEnd?"Month-End Accounts":"Weekend"}</h2>
  <p class="hint">This week: ${r.acts.length?r.acts.map(nm).join(", "):"no actions scheduled"} · Sunday attendance ${r.attend} (about ${r.visitors} visitors)</p>
  ${pager('rep',r.lines,n,l=>`<div><span>${esc(l[0])}</span><span class="${l[1]<0?'neg':'pos'}">${fmtS(l[1])}</span></div>`,'','rep1')}
  <div class="rep1 tot"><div><span>${r.monthEnd?"Net this week (incl. monthly bills)":"Net this week"}</span><span class="${r.net<0?'neg':'pos'}">${fmtS(r.net)}</span></div></div>
  ${nn?`<ul class="notes">${r.notes.slice(0,nn).map(x=>`<li>${esc(x)}</li>`).join('')}${r.notes.length>nn?`<li>${r.notes.length-nn} more in the Log</li>`:''}</ul>`:''}
  <div class="go"><button class="btn" data-a="next">${S.turn>=119&&S.wk>=3&&!S.endless?"Ten years have passed":"Next week"}</button></div>`;
}

    <div class="dbx"><button class="btn" data-a="dev" data-k="now" ${S.phase==='plan'?'':'disabled'}>Trigger now</button><button class="btn ghost" data-a="dev" data-k="next">Queue for next week</button></div>
    <p class="label">"Trigger now" works only during planning; afterwards you return to planning. The week is not settled.</p>
    <div class="dbx"><button class="iconbtn" data-a="dbx" data-k="skipev" ${S.phase==='event'?'':'disabled'}>Skip current event</button><button class="iconbtn" data-a="dbx" data-k="clearq">Clear event queue (${(S.queue||[]).length+(S.mplan||[]).length})</button><button class="iconbtn" data-a="dbx" data-k="resetseen">Reset seen events</button></div>`;
  }
  if(cur==='t'){
    h+=`<section class="panel"><h3>Auto-Advance <small>repeats last week's actions · events take the first available option</small></h3><div class="dbx">${[[1,"1 week"],[4,"1 month"],[12,"1 quarter"],[48,"1 year"]].map(([n,l])=>`<button class="btn ghost" data-a="auto" data-n="${n}">Advance ${l}</button>`).join('')}</div></section>
    <section class="panel"><h3>Time Jump <small>changes the date directly, no simulation</small></h3><div class="dset"><label><span class="label">Year</span><select id="jy" class="dsel">${Array.from({length:10},(_,i)=>2020+i).map(y=>`<option ${y===Y()?'selected':''}>${y}</option>`).join('')}</select></label><label><span class="label">Month</span><select id="jm" class="dsel">${Array.from({length:12},(_,i)=>i+1).map(m=>`<option ${m===Mo()?'selected':''}>${m}</option>`).join('')}</select></label><label><span class="label">&nbsp;</span><button class="btn" data-a="jump">Jump</button></label></div></section>
    <div class="dbx"><button class="iconbtn" data-a="dbx" data-k="endnow">End now and see the ending</button></div>`;

}
function dbgTrigger(id,now){
  const ev=EV[id];if(!ev)return;
  if(!now||S.phase!=='plan'){queue(id,0);note(`"${ev.title}" queued for next week.`);save();render();return;}
  try{
    let ctx=null;if(id==='departure'){const m=act().slice().sort((a,b)=>a.c-b.c)[0];if(m)ctx={m:m.id};}
    S.pending=[{id,ctx}];S._ret='plan';
    if(!nextEvent()){S._ret=null;S.phase='plan';note("This event card's prerequisites aren't met. Nothing happened.");}
    else UI.tab='week';
  }catch(err){S._ret=null;S.phase='plan';S.cur=null;S.pending=[];note("Trigger failed: "+err.message);}
  save();render();
}
function autoWeeks(n){
  window._nr=1;
  try{
    for(let i=0;i<n&&S.phase!=='end';i++){
      if(S.phase==='plan'){S.acts=(S.lastActs||[]).filter(id=>{const x=ACTS.find(q=>q.id===id);return x&&okc(x);}).slice(0,slotsMax());startMonth();}
      let g=0;
      while(S.phase==='event'&&g++<40){if(!S.res){const ev=EV[S.cur.id];S.ctx=S.cur.ctx;const os=getOpts(ev);const k=os.findIndex(o=>!o.req||o.req());choose(Math.max(0,k));}cont();}
      if(S.phase==='silent') silentDone();
      if(S.phase==='year') chooseBoon(S.yr.offer[0]);
      if(S.phase==='report') nextMonth();
    }
  }catch(err){console.error(err);note("Auto-advance interrupted: "+err.message);}
  window._nr=0;save();render();
}
function dbgAction(a,t){
  const c=S.cheat;
  if(a==='cheat'){const k=t.dataset.k;c[k]=!c[k];if(k==='endless')S.endless=!!c[k];if(c[k])S.f.debugRun=1;save();render();return true;}
  if(a==='dset'){DKEYS.forEach(([k])=>{const el=document.getElementById('dv_'+k);if(!el||el.value==='')return;let v=Number(el.value);if(isNaN(v))return;if(k!=='D')v=clamp(v,0,100);S[k]=v;});S.f.debugRun=1;clampAll();save();render();note("Values applied.");return true;}
  if(a==='dev'){const sel=document.getElementById('dbgev');if(sel){UI.dbgEv=sel.value;S.f.debugRun=1;dbgTrigger(sel.value,t.dataset.k==='now');}return true;}
  if(a==='auto'){autoWeeks(Number(t.dataset.n));note(`Advanced to ${Mo()}/${Y()}, week ${S.wk+1}.`);return true;}
  if(a==='jump'){const y=Number(document.getElementById('jy').value),m=Number(document.getElementById('jm').value);S.turn=(y-2020)*12+m-1;S.wk=0;S.phase='plan';S.pending=[];S.cur=null;S.res=null;S.mplan=[];S._ret=null;S.f.debugRun=1;log(`(Debug) Time jumped to ${m}/${y}.`);save();render();return true;}
  if(a==='dbx'){
    const k=t.dataset.k;S.f.debugRun=1;
    if(k==='cash')S.D+=10000;
    else if(k==='add5'){for(let i=0;i<5;i++){const r=typeof nextRoster==='function'?nextRoster():-1;const g=r>=0?rosterMember(r):addGeneric(false);log(`${g.n} (${g.r}) has started coming to practice.`);}}
    else if(k==='c100')act().forEach(m=>{m.c=100;m.low=0;});
    else if(k==='ngdone')act().forEach(m=>{m.ng=[100000,100000,100000,100000,100000];m.done=true;});
    else if(k==='achall')Object.keys(ACH).forEach(x=>grant(x));
    else if(k==='allland'){PARCELS.forEach(p=>{if(!S.parcels.includes(p.id))S.parcels.push(p.id);});NET.k=null;log("(Debug) Bought every parcel.");}
    else if(k==='fresh'){S.B=0;S.HP=100;}
    else if(k==='techall'){TECH.forEach(n=>{if(!tk(n.id))S.tech[n.id]=S.turn;});}
    else if(k==='visit'){dbgTrigger('visit',S.phase==='plan');return true;}
    else if(k==='clearq'){S.queue=[];S.mplan=[];}
    else if(k==='resetseen'){S.seen={};}
    else if(k==='skipev'){if(S.phase==='event'){S.res=null;S.cur=null;S.pending=[];if(S._ret){S.phase=S._ret;S._ret=null;}else settle();}}
    else if(k==='endnow'){S.ended=ending();S.phase='end';save();render();return true;}
    clampAll();save();render();return true;
  }
  return false;
}
