E({id:'lorraine',tag:'邻里 · 新人物',title:'隔壁的派',ch:[1,2],w:7,cond:()=>!S.f.lorraineMet&&S.turn>=4,
  text:()=>`隔壁农场的Lorraine Pickett，八十二岁，丈夫走了三年。她端着一个还冒热气的山核桃派站在门口：“我是浸信会的，从1958年开始。我就是想看看你们周日到底在干嘛，这么安静。”`,
  opts:[{t:'请她进来坐一会儿',e:{T:3,add:'lorraine',f:{lorraineMet:1}},r:'她坐在最后一排，四十分钟一动不动。走的时候说：“比我们教会的诗班安静多了。我喜欢安静。”'},
    {t:'收下派，送她一包酥油茶',e:{T:2,f:{lorraineMet:1}},r:'第二天她打电话来：“那个茶是咸的，你们是不是放错了？”'}]});
E({id:'lorraine_pie',tag:'喜剧',title:'派之战',ch:[2,3],w:5,cond:()=>has('lorraine')&&has('hank')&&!S.f.pieDone,
  text:()=>`Lorraine听说Hank在做“佛教烤肉”，宣布要在感恩节前和他比一场：她的山核桃派对他的菠萝蜜烟熏派。评委是全体成员。`,
  opts:[{t:'办一场派之战',e:{T:4,c:{lorraine:8,hank:8},f:{pieDone:1}},r:'Lorraine赢了，三比二。Hank说他输得心服口服，然后要了配方。'},
    {t:'宣布两个都赢',e:{T:2,f:{pieDone:1}},r:'Lorraine说：“这就是你们说的‘中道’吧。我不同意。”'}]});
E({id:'lorraine_pastor',tag:'跨宗教',title:'她的牧师',ch:[2,3],w:5,cond:()=>has('lorraine')&&!S.f.lorPastor,
  text:()=>`Lorraine的牧师来家访，委婉地提醒她“不要被引入歧途”。她第二周来的时候，带着一本圣经和一个坐垫。“我跟他说了，我在这里祷告，只是不出声。”`,
  opts:[{t:'告诉她在这里祷告也没问题',e:{T:3,c:{lorraine:10},f:{lorPastor:1}},r:'从此她每周日都坐在最后一排，膝盖上放着圣经。'},
    {t:'建议她不要为难，先回教会',e:{c:{lorraine:-10},M:2,f:{lorPastor:1}},r:'她说：“我八十二岁了，孩子。我自己知道去哪里。”'}]});
E({id:'lorraine_end',tag:'人物',title:'最后一个派',ch:[4],w:7,cond:()=>has('lorraine')&&!S.f.lorEnd,
  text:()=>`Lorraine在睡梦中走了。她的女儿从达拉斯赶来，交给你一张发黄的卡片：山核桃派的配方。背面写着：“给湖边那些安静的人。葬礼在我们教会，但请他们来坐一坐。”`,
  opts:[{t:'全体成员去参加她在浸信会的葬礼',e:{T:5,M:4,f:{lorEnd:1}},fx(){leave(mem('lorraine'),'安详地走了');return '你们坐在教堂的最后两排。牧师在悼词里说：“她晚年找到了一种安静。”他没说在哪里找到的，但看了你们一眼。';}},
    {t:'在佛堂为她做回向，然后去葬礼',e:{L:1,T:3,M:4,f:{lorEnd:1}},fx(){leave(mem('lorraine'),'安详地走了');return '那个周日，你们用她的配方烤了一个派，摆在供桌上。';}}]});
E({id:'bo_noise',tag:'邻里与市政',title:'凌晨的法螺',ch:[1,2],w:6,cond:()=>!S.f.boMet&&S.turn>=6,
  text:()=>`凌晨五点半，县警局的副警长Bo Tillman把车停在了你的农场门口。有人报警说“湖边有人在吹牛角”。他看着你手里的法螺：“这个……是乐器吗？”`,
  opts:[{t:'解释，并承诺早上七点前不吹',e:{T:2,r:{bo:4},f:{boMet:1}},r:'他记在本子上：“海螺，七点以后。”然后问能不能吹一下试试。'},
    {t:'请他喝杯茶，听你吹一遍',e:{r:{bo:6},H:2,f:{boMet:1}},r:'他听完说：“比我侄子的长号好听。”报警的人没再打电话。'}]});
E({id:'bo_warning',tag:'德州环境',title:'副警长的电话',ch:[2,3,4],months:[4,5],w:6,cond:()=>S.npc.bo>=4&&!S.f.boWarn,
  text:()=>`下午三点，Bo打来电话：“雷达上有个东西正朝湖边过来，你们今天是不是有活动？”佛堂里坐着二十多个人。`,
  opts:[{t:'立刻疏散到掩体或最结实的房间',e:{T:3,f:{boWarn:1}},fx(){return on('shelter')?'二十多个人整整齐齐地进了掩体。风过去了，Bo开车来看了一眼，竖了个大拇指。':'大家挤在最里面的房间里，念了半小时长寿祈请文。屋顶掉了几片瓦。';}},
    {t:'谢谢他，继续共修',e:{L:1,f:{boWarn:1}},fx(){if(on('shelter'))return '龙卷风在两英里外转了个弯。';ap({D:-800});return '冰雹砸碎了停车场里三辆车的挡风玻璃。保险公司问你“为什么不疏散”。';}}]});
E({id:'bo_deer',tag:'喜剧',title:'县道上的鹿',ch:[2,3,4],w:4,cond:()=>S.npc.bo>=4&&!S.f.deerDone,
  text:()=>`一头白尾鹿在县道上被车撞了，就在你家门口。Bo打电话问：“按规矩我们会处理掉。但我想你们可能……想先念点什么？”`,
  opts:[{t:'带几个人去为它念经',e:{M:3,L:1,r:{bo:3},f:{deerDone:1}},r:'Bo站在一边，帽子摘下来拿在手里。'},
    {t:'谢谢他的好意',e:{r:{bo:1},f:{deerDone:1}},r:'他说：“没事，我就是问问。”'}]});
E({id:'amira',tag:'跨宗教 · 新人物',title:'祈祷的地方',ch:[2,3,4],w:6,cond:()=>!S.f.amiraMet&&(roomsOn('interfaith').length>0||S.turn>=40),
  text:()=>`Dr. Amira Haddad，叙利亚来的儿科医生，在韦科的医院工作。她周五下午路过农场，问能不能借一个安静的角落做礼拜：“清真寺太远了，我只有二十分钟。”${roomsOn('interfaith').length?'你带她去了多信仰祈祷室。':''}`,
  opts:[{t:'请她随时来',e:{T:4,f:{amiraMet:1}},r:'她把一块小小的礼拜毯留在了这里。之后每个周五都来。'},
    {t:'带她去最安静的房间，再告诉她清真寺的Zoom时间',e:{T:2,f:{amiraMet:1}},r:'她笑着说：“我知道清真寺的Zoom时间。我要的是一个不用解释自己的地方。”'}]});
E({id:'iftar',tag:'跨宗教',title:'开斋饭',months:[3,4],ch:[2,3,4],w:8,cond:()=>S.f.amiraMet&&!S.f.iftarDone,
  text:()=>`斋月。Amira提议在农场办一次开斋晚宴，请清真寺的家庭来，也请你们的成员。日落时分，宣礼和法螺会在同一片湖边响起。`,
  opts:[{t:'在斋堂或谷仓前办开斋饭',e:{T:5,M:3,D:-200,f:{iftarDone:1}},r:'日落那一刻，四十个人同时吃下第一颗枣。Hank烤的菠萝蜜被一扫而空。'},
    {t:'只请Amira一家',e:{T:2,f:{iftarDone:1}},r:'她的两个孩子在佛塔边追蝴蝶，一直玩到天黑。'}]});
E({id:'volkov_eeg',tag:'学术 · 新人物',title:'脑电帽',ch:[2,3],w:5,cond:()=>!S.f.eegDone,
  text:()=>`贝勒心理学与神经科学系的Prof. Dmitri Volkov想招募长期修行者做脑电研究：戴上64导电极帽，测静坐时脑信号的复杂度变化。他说：“我对开悟没兴趣，我只对Lempel-Ziv复杂度有兴趣。”`,
  opts:[{t:'鼓励成员自愿参加',e:{T:3,H:4,f:{eegDone:1,eegStudy:1}},r:'Hank第一个报名。他问电极帽能不能戴在牛仔帽外面。'},
    {t:'只允许已完成加行的人参加',e:{L:2,f:{eegDone:1,eegStudy:1}},r:'Volkov说样本量太小了。你说修行本来就是小样本。'},
    {t:'婉拒：修行不是数据',e:{L:1,f:{eegDone:1}},r:'他礼貌地离开了，然后去找了Chad。Chad的中心第二周就挂出了“科学认证”的横幅。'}]});
E({id:'volkov_paper',tag:'学术 · 媒体',title:'论文发表',ch:[3,4],w:6,cond:()=>S.f.eegStudy&&!S.f.paperDone,
  text:()=>`Volkov的论文发表了：长期修行者在静坐时的脑信号复杂度显著不同于对照组。新闻稿的标题是《科学证实冥想改变大脑》，论文里其实写的是“相关，不是因果”。`,
  opts:[{t:'在开示里讲清楚“相关不是因果”',e:{L:2,T:1,f:{paperDone:1}},r:'成员们听得很认真。Volkov后来在推特上转发了你的开示录音。'},
    {t:'把新闻稿贴在门口',e:{H:10,gen:2,tourist:true,L:-2,f:{paperDone:1}},r:'来了一批想“改变大脑”的人。他们问打坐多久能“升级”。'}]});
E({id:'jasmine',tag:'人物 · 新人物',title:'下夜班的护士',at:'2020-11',
  text:()=>`Jasmine Reyes，ICU护士，下夜班后直接开车来了农场。她还穿着手术服，在停车场里坐了很久才进门。“我这个月送走了十一个人，”她说，“我不想哭在病人面前。”`,
  opts:[{t:'陪她坐着，什么都不说',e:{add:'jasmine',M:3},r:'她坐了一个小时，然后说：“谢谢你没有跟我讲道理。”'},
    {t:'教她一个简单的呼吸练习',e:{add:'jasmine',L:-1,c:{jasmine:5}},r:'她说她会在换防护服的时候用。'}]});
E({id:'jasmine_shift',tag:'人物 · 临终关怀',title:'从病房到病房',ch:[2,3],w:5,cond:()=>has('jasmine')&&S.f.chaplain&&!S.f.jasDone,
  text:()=>`Jasmine问能不能加入Dr. Okonkwo的志愿灵性关怀项目。“我以前在病房里是要救人的，”她说，“现在我想学学怎么陪人。”`,
  opts:[{t:'推荐她',e:{c:{jasmine:12},T:2,M:3,f:{jasDone:1}},r:'她成了项目里最受病人欢迎的志愿者，因为她知道怎么调输液泵的警报。'},
    {t:'提醒她先照顾好自己',e:{c:{jasmine:4},f:{jasDone:1}},r:'她说：“我知道。所以我才来这里。”'}]});
E({id:'kunga',tag:'人物 · 新人物',title:'洛萨说唱',months:[2],ch:[2,3,4],w:9,cond:()=>has('tenzin')&&!S.f.kungaMet,
  text:()=>`Tenzin的表弟Kunga Tashi从明尼阿波利斯来过洛萨。他是藏语说唱歌手，在YouTube上有八万粉丝。他想在洛萨晚会上唱一首新歌，歌词里有“雪山”“流亡”和“德州的风”。`,
  opts:[{t:'让他在洛萨晚会上唱',e:{add:'kunga',T:3,H:6,c:{tenzin:6},f:{kungaMet:1}},r:'老人们皱着眉，年轻人跟着拍手。Tenzin的父亲在视频里看完，说：“节奏不对，词是对的。”'},
    {t:'请他先唱一段传统的道歌',e:{add:'kunga',L:2,f:{kungaMet:1}},r:'他唱了一段米拉日巴道歌，然后说：“这也是说唱。九百年前的。”'}]});
E({id:'kunga_viral',tag:'媒体',title:'雪山与德州',ch:[2,3,4],w:5,cond:()=>has('kunga')&&!S.f.kungaViral,
  text:()=>`Kunga在农场拍的MV火了：他站在佛塔前说唱，背景里有风车、长角牛和经幡。评论区里，达兰萨拉的年轻人和德州的年轻人在用表情包对话。`,
  opts:[{t:'转发',e:{H:12,gen:2,f:{kungaViral:1}},fx(){post(60000);return '六万次转发。第二周来了几个开车四个小时从休斯顿来的藏族年轻人。';}},
    {t:'低调',e:{H:4,f:{kungaViral:1}},r:'视频还是火了。Kunga说：“你们这里太上镜了。”'}]});
E({id:'agnes',tag:'跨宗教 · 新人物',title:'默观',ch:[2,3,4],w:5,cond:()=>!S.f.agnesMet&&S.turn>=30,
  text:()=>`韦科一所修女院的Sister Mary Agnes来访。她教了四十年“归心祈祷”。她想知道你们的观想和她们的默观有什么不同：“我们是放下一切形象，你们是生起形象。也许我们在山的两边。”`,
  opts:[{t:'请她带一次归心祈祷，你带一次观想',e:{T:3,L:1,f:{agnesMet:1}},r:'两种练习之后，大家沉默了很久。一位成员说：“我分不出哪个是哪个了。”Sister Agnes笑了：“那就对了。”'},
    {t:'认真讨论教理上的差别',e:{L:2,f:{agnesMet:1}},r:'你们谈了三个小时，从“空”谈到“虚己”。她走时说：“下次带我们的院长来。”'}]});
E({id:'agnes_retreat',tag:'跨宗教 · 修行',title:'联合止语日',ch:[3,4],w:5,cond:()=>S.f.agnesMet&&!S.f.agnesRetreat,
  text:()=>`Sister Agnes提议办一次联合止语日：修女和佛教徒在同一片湖边，从日出到日落不说一句话。`,
  opts:[{t:'办',e:{L:3,T:3,M:3,f:{agnesRetreat:1}},r:'一整天，只有风车、鸟和远处县道上的卡车声。傍晚，修女们和你们一起在湖边站了一会儿，然后各自回去。'},
    {t:'只请修女们来参观',e:{T:1,f:{agnesRetreat:1}},r:'她们参观完，给佛堂留下了一束野花。'}]});
E({id:'caroline_permit',tag:'行政 · Boss',title:'建筑许可',ch:[2,3,4],w:7,cond:()=>bldArea()>140&&!S.f.permitDone,
  text:()=>`市长助理Caroline Hu亲自打来电话：县里注意到你们的建筑面积“增长得很快”。她要求补交建筑许可和消防报告，“尤其是那些黄油灯”。`,
  opts:[{t:'请建筑师补全所有图纸',e:{D:-1500,T:2,f:{permitDone:1}},r:'图纸交上去了。Caroline回了一封邮件，只有两个字：“收到。”'},
    {t:'自己去市政厅解释',e:{B:8,f:{permitDone:1}},fx(){if(chance(.5)){ap({T:2});return '你带了一盒馍馍和所有房间的照片。她看完说：“比我家装修得还规矩。”';}ap({D:-2500});return '材料不全，补了一笔罚款。';}}]});
E({id:'caroline_fire',tag:'行政',title:'消防检查',ch:[2,3,4],w:5,cond:()=>S.f.permitDone&&!S.f.fireDone,
  text:()=>`消防局来检查。检查员在每一间佛堂里数酥油灯，在笔记本上写了很久。`,
  opts:[{t:'全部换成LED',e:{L:-2,T:2,f:{fireDone:1,led:1}},r:'检查通过。Tenzin说：“佛祖会理解的，消防局不会。”'},
    {t:'加装灭火器和烟雾报警器，保留酥油灯',e:{D:-600,f:{fireDone:1}},r:'每间佛堂门口多了一个红色的灭火器。成员们习惯了在它旁边脱鞋。'}]});
E({id:'monarch_ev',tag:'德州环境',title:'帝王蝶',months:[10],ch:[2,3,4],w:12,rep:1,cd:11,cond:()=>S.layout&&S.layout.items.some(i=>i.t==='monarch'),
  text:()=>`十月，帝王蝶沿着I-35一路向南飞往墨西哥。成千上万只落在你的帝王蝶中途站和佛塔周围，像橘色的经幡。`,
  opts:[{t:'在开示里讲“无常”',e:{L:2,T:1},r:'一只蝴蝶落在你的念珠上，停了很久。'},
    {t:'开放给周边学校参观',e:{T:4,H:4},r:'来了三辆校车。有个孩子问：“它们知道要去哪里吗？”你说：“它们记得。”'}]});
E({id:'pecan_ev',tag:'土地 · 山核桃园',title:'打山核桃',months:[11],ch:[2,3,4],w:12,rep:1,cd:11,cond:()=>owned('P9'),
  text:()=>`十一月，山核桃熟了。Chuy说用长竿打，Hank说用摇树机，Lorraine说她小时候都是跪在地上一颗一颗捡的。`,
  opts:[{t:'全体成员一起捡山核桃',e:{T:3,c:{all:2},D:300},r:'捡了一下午。有人说这比大礼拜还累。'},
    {t:'雇人收，卖给批发商',e:{D:700},r:'卖了一个好价钱。Lorraine叹了口气。'}]});
E({id:'wednesday',tag:'日常',title:'周三晚上',ch:[1,2,3,4],w:4,rep:1,cd:5,
  text:()=>pick([`周三晚上的读书会只来了三个人。你们读《入菩萨行论》读到第四品，窗外的风车在响。`,`周三晚上停电了。你们点起酥油灯继续读，读到一半有人说：“这才像样。”`,`周三晚上，一个从没来过的卡车司机推门进来，问这里是不是“那个可以坐着不说话的地方”。`]),
  opts:[{t:'照常读下去',e:{L:1,c:{all:1}},r:'读完时已经十点了。'},{t:'改成大家聊聊这周过得怎么样',e:{T:1,c:{all:2}},r:'聊到很晚。有人哭了，有人笑了。'}]});
E({id:'potluck',tag:'日常',title:'百乐餐',ch:[2,3,4],w:4,rep:1,cd:6,
  text:()=>`周日共修后的百乐餐：越南春卷、德州辣肉酱、藏式馍馍、一锅不知道是谁带来的果冻沙拉。`,
  opts:[{t:'留下来吃到最后',e:{T:2,B:-3,c:{all:1}},r:'果冻沙拉是Lorraine带的。没有人敢说什么。'},{t:'早点回去休息',e:{B:-6},r:'你在窗口看着大家，觉得这样也挺好。'}]});

['Ingrid Solberg','退休图书馆员','在韦科公共图书馆工作了三十年，会给任何东西编目。','她想把图书室所有的书重新编目，包括藏文的那些——尽管她一个字都不认识。','admin',60,1.1],

['Esperanza Villarreal','退休助产士','接生了韦科东区将近两千个孩子。','她说她见过太多生，现在想多了解一点死。','lineage',70,1],

['Ani Dechen','尼师','在加拿大闭关多年，来德州探亲。','她只会几句英语，但每次Hank念错，她都会笑着纠正他。','lineage',95,.5],

['Margaret “Peggy” Sue Lambert','退休护士','在Fort Hood的陆军医院干了一辈子。','她认识Dale，在他刚退伍那年照顾过他。','care',40,1],
['Victor Salinas','墨西哥街头乐队主唱','周末在婚礼和生日会上演唱。','他想在瓜达卢佩圣母节那天唱一首给绿度母的歌。','music',45,1],

['Brittany Sloan','房地产经纪','卖了韦科一半的农舍风房子。','她说你们农场的地价“很有潜力”，然后发现自己说错了话。','fund',20,2.2],

['Carmen Ruiz-Delgado','Rosa的女儿','在奥斯汀做社工，每个月回来看妈妈。','她一开始很担心妈妈“加入了什么组织”，第三次来的时候自己也坐下了。','care',45,1.2],

['Jin-ho Park','韩国留学生','在贝勒读神学，本来是来写论文批判佛教的。','他的论文最后一章题目改成了《我在湖边学到的》。','lineage',55,.6],

  // 人物

const touch=(a,b)=>{const ov=(a1,a2,b1,b2)=>a1<b2&&b1<a2;return (a.x+a.w===b.x||b.x+b.w===a.x)&&ov(a.y,a.y+a.h,b.y,b.y+b.h)||(a.y+a.h===b.y||b.y+b.h===a.y)&&ov(a.x,a.x+a.w,b.x,b.x+b.w);};

function ensureLayout(){
  if(!S) return;
  if(S.wk==null)S.wk=0;S.fac.shrine=0;
  if(!S.parcels) S.parcels=['P0'];
  if(!S.roads) S.roads={};
  if(S.layout&&S.layoutV===4){syncFac();return;}
  const old=S.layoutV?Object.assign({},S.fac):null;
  S.layoutV=4;S.roads={};S.parcels=S.parcels.filter(p=>PARCELS.some(q=>q.id===p));if(!S.parcels.includes('P0'))S.parcels.unshift('P0');
  S.layout={n:1,items:[],tray:[]};S.bld=[];
  const add=(t,x,y)=>S.layout.items.push({u:S.layout.n++,t,x,y});
  const fh=mkBld(42,15,6,4,'农舍',1);mkRoom(fh,'shrine',42,15,4,4,true);mkRoom(fh,'kitchen',46,15,2,2,true);
  const bn=mkBld(35,17,6,5,'住持自住宅（旧谷仓）',1,'#8a2f22');mkRoom(bn,'bedroom',35,17,3,3,true);mkRoom(bn,'office',38,17,3,2,true);
  add('lot0',42,20);add('windmill',48,20);add('flag',42,19);add('flag',47,19);
  if(old){ // 旧存档迁移：按原有设施自动盖房
    if(S.loc!=='home')autoBuildHall(10,5,true);
    ['kitchen','library','kids','guest','protector','vets'].forEach(t=>{const n=old[t]||0;for(let i=0;i<n;i++)autoRoom(t==='cabin'?'retreat':t,true);});
    for(let i=0;i<(old.cabin||0);i++)autoRoom('retreat',true);
    if(old.zoom)autoRoom('studio',true);
    ['stupa','wheels','garden'].forEach(t=>{if(old[t])placeOrTray(t);});
    if(S.f.longhorn)placeOrTray('longhorn');if(S.f.fossilShow)placeOrTray('fossil');
  }
  syncFac();
}
function mkBld(x,y,w,h,n,fixed,wall){const b={u:S.layout.n++,x,y,w,h,n:n||'建筑',fixed:!!fixed,wall:wall||null,rooms:[]};S.bld.push(b);return b;}
function mkRoom(b,t,x,y,w,h,free){const r={u:S.layout.n++,t,x,y,w,h};b.rooms.push(r);if(t==='protector'&&!S.f.protQ){S.f.protQ=1;queue('protector_open',0);}return r;}
function syncFac(){
  if(!S.bld)return;const rc=t=>S.bld.reduce((a,b)=>a+b.rooms.filter(r=>r.t===t).length,0);
  ['kitchen','library','kids','guest','protector','vets'].forEach(t=>S.fac[t]=rc(t));
  S.fac.cabin=rc('retreat');S.fac.zoom=rc('studio')>0?1:0;
  S.fac.wheels=S.layout.items.filter(i=>i.t==='wheels').length?1:0;S.fac.garden=S.layout.items.filter(i=>i.t==='garden').length?1:0;
}
/* 占地 */
function occAll(exceptItem){const g={};
  (S.bld||[]).forEach(b=>{for(let y=b.y;y<b.y+b.h;y++)for(let x=b.x;x<b.x+b.w;x++)g[x+','+y]='b'+b.u;});
  S.layout.items.forEach(it=>{if(it.u===exceptItem)return;const d=IT[it.t];for(let y=it.y;y<it.y+d.h;y++)for(let x=it.x;x<it.x+d.w;x++)g[x+','+y]='i'+it.u;});
  return g;}
function occ(except){const o=occAll(except),g={};for(const k in o)if(o[k][0]==='i')g[k]=+o[k].slice(1);return g;}
function freeTile(x,y,o,shore){if(x<0||y<0||x>=GW||y>=GH)return false;if(!owned(parcelAt(x,y)))return false;const t=ter(x,y);if(t==='w'||t==='r'||t==='a')return false;if(t==='s'&&!shore)return false;if(o[x+','+y])return false;if(S.roads[x+','+y])return false;return true;}
function canPlace(t,x,y,except){
  const d=IT[t],o=occAll(except);
  for(let yy=y;yy<y+d.h;yy++)for(let xx=x;xx<x+d.w;xx++){if(!freeTile(xx,yy,o,d.shore))return false;if(S.f.warblerProtect&&parcelAt(xx,yy)==='P4'&&d.cat!=='o'&&t!=='pavilion')return false;}
  if(d.dock){let wet=false;for(let xx=x-1;xx<=x+d.w;xx++)for(let yy=y-1;yy<=y+d.h;yy++)if(xx>=0&&ter(xx,yy)==='w')wet=true;if(!wet)return false;}
  return true;
}
function canBuild(x,y,w,h){if(w<2||h<2||w>16||h>12)return false;const o=occAll(null);for(let yy=y;yy<y+h;yy++)for(let xx=x;xx<x+w;xx++){if(!freeTile(xx,yy,o,false))return false;if(S.f.warblerProtect&&parcelAt(xx,yy)==='P4'&&w*h>6)return false;}return true;}
const bldAt=(x,y)=>(S.bld||[]).find(b=>x>=b.x&&x<b.x+b.w&&y>=b.y&&y<b.y+b.h);
const roomAt=(b,x,y)=>b&&b.rooms.find(r=>x>=r.x&&x<r.x+r.w&&y>=r.y&&y<r.y+r.h);
function canRoom(t,x,y,w,h){const b=bldAt(x,y);if(!b)return null;const m=RT[t].min;if(!((w>=m[0]&&h>=m[1])||(w>=m[1]&&h>=m[0])))return null;if(x+w>b.x+b.w||y+h>b.y+b.h)return null;
  for(const r of b.rooms){if(x<r.x+r.w&&r.x<x+w&&y<r.y+r.h&&r.y<y+h)return null;}return b;}
/* 道路网络 */
const isGravel=(x,y)=>ASPH.has(x+','+y)||ROAD.has(x+','+y)||S.roads[x+','+y]==='r';
const isWay=(x,y)=>ASPH.has(x+','+y)||ROAD.has(x+','+y)||!!S.roads[x+','+y];
let NET={k:null,set:null};
function roadNet(){const k=Object.keys(S.roads).join(';');if(NET.k===k)return NET.set;const set=new Set(),q=[];ASPH.forEach(t=>{set.add(t);q.push(t);});
  while(q.length){const [x,y]=q.pop().split(',').map(Number);[[1,0],[-1,0],[0,1],[0,-1]].forEach(([a,b])=>{const n=(x+a)+','+(y+b);if(!set.has(n)&&isWay(x+a,y+b)){set.add(n);q.push(n);}});}
  NET={k,set};return set;}
function rectTouchesNet(x,y,w,h){const net=roadNet();for(let xx=x;xx<x+w;xx++){if(net.has(xx+','+(y-1))||net.has(xx+','+(y+h)))return true;}for(let yy=y;yy<y+h;yy++){if(net.has((x-1)+','+yy)||net.has((x+w)+','+yy))return true;}return false;}
const bConn=b=>rectTouchesNet(b.x,b.y,b.w,b.h);
const connected=it=>!IT[it.t].road||rectTouchesNet(it.x,it.y,IT[it.t].w,IT[it.t].h);
function roomsOn(t){return (S.bld||[]).filter(bConn).flatMap(b=>b.rooms.filter(r=>r.t===t).map(r=>Object.assign({b},r)));}
const on=t=>{const map={hall:'shrine',cabin:'retreat',teahouse:'tea'};const rt=map[t]||t;if(RT[rt])return roomsOn(rt).length>0;return !!(S.layout&&S.layout.items.some(i=>i.t===t&&connected(i)));};
const rectOf=it=>it.w!=null&&!IT[it.t]?{x:it.x,y:it.y,w:it.w,h:it.h}:({x:it.x,y:it.y,w:IT[it.t].w,h:IT[it.t].h});
function gap(a,b){const gx=Math.max(0,b.x-(a.x+a.w),a.x-(b.x+b.w));const gy=Math.max(0,b.y-(a.y+a.h),a.y-(b.y+b.h));return Math.max(gx,gy);}
function roadDist(r){let m=99;const f=k=>{const [x,y]=k.split(',').map(Number);m=Math.min(m,gap(r,{x,y,w:1,h:1}));};ROAD.forEach(f);ASPH.forEach(f);Object.keys(S.roads).forEach(k=>{if(S.roads[k]==='r')f(k);});return m;}
function waterDist(r){let m=99;for(let y=0;y<GH;y++)m=Math.min(m,gap(r,{x:shoreX(y)-1,y,w:1,h:1}));return m;}
function mainShrine(){const rs=roomsOn('shrine');if(!rs.length)return null;return rs.sort((a,b)=>b.w*b.h-a.w*a.h)[0];}
function hallHost(){const m=mainShrine();return m&&m.b.n==='农舍'?'farmhouse':m?'hall':'none';}
function shrineCap(){return roomsOn('shrine').reduce((a,r)=>a+Math.floor(r.w*r.h*.8),0);}
/* 自动摆放（承包商标准图纸） */
function findRect(w,h,score){let best=null,bs=1e9;for(let y=0;y<=GH-h;y++)for(let x=0;x<=GW-w;x++){if(!canBuild(x,y,w,h))continue;const s=score(x,y)+(rectTouchesNet(x,y,w,h)?0:600);if(s<bs){bs=s;best={x,y};}}return best;}
function autoBuildHall(w,h,free){const p=findRect(w,h,(x,y)=>Math.hypot(x+w/2-38,y+h/2-25));if(!p)return false;const c=w*h*(SHELL+RT.shrine.cost);if(!free){if(S.D<cost_(c))return false;S.D-=cost_(c);}const b=mkBld(p.x,p.y,w,h,'佛堂');mkRoom(b,'shrine',p.x,p.y,w,h);NET.k=null;syncFac();return true;}
function autoRoom(t,free){
  const m=RT[t].min;const w=m[0]+(t==='shrine'?2:0),h=m[1]+(t==='shrine'?1:0);
  for(const b of (S.bld||[])){if(!bConn(b)&&!free)continue;for(let y=b.y;y<=b.y+b.h-h;y++)for(let x=b.x;x<=b.x+b.w-w;x++){if(canRoom(t,x,y,w,h)){const c=w*h*RT[t].cost;if(!free){if(S.D<cost_(c))return false;S.D-=cost_(c);}mkRoom(b,t,x,y,w,h);syncFac();return true;}}}
  const bw=w,bh=h+1;const quiet=t==='retreat'||t==='protector';
  const p=findRect(bw,bh,(x,y)=>quiet?-Math.min(roadDist({x,y,w:bw,h:bh}),12)*8+Math.abs(y-20)*.2:Math.hypot(x+bw/2-40,y+bh/2-22));if(!p)return false;
  const c=bw*bh*SHELL+w*h*RT[t].cost;if(!free){if(S.D<cost_(c))return false;S.D-=cost_(c);}
  const b=mkBld(p.x,p.y,bw,bh,RT[t].n+'楼');mkRoom(b,t,p.x,p.y,w,h);NET.k=null;
  if(!bConn(b)){const r=autoRoute(b);if(r){r.forEach(k=>S.roads[k]='p');NET.k=null;}}

}
function findSpot(t){
  const d=IT[t];let best=null,bs=1e9;const lots=S.layout.items.filter(i=>IT[i.t].lot).map(rectOf);
  for(let y=0;y<=GH-d.h;y++)for(let x=0;x<=GW-d.w;x++){
    if(!canPlace(t,x,y))continue;const r={x,y,w:d.w,h:d.h};let s;const pen=d.road&&!rectTouchesNet(x,y,d.w,d.h)?600:0;
    if(t==='stupa')s=waterDist(r)*6+Math.abs(x-24)*.3;
    else if(t==='dock')s=Math.abs(y-24)+Math.abs(x-10);
    else if(['wheels','garden','sign','parking','stall','gate'].includes(t))s=roadDist(r)*5+Math.abs(x+d.w/2-44)+Math.abs(y-28)*.5;
    else if(t==='pavilion')s=-Math.min(roadDist(r),10)*5+Math.abs(x-28);
    else s=Math.hypot(x+d.w/2-44,y+d.h/2-24);
    s+=pen;if(s<bs){bs=s;best={x,y};}
  }
  return best;
}
function placeOrTray(t){const p=findSpot(t);const u=S.layout.n++;if(p)S.layout.items.push({u,t,x:p.x,y:p.y});else S.layout.tray.push({u,t});syncFac();return !!p;}
function passable(x,y){if(x<0||y<0||x>=GW||y>=GH)return false;if(!owned(parcelAt(x,y)))return false;if(ter(x,y)==='w'||ter(x,y)==='a')return false;if(occAll(null)[x+','+y])return false;return true;}
function autoRoute(obj){
  const r=obj.w!=null&&!IT[obj.t]?obj:rectOf(obj);const net=roadNet(),start=[],prev={},seen=new Set();const o=occAll(null);
  const ok=(x,y)=>x>=0&&y>=0&&x<GW&&y<GH&&owned(parcelAt(x,y))&&ter(x,y)!=='w'&&ter(x,y)!=='a'&&!o[x+','+y];
  for(let xx=r.x;xx<r.x+r.w;xx++){[[xx,r.y-1],[xx,r.y+r.h]].forEach(([a,b])=>{if(ok(a,b)&&!ROAD.has(a+','+b)){start.push(a+','+b);seen.add(a+','+b);}});}
  for(let yy=r.y;yy<r.y+r.h;yy++){[[r.x-1,yy],[r.x+r.w,yy]].forEach(([a,b])=>{if(ok(a,b)&&!ROAD.has(a+','+b)){start.push(a+','+b);seen.add(a+','+b);}});}
  const q=start.slice();let goal=null;
  while(q.length&&!goal){const k=q.shift();if(net.has(k)){goal=k;break;}const [x,y]=k.split(',').map(Number);
    for(const [a,b] of [[1,0],[-1,0],[0,1],[0,-1]]){const n=(x+a)+','+(y+b);if(seen.has(n))continue;if(net.has(n)){prev[n]=k;goal=n;break;}if(ok(x+a,y+b)&&ter(x+a,y+b)!=='r'&&ter(x+a,y+b)!=='a'){seen.add(n);prev[n]=k;q.push(n);}}}
  if(!goal)return null;const path=[];let k=goal;while(k){if(!S.roads[k]&&!ROAD.has(k))path.push(k);k=prev[k];}return path;
}
function autoPaveObj(obj){const r=autoRoute(obj);if(!r)return false;const c=cost_(r.length*5);if(S.D<c)return false;S.D-=c;r.forEach(k=>S.roads[k]='p');NET.k=null;return true;}
function parkSpaces(){return S.layout.items.filter(i=>IT[i.t].lot&&connected(i)).reduce((a,i)=>a+lotSpots(i).length,0);}
function lotSpots(it){const d=IT[it.t],W=d.w*TS,H=d.h*TS,cols=Math.floor((W-4)/16),rows=Math.floor((H-4)/26),out=[];for(let r=0;r<rows;r++)for(let c=0;c<cols;c++)out.push([it.x*TS+4+c*16+2,it.y*TS+4+r*26]);return out;}
function flagLines(){
  const poles=S.layout.items.filter(i=>i.t==='flag').map(i=>[i.x*TS+10,i.y*TS+4]);
  const st=S.layout.items.find(i=>i.t==='stupa');if(st&&S.fac.stupa>=2)poles.push([st.x*TS+40,st.y*TS+40]);

  return lines;

function dbgTrigger(id,now){
  const ev=EV[id];if(!ev)return;
  if(!now||S.phase!=='plan'){queue(id,0);note(`“${ev.title}”已排到下周。`);save();render();return;}
  try{
    let ctx=null;if(id==='departure'){const m=act().slice().sort((a,b)=>a.c-b.c)[0];if(m)ctx={m:m.id};}
    S.pending=[{id,ctx}];S._ret='plan';
    if(!nextEvent()){S._ret=null;S.phase='plan';note('这张事件卡的前置条件不满足，没有触发。');}
    else UI.tab='week';
  }catch(err){S._ret=null;S.phase='plan';S.cur=null;S.pending=[];note('触发失败：'+err.message);}
  save();render();
}
function autoWeeks(n){
  window._nr=1;
  try{
    for(let i=0;i<n&&S.phase!=='end';i++){
      if(S.phase==='plan'){S.acts=(S.lastActs||[]).filter(id=>{const x=ACTS.find(q=>q.id===id);return x&&okc(x);}).slice(0,slotsMax());startMonth();}
      let g=0;
      while(S.phase==='event'&&g++<40){if(!S.res){const ev=EV[S.cur.id];S.ctx=S.cur.ctx;const os=getOpts(ev);const k=os.findIndex(o=>!o.req||o.req());choose(Math.max(0,k));}cont();}
      if(S.phase==='silent') silentDone();
      if(S.phase==='year') chooseBoon(S.yr.offer[0]);
      if(S.phase==='report') nextMonth();
    }
  }catch(err){console.error(err);note('自动推进中断：'+err.message);}
  window._nr=0;save();render();
}
function dbgAction(a,t){
  const c=S.cheat;
  if(a==='cheat'){const k=t.dataset.k;c[k]=!c[k];if(k==='endless')S.endless=!!c[k];if(c[k])S.f.debugRun=1;save();render();return true;}
  if(a==='dset'){DKEYS.forEach(([k])=>{const el=document.getElementById('dv_'+k);if(!el||el.value==='')return;let v=Number(el.value);if(isNaN(v))return;if(k!=='D')v=clamp(v,0,100);S[k]=v;});S.f.debugRun=1;clampAll();save();render();note('数值已应用。');return true;}
  if(a==='dev'){const sel=document.getElementById('dbgev');if(sel){UI.dbgEv=sel.value;S.f.debugRun=1;dbgTrigger(sel.value,t.dataset.k==='now');}return true;}
  if(a==='auto'){autoWeeks(Number(t.dataset.n));note(`已推进到 ${Y()}年${Mo()}月 第${S.wk+1}周。`);return true;}
  if(a==='jump'){const y=Number(document.getElementById('jy').value),m=Number(document.getElementById('jm').value);S.turn=(y-2020)*12+m-1;S.wk=0;S.phase='plan';S.pending=[];S.cur=null;S.res=null;S.mplan=[];S._ret=null;S.f.debugRun=1;log(`（调试）时间跳到 ${y}年${m}月。`);save();render();return true;}
  if(a==='dbx'){
    const k=t.dataset.k;S.f.debugRun=1;
    if(k==='cash')S.D+=10000;
    else if(k==='add5'){for(let i=0;i<5;i++){const r=typeof nextRoster==='function'?nextRoster():-1;const g=r>=0?rosterMember(r):addGeneric(false);log(`${g.n}（${g.r}）开始来共修。`);}}
    else if(k==='c100')act().forEach(m=>{m.c=100;m.low=0;});
    else if(k==='ngdone')act().forEach(m=>{m.ng=[100000,100000,100000,100000,100000];m.done=true;});
    else if(k==='achall')Object.keys(ACH).forEach(x=>grant(x));
    else if(k==='allland'){PARCELS.forEach(p=>{if(!S.parcels.includes(p.id))S.parcels.push(p.id);});NET.k=null;log('（调试）买下了全部地块。');}
    else if(k==='fresh'){S.B=0;S.HP=100;}
    else if(k==='techall'){TECH.forEach(n=>{if(!tk(n.id))S.tech[n.id]=S.turn;});}
    else if(k==='visit'){dbgTrigger('visit',S.phase==='plan');return true;}
    else if(k==='clearq'){S.queue=[];S.mplan=[];}
    else if(k==='resetseen'){S.seen={};}
    else if(k==='skipev'){if(S.phase==='event'){S.res=null;S.cur=null;S.pending=[];if(S._ret){S.phase=S._ret;S._ret=null;}else settle();}}
    else if(k==='endnow'){S.ended=ending();S.phase='end';save();render();return true;}
    clampAll();save();render();return true;
  }
  return false;
}

  return other;
}

  if(cur==='c')body=pager('wk_c',WIKI_CONCEPTS,n,([a,b])=>row(a,b));

/* ---------- 基础数据 ---------- */

function build(id){
  const f=FAC.find(x=>x.id===id); const lv=S.fac[id]; const c=f.cost(lv);
  if(S.D<cost_(c)) return;
  S.D-=cost_(c); S.fac[id]=lv+1;
  if(IT[id]&&(id!=='stupa'||lv===0)){const ok=placeOrTray(id);if(!ok)log(`No free space for ${IT[id].n} yet, so it went into storage.`);}
  syncFac();
  if(id==='shrine'){S.L+=1;log(`Shrine room upgrade: ${f.lv[lv+1]}.`);}
  else if(id==='stupa'){
    if(lv===0&&!S.f.stupaStyle){queue('stupa_design',0);}
    S.L+=6;S.H+=12; const sw=S.f.rfra?ri(0,4):ri(-7,6); S.T+=sw;
    log(`Stupa stage complete: ${f.lv[lv+1]}. The whole city weighs in: ${sw>=0?"the \"beautiful landmark\" camp wins the day":"the \"pagan idol\" camp floods Nextdoor"}.`);
    if(lv+1===3){S.f.stupaDone=1;if(S.f.refusedAll)grant('wusuode');}
  } else {
    log(`Built: ${f.n}.`);
    if(id==='protector') queue('protector_open',0);
  }
  if(S.phase==='plan'&&S.pending.length===0&&id==='stupa'&&!S.f.stupaStyle){}
  save(); render(); if(document.getElementById('facbox')) openBuild();
}

function ap(e){
  if(!e) return;
  const tm=(S.camera>0?(tk('B4')?1.5:2):1)*(1+S.H/(tk('B4')?500:250));
  if(e.L) S.L+=e.L; if(e.T) S.T+=Math.round(e.T*tm*(e.T<0&&tk('C4')?.8:1)); if(e.D) S.D+=e.D; if(e.H) S.H+=e.H;
  if(e.M) S.M+=e.M; if(e.B) S.B+=e.B; if(e.HA) S.HA+=e.HA; if(e.HP) S.HP+=e.HP; if(e.KN) S.KN+=e.KN; if(e.S) S.self+=e.S; if(e.RT) S.RT+=e.RT;
  if(e.r) for(const k in e.r) S.npc[k]=(S.npc[k]||0)+e.r[k];
  if(e.c) for(const k in e.c){ if(k==='all') act().forEach(x=>x.c+=e.c[k]); else {const x=mem(k); if(x&&!x.left) x.c+=e.c[k];} }
  if(e.add) [].concat(e.add).forEach(id=>{addMember(id);log(`${MT[id].n} joined.`);});
  if(e.gen) for(let i=0;i<e.gen;i++){const g=addGeneric(e.tourist,e.student);log(`${g.n} (${g.r}) has started coming to practice.`);}
  if(e.rm) [].concat(e.rm).forEach(id=>leave(mem(id),"left"));
  if(e.f) Object.assign(S.f,e.f);
  if(e.q) e.q.forEach(([id,d])=>queue(id,d));
  if(e.ach) grant(e.ach);
  if(e.cam) S.camera=Math.max(S.camera,e.cam);
  if(e.au) S.auth.you+=e.au; if(e.ac) S.auth.chad+=e.ac;
  clampAll();
}
function clampAll(){
  S.L=clamp(S.L,0,100);S.T=clamp(S.T,0,100);S.H=clamp(S.H,0,100);S.B=clamp(S.B,0,100);
  S.self=clamp(S.self,0,100);S.RT=clamp(S.RT,0,100);S.M=clamp(S.M,0,100);if(S.HA!=null){S.HA=clamp(S.HA,0,100);S.HP=clamp(S.HP,0,100);S.KN=clamp(S.KN,0,100);}
  S.members.forEach(x=>x.c=clamp(x.c,0,100));
  S.auth.you=clamp(S.auth.you,0,100);S.auth.chad=clamp(S.auth.chad,0,100);
}
function sc(d,v){return d>0?d*clamp((100-v)/55,.08,1):d*clamp(v/55,.15,1);}
function soft(fn){const l=S.L,t=S.T;const r=fn();S.L=clamp(l+sc(S.L-l,l),0,100);S.T=clamp(t+sc(S.T-t,t),0,100);return r;}

    {t:"Welcome her only as a practitioner",e:{},fx(){if(chance(.55)){addMember('hartley',50);S.f.hartley=1;log("Dr. Evelyn Hartley joined.");return "She hesitates for a week, then writes back: \"Then I'll start as a clumsy practitioner.\"";}S.f.hartleyNo=1;return "She writes back that she understands, but it falls outside her research design.";}},
    {t:"Decline",e:{L:1,f:{hartleyNo:1}},r:"Her reply is very polite. Later, in the footnote of a journal article, you find yourselves: \"a group that declined to be interviewed.\""}]});
E({id:'tibetan_lonely',tag:"People",title:"Calls from Home",ch:[1,2,3],w:4,cond:()=>S.origin==='tibetan'&&S.turn>=6,
  text:()=>`On a video call from Dharamsala, your mother asks when you'll marry, when you'll come back, and whether those Americans really understand. You give dharma talks in English in Waco; when you speak Tibetan at home, your tongue has gotten slower.`,
  opts:[{t:"Be honest: I don't know either",e:{B:-6,S:2},r:"Your mother is quiet for a moment, then says, \"Then practice well.\""},
    {t:"Share only the good news",e:{B:6,L:1},r:"After you hang up, you sit in the shrine room until dawn."}]});

/* ===== 第二章 ===== */
E({id:'store_move',tag:"Chapter",title:"Building a Shrine Room",at:'2022-01',
  text:()=>`The farmhouse living room can't hold everyone anymore; last week someone meditated in the kitchen. The bank is willing to give you a $6,000 construction loan at $300 a month. You can design it yourself: draw a building with "Build," then draw a "Shrine Room" inside it (0.8 people per tile). Or you can have a contractor put up a standard 40-seat plan. The shrine room's building must touch a road connected to the county road.`,
  opts:[{t:"Borrow $6,000 and design it yourself",e:{D:6000,f:{storefront:1,hallLoan:1}},fx(){S.loc='store';log("Received a $6,000 construction loan.");return "The money's in. Use \"Build\" below the map to draw a building, then \"Rooms\" to lay out the shrine room.";}},
    {t:"Borrow and hire a contractor with a standard plan",e:{f:{storefront:1,hallLoan:1}},fx(){S.loc='store';const ok=autoBuildHall(10,5,true);log(ok?"The contractor built a 10×5 shrine room.":"The contractor couldn't find room and refunded your money.");if(!ok)S.D+=6000;return ok?"Tenzin stands in the middle of the empty new shrine room and claps once. The echo is long.":"The land isn't big enough. The loan has already landed in your account; you can buy land first, then build it yourself.";}},
    {t:"Wait; stay in the farmhouse living room",e:{},fx(){if(Y()<=2024) queue('store_move_again',4);return "Two more cushions are added to the living room.";}}]});
E({id:'store_move_again',tag:"Chapter",title:"The Contractor Returns",
  text:()=>`The bank calls again. The construction loan is still on offer: $6,000, $300 a month.`,
  opts:[{t:"Borrow and design it yourself",e:{D:6000,f:{storefront:1,hallLoan:1}},fx(){S.loc='store';log("Received a $6,000 construction loan.");return "Build your shrine room with \"Build\" and \"Rooms.\"";}},
    {t:"Still not moving",e:{L:1},fx(){if(Y()<=2024) queue('store_move_again',6);return "You say, \"Slow is also a strategy.\"";}}]});
E({id:'flags_protest',tag:"Neighbors & City Hall",title:"Protest Banners",ch:[2],w:7,cond:()=>S.loc==='store',
  text:()=>`A tourist driving past complains to the county: there's "a string of colorful protest banners" at your farm gate. The county inspector stands at the gate and asks, quite seriously, "What are y'all protesting?"`,
  opts:[{t:"Explain what prayer flags mean",e:{T:1},r:"The inspector writes on the form: \"Wind-powered prayer device, non-political.\""},
    {t:"\"We're protesting suffering.\"",e:{H:6},fx(){const s=ri(-2,4);ap({T:s});return s>=0?"The inspector laughs. The line later makes the Tribune-Herald's \"Quote of the Week.\"":"The inspector doesn't laugh. He writes on the form: \"Uncooperative attitude.\"";}},
    {t:"Move the prayer flags indoors",e:{L:-2,T:1},r:"The following week, a Magnolia gift shop starts selling a \"Zen farmhouse\" wind chime."}]});
E({id:'baylor_wave',tag:"Members' Lives",title:"A Semester's Traffic",ch:[2,3],months:[9],w:20,rep:1,cd:12,
  text:()=>`School's back. A Baylor "Intro to World Religions" course requires students to "visit a non-Christian place of worship and write a reflection." Fourteen students turn up this Saturday, most in Baylor Bears T-shirts.`,
  opts:[{t:"Hold a student session; keep it light",e:{gen:3,student:true,L:-1,D:200},r:"They're enthusiastic. You know most will stay for one semester."},
    {t:"Practice as usual",e:{gen:1,student:true,L:1},r:"Thirteen leave during the second hour. The one who stays asks to borrow a book."},
    {t:"Co-teach a for-credit practicum with Dr. Hartley",req:()=>has('hartley'),rq:"Requires Dr. Hartley",e:{gen:2,student:true,T:3,L:1,c:{hartley:5}},r:"The course is called \"Participant Observation of Religious Practice.\" The students call it \"sitting class.\""}]});
E({id:'anniv30',tag:"Media & Opinion",title:"Thirty Years On",at:'2023-04',
  text:()=>`KWTX is producing a special: "Waco's Religious Landscape: Thirty Years After 1993." Reporter Danielle Okafor asks to interview you. On the phone she says, "I want to do a different kind of story." Every reporter says that.`,
  opts:[{t:"Accept, and show her every space, including the protector shrine",e:{H:16,r:{danielle:6}},fx(){const s=ri(-12,12);ap({T:s});return s>=0?`The segment is gentle; the closing shot is a butter lamp. Trust ${s>0?"rises":"holds steady"}.`:"The segment includes a three-second shot: a black, wrathful protector, scored with a bass drum.";}},
    {t:"Accept, but talk only about meditation and community service",e:{H:6,T:3,L:-2,c:{tenzin:-8}},r:"The segment is titled \"Waco's Mindful Corner.\" Tenzin says, \"So we're a spa.\""},
    {t:"Refuse",e:{H:-3,q:[['anniv30_refuse',1]]},r:"Danielle says she understands. There's a kind of understanding in her voice you don't like."},
    {t:"Ask Dr. Hartley to be interviewed as a scholar",req:()=>has('hartley'),rq:"Requires Dr. Hartley",e:{H:6,T:4,c:{hartley:5}},r:"She does very well, except that in the second minute she calls you \"my research subjects.\""}]});
E({id:'anniv30_refuse',tag:"Media & Opinion",title:"Mysterious Group Declines Interview",
  text:()=>`The special airs. In your segment, the shot is of your closed glass door while the narrator says, "The group declined our request for an interview."`,
  opts:[{t:"Issue a brief statement",e:{T:-2,H:4},r:"One sentence of the statement is quoted—precisely the least important one."},
    {t:"Endure it",e:{T:-4,L:1},r:"A week later the Heat has passed. The Nextdoor threads have not."}]});
E({id:'karmapa',tag:"Kagyu Politics",title:"Two Karmapas",ch:[2,3],w:5,
  text:()=>`At tea after tsok, a new member asks, "Which Karmapa do we follow?" Tenzin sets down his cup. Another member pulls out a phone and starts playing a YouTube video.`,
  opts:[{t:"Take a clear stand per your lineage's position",e:{L:2,RT:3},fx(){act().filter(x=>x.pref<50).forEach(x=>x.c-=8);return "You explain it clearly. Two people leave the group chat that night.";}},
    {t:"Stay vague: \"Both are teachers worthy of respect\"",e:{L:-1,c:{tenzin:-6}},r:"Most people are relieved. Tenzin says you sound \"like a politician.\""},
    {t:"Don't discuss it; start guru yoga",e:{L:1,c:{all:-2}},r:"Some think you're dodging; some think that is the answer."}]});
E({id:'momo_bbq',tag:"Culture Clash · Comedy",title:"Momos and Barbecue",ch:[2,3],months:[6,7,8],w:12,
  text:()=>`The Nguyens propose a charity dinner; Marcus says his cousin has a smoker. The menu war: Tibetan momos, Vietnamese spring rolls, Texas brisket. The vegetarian members post a long essay on "non-killing" in the group chat.`,
  opts:[{t:"All-vegan dinner",e:{L:2,D:Math.round(300),r:{marcus:-1}},r:"Marcus stares at the jackfruit \"pulled pork\" for a long time. \"I'll tell my cousin this was a misunderstanding.\""},
    {t:"Separate sections: \"Barbecue to barbecue, merit to merit\"",e:{D:1800,T:5,c:{all:-2}},r:"The dinner is packed. You spend the evening standing between the vegetarian section and the barbecue section, like a demilitarized zone."},
    {t:"Turn the argument itself into a public dialogue on \"non-killing\"",req:()=>has('hartley'),rq:"Requires Dr. Hartley present",e:{T:3,L:2,D:700,f:{hankSeed:1}},r:"Marcus's cousin Hank raises his hand from the back row: \"I've been smoking meat forty years. What y'all are saying, I'll have to think about.\""}]});
E({id:'two_visitors',tag:"Geopolitics · Satire",title:"Two Visitors",ch:[2],w:5,cond:()=>S.turn>=26,
  text:()=>`On Tuesday, Special Agent Ruiz of the FBI's San Antonio field office stops by and politely asks about your ties to "foreign entities," and whether Mahakala is some kind of code name. On Thursday, a Mr. Wang from a "Cultural Exchange Association" stops by and offers to fund a "Tibetan Culture Festival." Tenzin is out sick this week.`,
  opts:[{t:"Accept the funding",e:{D:6000,L:-4,rm:'tenzin',f:{refusedAll:false,ruizTwice:1}},r:"Tenzin doesn't come back. On his second visit, Ruiz brings a colleague."},
    {t:"Refuse the funding and tell Ruiz",e:{T:3},r:"Ruiz thanks you. After that, he \"swings by\" every quarter."},
    {t:"Invite both to Sunday tsok",e:{H:14,ach:'zhongguan'},r:"The two take photos of each other in your parking lot. After tsok, each takes a cookie."},
    {t:"Give both business cards to Dr. Hartley for a paper",req:()=>has('hartley'),rq:"Requires Dr. Hartley",e:{c:{hartley:4},f:{jordanChapter:1}},r:"Her grad student Jordan's dissertation gains a chapter."}]});
E({id:'tithe',tag:"Interfaith · Satire",title:"Giving Challenge",ch:[2],w:5,
  text:()=>`Abundant Life Church launches a "90-Day Giving Challenge: Tithe, and God Returns It a Hundredfold," complete with a live progress bar on the church's big screen. Three of your members ask: can we have one too?`,
  opts:[{t:"Teach a class on \"nothing to attain\"",e:{L:3,D:-200},fx(){const g=act().filter(x=>x.gen).slice(0,2);g.forEach(x=>leave(x,"went to Abundant Life Church to \"give it a try\""));return "A fine talk. Two people go off to Abundant Life Church to \"give it a try.\"";}},
    {t:"Hold a \"90-Day Prostration Challenge\"",e:{L:1,D:600,f:{knee:1}},r:"On day sixty, someone injures a knee. On day ninety, everyone's prostration count is noticeably higher."},
    {t:"Do nothing; just post a photo of an empty begging bowl",e:{H:8},fx(){post(12000);S.f.bowlViral=1;return "The photo is shared twelve thousand times. Brooke messages: can she put it on a T-shirt?";}}]});
E({id:'cited',tag:"Media & Opinion · Politics",title:"Quoted",at:'2024-09',
  text:()=>`Election year. One state house candidate's ad says "Waco doesn't need more heathens," over footage of your prayer flags. Another candidate's ad says "Waco welcomes all faiths," also over footage of your prayer flags.`,
  opts:[{t:"Ask both to take them down",e:{H:-4},r:"Neither side responds."},
    {t:"Say nothing",e:{},fx(){const a=act().filter(x=>x.gen);if(a.length) leave(pick(a),"left because you \"took no stand\"");ap({gen:1});return "Someone leaves because you \"took no stand,\" and someone joins because you \"took no stand.\"";}},
    {t:"Tweet: \"Our prayer flags are not running for office.\"",e:{H:16},fx(){post(40000);return "Shared forty thousand times. Brooke has already made the T-shirts.";}}]});
E({id:'security',tag:"Texas · Arc Five",title:"Volunteer Security",ch:[2],w:6,cond:()=>has('dale')&&S.loc!=='home',
  text:()=>`Another church shooting in the news. Texas law allows carrying in churches, and most congregations have armed volunteer security teams. Dale stands at your office door: "I've got my license to carry. Sundays I can sit by the door. I won't let anybody hurt the people here." This is not a satirical question.`,
  opts:[{t:"Agree",e:{L:-5,f:{armed:1,armedEver:1},q:[['harass_armed',4]],c:{dale:12}},fx(){const t=mem('tenzin');if(t&&!t.left){t.away=S.turn+3;queue('tenzin_back',3);}return "From now on there is a small shield in the upper-right corner of the shrine room. Tenzin says he needs to go away for a while.";}},
    {t:"Refuse",e:{L:3,c:{dale:-15},q:[['harass_unarmed',4]]},r:"Dale nods. What he hears is: \"You don't trust me.\""}]});
E({id:'harass_armed',tag:"Texas · Arc Five",title:"Sunday, 10 a.m.",
  text:()=>`A drunk man bursts in during practice shouting "Heathens get out," holding something you can't make out. Dale stands up. He doesn't draw. He just blocks the doorway and talks to the man calmly until the police arrive. The thing was a phone.`,
  opts:[{t:"Thank Dale afterward",e:{T:2,c:{dale:10}},r:"Dale says, \"I didn't do anything.\" His hands are still shaking."},
    {t:"Dedicate merit for the man together",e:{L:2,M:2},r:"Some members don't understand. Dale does."}]});
E({id:'harass_unarmed',tag:"Texas · Arc Five",title:"Sunday, 10 a.m.",
  text:()=>`A drunk man bursts in during practice, shouting. All you can do is call the police. They arrive twenty minutes later, and the first question is: "Are y'all one of those…" He doesn't finish.`,
  opts:[{t:"Ask Dale to help you give the statement",e:{c:{dale:6},T:-1},r:"When Dale signs the statement, under \"Occupation\" he writes \"shrine room volunteer.\""},
    {t:"Lead everyone through the rest of the liturgy",e:{L:2,c:{all:-2}},r:"When you finish, three people are crying."}]});
E({id:'tenzin_back',tag:"People",title:"Tenzin Returns",cond:()=>has('tenzin'),
  text:()=>`One Sunday three months later, Tenzin shows up ten minutes before the start, leaves a bag of H-E-B butter in the kitchen, and says nothing.`,
  opts:[{t:"Pour him a cup of tea",e:{c:{tenzin:6}},r:"He says, \"The shield still there?\" You say yes. He says, \"All right.\""}]});
E({id:'documentary',tag:"Media · Arc Three",title:"Documentary",ch:[2,3],w:8,cond:()=>S.H>=50&&!S.f.docDone,
  text:()=>`Streaming documentarian Max Feldstein comes by wanting to shoot "Waco: Thirty Years Later, New Faiths." He promises "a respectful portrayal" and says he "personally loves Buddhism, took a meditation class in Bali."`,
  opts:[{t:"Cooperate with filming",e:{H:10,cam:6,f:{docDone:1},q:[['doc_release',6]]},r:"The cameras enter the shrine room. Over the next six months, Chad grows more orthodox and Dale grows quieter."},
    {t:"Refuse",e:{H:-5,f:{docDone:1}},r:"Max shot exteriors, and Chad."},
    {t:"Demand final review",e:{D:-500,cam:6,f:{docDone:1,docReview:1},q:[['doc_release',6]]},r:"Legal fees: $500. Max signs an agreement he clearly hasn't read."}]});
E({id:'doc_release',tag:"Media · Arc Three",title:"The Shadow of Waco",
  text:()=>`The trailer drops. Bass-drum score; your tsok intercut with 1993 archival footage. The title has changed from "New Faiths" to "The Shadow of Waco." ${S.f.docReview?"Only one of your review notes was taken: they spelled your name right.":''}`,
  opts:[{t:"Sue",e:{D:-4000,T:2,H:6},r:"The case will take two years. Your lawyer says your odds \"depend on how you define winning.\""},
    {t:"Publish an open letter",e:{T:3,H:6},r:"The open letter is admirably restrained. It gets one percent of the trailer's shares."},
    {t:"Ride the wave with an open house",e:{D:2500,T:-3,L:-2,gen:3,tourist:true},r:"Curious tourists line up around the corner. Someone asks whether the protector shrine is \"OK for selfies.\""}],
  pre(){ap({D:1500,T:-8,H:20,r:{kayleigh:-5}});}});
E({id:'chad_center',tag:"Arc One · The Orthodoxy War",title:'Authentic Dharma Waco',ch:[2],w:9,cond:()=>!S.f.chadCenter&&S.turn>=ds2t('2022-05'),
  text:()=>`Two hundred meters across the road, a new center opens: Authentic Dharma Waco. Its founder, Chad Ravenscroft, dharma name Karma Senge, says he did a three-year retreat in Nepal. His Tibetan pronunciation is better than Tenzin's. At the opening he says, "Waco deserves authentic dharma."`,
  opts:[{t:"Pay a visit with a khata",e:{r:{chad:5},M:1,f:{chadCenter:1},ac:40},r:"He accepts the khata and corrects your pronunciation of \"khata.\""},
    {t:"Hit back on Instagram",e:{H:6,au:3,r:{chad:-10},f:{chadCenter:1},ac:42},r:"The comments section becomes a brawl. There are only 37 Buddhists in the whole city, and 12 of them are in the comments."},
    {t:"Focus on practice; ignore it",e:{L:2,f:{chadCenter:1},ac:45},r:"Two Baylor students start going to both."}]});
E({id:'brooke',tag:"People · Dana Temptation",title:"Brand Partnership",ch:[2,3],w:6,cond:()=>!S.f.brookeDone&&S.turn>=26,
  text:()=>`Yoga studio owner Brooke Lindqvist invites you for coffee. She wants to partner on a "Mindful Weekends" series: she supplies the venue and the clients; you supply "an authentic Buddhist teacher." Slide three of her deck reads: Authenticity is our moat.`,
  opts:[{t:"Partner",e:{add:'brooke',D:1500,L:-4,f:{brookeAlly:1,brookeDone:1}},r:"The first weekend sells out. Unlocked action: \"Paid Retreat.\""},
    {t:"Welcome her to practice, but don't partner",e:{f:{brookeDone:1}},fx(){addMember('brooke',30);log("Brooke Lindqvist joined.");return "She comes, sits for twenty minutes, posts a photo of the shrine room on Instagram captioned \"slow living.\"";}},
    {t:"Refuse",e:{L:1,f:{brookeRival:1,brookeDone:1}},r:"Three months later, she partners with Chad."}]});
E({id:'priya',tag:"People",title:"Efficiency",ch:[2,3],w:6,cond:()=>!has('priya')&&!S.f.priyaDone&&S.turn>=26,
  text:()=>`Priya Raman has moved from Austin to work remotely. On her first visit she offers $1,000, then asks, "What's the shortest path to completing ngöndro? I can do two hours every morning at five."`,
  opts:[{t:"Make her a ngöndro tracking spreadsheet",e:{add:'priya',D:1000,L:-1,c:{priya:10},f:{priyaDone:1}},r:"She turns the tracker into a Notion template and shares it with thirty people."},
    {t:"Talk about the meaning of \"slow\"",e:{D:1000,L:1,f:{priyaDone:1}},fx(){if(chance(.6)){addMember('priya',45);log("Priya Raman joined.");return "She listens with a frown, then says, \"Fine. I'll treat this as a long-term project.\"";}return "She thanks you politely and never comes back.";}},
    {t:"Put her in charge of finances",e:{add:'priya',D:1000,f:{priyaCFO:1,priyaDone:1}},r:"The following week you receive a budget with pivot tables."}]});
E({id:'beasley',tag:"People · Tourists",title:"Farmhouse Feel",ch:[2,3],w:5,cond:()=>!S.f.beasleyDone&&S.loc!=='home',
  text:()=>`Carla and Jim Beasley drove down from Ohio to see the Magnolia Silos in Waco, and their GPS led them up the dirt road to your farm. Carla says: "It's got such a vibe! It could just use a little more farmhouse feel."`,
  opts:[{t:"Welcome them, and give them a tour of the shrine room",e:{add:'beasley',D:200,L:-1,f:{beasleyDone:1}},r:"They drive back every month. \"Tourist Buddhism\" now has two regular faces."},
    {t:"Tell them this isn't a tourist attraction",e:{T:-1,L:1,f:{beasleyDone:1}},r:"They leave a four-star Google review: \"Very authentic. A little intense.\""}]});
E({id:'c3',tag:"Admin",title:"A Letter from the IRS",
  text:()=>`Your 501(c)(3) nonprofit application has been approved. The return address on the envelope says Ogden, Utah.`,
  opts:[{t:"Post the tax-exempt number by the shrine room door",e:{f:{c3:1},T:2},r:"Offerings are now tax-deductible. Several members' offerings quietly grow larger."}]});
E({id:'zoning',tag:"Admin · Boss",title:"Zoning Hearing",
  text:()=>`The chair of the county planning commission leafs through your application: "Agricultural land converted to religious assembly use. Insufficient parking." Your rancher neighbor sits in the front row holding a stack of printed-out photos of prayer flags.`,
  opts:[{t:"Hire a lawyer",req:()=>S.D>=2500,rq:"Requires $2,500",e:{D:-2500,f:{zoned:1}},r:"The lawyer talks for fifteen minutes in a language you don't understand. Application approved."},
    {t:"Present your case yourself",e:{},fx(){if(chance(.55+S.T/250)){S.f.zoned=1;return "You speak for five minutes, ending with: \"We're done by ten on Sunday morning, and we're quieter than the cattle next door.\" Approved.";}S.f.zoneAsked=0;S.stats.admin=4;return "The chair says the paperwork is \"incomplete.\" Try again next time.";}},
    {t:"Ask Marcus to rally the neighbors",req:()=>S.f.marcusMet,rq:"Requires knowing Marcus Bell",e:{T:3,r:{marcus:2},f:{zoned:1}},r:"Twenty people come over from East Waco. Most of them don't know what Buddhism is, but they all know Marcus. Approved."}]});
E({id:'kayleigh',tag:"Media · Satire",title:"I Escaped a Waco Buddhist Cult",ch:[2,3,4],w:5,cond:()=>S.H>=30&&!S.f.kayDone,
  text:()=>`Former member Kayleigh Dunn (stayed six weeks) has uploaded "I Escaped a Waco Buddhist Cult (Part 1)." 380,000 views. Main allegation: she was asked to wash dishes. Second allegation: "They made me sit still."`,
  opts:[{t:"Respond publicly",e:{H:8,f:{kayDone:1}},fx(){const s=ri(-3,3);ap({T:s});return "Your response video gets 4,100 views. Her response to your response gets 520,000.";}},
    {t:"DM her an invitation to come back for tea",e:{f:{kayDone:1}},fx(){if(chance(.4)){ap({T:3});return "She comes, washes dishes, and films Part 2: \"I Went Back and They Still Made Me Wash Dishes.\" The comments are unexpectedly kind.";}ap({H:6,T:-2});return "She uses a screenshot of your DM as the thumbnail for Part 2.";}},
    {t:"Ignore it",e:{T:-2,f:{kayDone:1}},r:"Her video has a hundred times more views than the combined attendance of every practice you've ever held."}]});
E({id:'faith_q',tag:"Interfaith",title:"Do You Worship the Devil?",rep:1,cd:0,qonly:1,
  text:()=>pick([`At an interfaith youth forum, a Baptist high schooler raises his hand: "Those gods you worship with all the arms—are they demons?" He genuinely wants to know.`,`At a debate at Baylor's seminary, a doctoral student asks: "If there's no Creator, whose ledger is your merit recorded in?"`,`At the Catholic parish's patronal feast, an elderly woman points at your mala: "Do you pray the Rosary too?"`]),
  opts:[{t:"Explain it properly",e:{T:1,L:1},r:"Some people take notes. Some look at their phones."},
    {t:"Use an analogy from their own tradition",e:{T:3,L:-1},r:"You say: \"Like angels, only more... armed.\" The room laughs."},
    {t:"Invite them to watch a group practice",e:{H:2},fx(){if(chance(.5)){ap({T:3,gen:1});return "Someone actually comes.";}return "They say they'll think about it.";}}]});
E({id:'council_seat',tag:"Interfaith",title:"Waco Interfaith Council",
  text:()=>`Marcus calls: there's an open seat on the Waco Interfaith Council. "I put your name forward. Nobody objected—mainly because nobody knows who you are."`,
  opts:[{t:"Accept",e:{T:8,f:{councilSeat:1},B:4},r:"Your name card reads \"Buddhist Representative.\" Next to you sit a rabbi and a Muslim doctor."},
    {t:"Decline, focus on the center",e:{L:2},r:"Marcus says: \"The seat's yours when you want it.\""}]});
E({id:'losar',tag:"Calendar",title:"Losar",months:[2],rep:1,cd:11,w:30,cond:()=>!(Y()===2021),
  text:()=>`Tibetan New Year. The Nguyen family asks whether it could be held together with Lunar New Year—Grandma has already started making dumplings. Tenzin says Losar is Losar.`,
  opts:[{t:"Hold it jointly with Lunar New Year",e:{T:3,D:Math.round(400),c:{hanh:5,tenzin:-3}},fx(){S.D+=Math.round(300*chMult());return "The lion dancers and the conch shells start at the same moment. No one knows which to listen to.";}},
    {t:"Traditional Tibetan New Year",e:{L:3,c:{tenzin:6}},r:"You hang new prayer flags and burn sang. A neighbor calls to ask if something's on fire."}]});
E({id:'thanksgiving',tag:"Calendar",title:"Thanksgiving Community Dinner",months:[11],rep:1,cd:11,w:30,
  text:()=>`Thanksgiving. Marcus says the East Waco community center is short a kitchen helper. Your own members want to hold a tsok.`,
  opts:[{t:"Host the community dinner",e:{T:4,D:-200,M:2,r:{marcus:3}},r:"You peel forty pounds of potatoes. An old man asks whether \"Buddhists eat turkey,\" and you say that today you can have mashed potatoes."},
    {t:"Just an internal tsok",e:{L:2,c:{all:2}},r:"Very warm, and very small."}]});
E({id:'parade',tag:"Calendar · Comedy",title:"Waco Christmas Parade",months:[12],rep:1,cd:11,w:22,cond:()=>ch()>=2,
  text:()=>`Sign-ups for the Waco Christmas Parade are open. Last year there was a fire department, two churches, a high school band, and a pickup carrying a giant inflatable Nativity scene.`,
  opts:[{t:"Sign up a \"Buddhist float\"",e:{H:8},fx(){const s=ri(-3,5);ap({T:s});return s>=0?"Your float is a spinning prayer wheel. Small children chase after it.":"Someone shouts \"Merry Christmas!\" at your float, in the tone of a correction.";}},
    {t:"Sit it out",e:{},r:"You spend the evening doing aspiration prayers in the shrine room."},
    {t:"Volunteer handing out hot cocoa along the route",e:{T:3,M:1,D:-80},r:"Nobody knows who you are. That's rather the point."}]});
E({id:'shadow',tag:"Waco's Shadow",title:"Waco's Shadow",rep:1,cd:5,w:0,qonly:1,
  text:()=>`${pick(SHADOW_HEAD)}. Your name appears in the third paragraph.`,
  opts:[{t:"Full transparency: invite reporters to see every space, including the protector shrine",e:{H:6},fx(){const s=ri(-6,6);ap({T:s});return s>=0?"The piece is later voted \"most boring story of the month.\" You take it as a compliment.":"The photo of the protector statue gets cropped out and circulated on its own.";}},
    {t:"Stay silent",e:{T:-2,H:-4},r:"Two weeks later, everyone has moved on to something else."},
    {t:"Defuse with humor",e:{H:4},fx(){const s=ri(-2,5);ap({T:s});return s>=0?"You post a photo of the shoe rack by the shrine room door, captioned: \"Our only weapons are flip-flops.\"":"Some people don't find it funny. A lot of people died in 1993.";}},
    {t:"Ask Marcus or Dr. Hartley to vouch for you",req:()=>has('hartley')||S.npc.marcus>=8,rq:"Requires Dr. Hartley present, or good standing with Marcus",e:{T:4,H:2},r:"A video: a Baptist deacon and a religious studies professor sit in your shrine room and say, \"They're good neighbors.\""}]});
E({id:'life',tag:"Members' Lives",title:"Members' Lives",rep:1,cd:2,w:9,
  prep(){const a=here(); if(a.length<2) return false; const m=pick(a); const v=pick(LIFE); S.ctx={m:m.id,v:v.k}; return true;},
  text:()=>{const m=ctxMem(); const v=LIFE.find(x=>x.k===C().v); return m&&v?v.t(m.n):"A member is going through a hard time.";},
  opts:()=>{const m=ctxMem(); const id=m?m.id:''; return [
    {t:"Be there for them, and offer practical help",e:{B:5,M:2,D:C().v==='job'?-300:0,c:{[id]:14}},fx(){S.stats.bypass=0;if(C().v==='move'&&chance(.5)){leave(ctxMem(),"moved to Austin");return "You help him load the last box of books into the car. He says he'll be back.";}return "You sit together in the shrine room for a long time. No grand teachings are offered.";}},
    {t:"Suggest he meditate more",e:{c:{[id]:-5}},fx(){S.stats.bypass++;if(S.stats.bypass>=10)grant('bypass');if(C().v==='move'&&chance(.6)){leave(ctxMem(),"moved to Austin");}return "He nods. You both know that wasn't an answer.";}},
    {t:"Ask other members to take turns helping",e:{c:{[id]:8,all:1}},fx(){S.stats.bypass=0;if(C().v==='move'&&chance(.5)){leave(ctxMem(),"moved to Austin");}return "Rosa draws up a rota. For the first time, this little group feels like a sangha.";}}];}});
E({id:'tornado',tag:"Texas Conditions",title:"Tornado Warning",ch:[2,3,4],months:[4,5],rep:1,cd:10,w:8,
  text:()=>`Halfway through the liturgy, everyone's phone shrieks at once: tornado warning. The sky turns a yellowish green.`,
  opts:[{t:"Stop, and everyone shelters in the storm shelter or innermost room",e:{L:-1,T:1},r:"Crammed into the storage room, you finish the rest of the text. When the all-clear sounds, someone says it was the most focused session yet."},
    {t:"Keep chanting",e:{L:2},fx(){if(on('shelter'))return "Everyone knows the shelter is right next door; not a single line falters. The wind passes.";if(chance(.3)){ap({D:-1500});return "Hail smashes the roof. Repairs: $1,500.";}return "The wind passes. The chanting never stopped.";}},
    {t:"Open the doors and let passersby take shelter",e:{T:4,M:2},r:"A delivery driver, an elderly couple and a dog. The dog stays."}]});
E({id:'crystal',tag:"Dharma & Purity · Comedy",title:"Energy Crystals",ch:[2,3],w:4,
  text:()=>`A new member brings a box of crystals and a tarot deck, hoping to "cleanse the shrine room's energy" before practice. She says she's "really open to all traditions."`,
  opts:[{t:"Gently decline",e:{L:1},r:"She takes the crystals home. The tarot deck stays in the library corner."},
    {t:"Allow them in a corner",e:{L:-2,gen:1,tourist:true},r:"The following week, someone else shows up with a pendulum."}]});
E({id:'cowboy',tag:"Culture Clash · Comedy",title:"Om Mani Padme Hum on a Cowboy Hat",ch:[2,3,4],w:4,
  text:()=>`A member has had a cowboy hat custom-made with Om Mani Padme Hum embroidered on the brim. He wears it to a bar, where a stranger asks if it's "some kind of band."`,
  opts:[{t:"Tell him the mantra shouldn't sit below the head... does a brim count?",e:{L:1},r:"You spend half an hour debating \"the religious status of hat brims.\" No conclusion is reached."},
    {t:"Praise his creativity",e:{T:2,L:-1,H:2},r:"He orders five more."}]});
E({id:'livefail',tag:"Zoom · Comedy",title:"Livestream Mishap",w:4,rep:1,cd:10,cond:()=>S.fac.zoom&&!S.f.mic,
  text:()=>`Ten minutes into the livestreamed talk, a cat's rear end fills the screen. The cat lies down on the keyboard, and the stream title becomes "kkkkkkkkkkkkkkk."`,
  opts:[{t:"Keep teaching",e:{H:3},r:"That stream gets twenty times the usual views."},{t:"End the stream",e:{},r:"The cat is not held accountable."}]});
E({id:'dallas',tag:"Kagyu Politics",title:"A Call from Dallas",ch:[2,3],w:4,cond:()=>!S.f.dallasDone,
  text:()=>`The head of a Kagyu center in Dallas calls: for Rinpoche's tour next year, could you share an itinerary and split the airfare? Also, they've heard you're "doing interfaith stuff" and wanted to ask whether it's getting a bit too "diluted."`,
  opts:[{t:"Partner",e:{f:{dallas:1,dallasDone:1}},r:"Splitting the cost of Rinpoche's visits is on firmer footing from now on."},
    {t:"Go it alone",e:{L:1,f:{dallasDone:1}},r:"You hang up, and each of you carries on struggling in your own small Texas town."}]});

/* ===== 第三章 ===== */
E({id:'lake_buy',tag:"Chapter",title:"Shrine Room Expansion",at:'2025-01',
  text:()=>`The shrine room is full again. The bank will lend another $15,000, at $1,100 a month, to expand the shrine room or put up another building. The I-35 expansion is making building materials pricier every year.`,
  opts:[{t:"Borrow $15,000 to expand",e:{D:15000,f:{expLoan:1}},fx(){S.loc='lake';log("Got the expansion loan.");return "Jake walks over from the road and points at the windmill: \"It needs oiling every April.\" Now go and draw the shrine room bigger.";}},
    {t:"Accept funding from a major donor, with naming rights",req:()=>has('priya')||S.f.meritcoin,rq:"Requires Priya present, or MeritCoin already held",e:{D:15000,L:-5,f:{naming:1,refusedAll:false}},fx(){S.loc='lake';log("A donor funded the shrine room expansion.");return "The sign at the entrance reads: The Raman Family Dharma Grove.";}},
    {t:"Co-fund with the Dallas center",e:{D:7500,L:-2,f:{shared:1}},fx(){S.loc='lake';log("Co-funded the expansion with the Dallas center.");return "Half the new space belongs to the Dallas center. So does half the say.";}},
    {t:"Don't expand",e:{L:1},fx(){if(Y()<=2026) queue('lake_again',6);return "You say: \"A dharma center isn't in the ground.\" Tenzin says: \"Then where is it?\"";}}]});
E({id:'lake_again',tag:"Chapter",title:"The Expansion Offer",
  text:()=>`The expansion loan is still available: $12,000, at $1,100 a month.`,
  opts:[{t:"Borrow and expand",e:{D:12000,f:{expLoan:1}},fx(){S.loc='lake';log("Got the expansion loan.");return "This time you don't hesitate.";}},
    {t:"Still no",e:{},fx(){if(Y()<=2026) queue('lake_again',8);return "Fair enough.";}}]});
E({id:'stupa_design',tag:"Ch. 3 · Satire",title:"Modern Farmhouse",qonly:1,
  text:()=>`The architect brings three stupa designs. The tourist committee (represented by the Beasleys) asks for something "more Waco": white board-and-batten siding, black-framed windows, and a hand-lettered sign reading "gather."`,
  opts:[{t:"Traditional Tibetan stupa",e:{L:4,H:3,f:{stupaStyle:'trad'}},r:"Tourist review: \"A little scary.\" Tenzin sends a photo to his father in Dharamsala, who replies with a thumbs-up."},
    {t:"Farmhouse-style stupa",e:{D:1500,T:3,L:-3,f:{stupaStyle:'farm'}},r:"Tenzin sends a photo to his father in Dharamsala, who replies with an ellipsis."},
    {t:"Traditional stupa, with a farmhouse-style gift shop next to it",e:{D:800,T:2,L:-1,f:{stupaStyle:'trad',merchOK:1}},r:"Unlocked \"Merchandise.\" The first T-shirt is always the hardest."}]});
E({id:'visa',tag:"Teacher & Lineage",title:"Rinpoche's Visa",at:'2026-09',
  text:()=>`Rinpoche's religious worker visa is stuck at the consulate. The empowerment date is set, a hundred and twenty people have registered—forty of them Chad's members. The immigration lawyer quotes ten thousand dollars.`,
  opts:[{t:"Pay",req:()=>S.D>=10000,rq:"Requires $10,000",e:{D:-10000,L:10,RT:8},fx(){S.lastVisit=S.turn;S.stats.visits++;return "The visa comes through three days before the empowerment. Rinpoche's first words off the plane: \"Texas is very hot.\"";}},
    {t:"Switch to a Zoom empowerment",e:{L:-6},fx(){S.D-=0;return "Half the registrants ask for refunds. Tenzin says: \"At least it's not a recording.\"";}},
    {t:"Ask Pastor Dawson's congressman friend for help",req:()=>S.npc.dawson>=3,rq:"Requires a good relationship with Pastor Dawson",e:{L:8,RT:4,T:2,f:{owesDawson:1}},fx(){S.lastVisit=S.turn;S.stats.visits++;return "It works. The price: you appear for two seconds in the congressman's campaign ad.";}}]});
E({id:'thesis',tag:"Academia · Satire",title:"Thesis Defense",ch:[3],w:6,cond:()=>has('hartley'),
  text:()=>`Hartley's grad student Jordan passes the defense of a thesis titled "Decolonial Buddhist Spaces in Post-Secular Texas: An Ethnography." The acknowledgments thank "the respondents in Waco." You discover that in Chapter 4 you are referred to as "Informant A."`,
  opts:[{t:"Ask to be credited",e:{c:{hartley:-8},f:{ethicsChain:1}},r:"Hartley says she'll talk to Jordan. Jordan blocks you."},
    {t:"Put the thesis in the library",e:{L:-1,T:1},r:"After reading it, members ask you to \"decolonize\" your altar arrangement."},
    {t:"Invite Jordan back to wash dishes for a week",e:{},r:"Jordan disappears for two years, then returns as a \"consultant\" and sends an invoice."}]});
E({id:'hank_arrive',tag:"People",title:"Forty Years of Brisket",ch:[3],w:9,cond:()=>!has('hank')&&!S.f.hankNo&&(S.f.marcusMet||S.f.hankSeed),
  text:()=>`Marcus's cousin Hank "Smoke" Dalton, a retired pitmaster, pulls up by the lake in a pickup with a smoker strapped in the bed. "I've been smoking meat for forty years," he says. "That not-killing thing you all mentioned last time—I've been chewing on it for a year."`,
  opts:[{t:"Welcome him",e:{add:'hank'},r:"He says: \"Samadhi is just low and slow for fourteen hours.\" You decide not to correct him."},
    {t:"Suggest he start with a stress-reduction course",e:{f:{hankNo:1}},r:"He says: \"I don't need stress reduction, I need to figure out these forty years.\" Then he goes over to Chad's."}]});
E({id:'vegbbq',tag:"Comedy",title:"Vegetarian BBQ",ch:[3,4],w:7,cond:()=>has('hank')&&!S.f.vegDone,
  text:()=>`After taking refuge, Hank wants to invent "Buddhist barbecue": jackfruit with smoked tofu. He wants to enter the citywide barbecue cook-off. The Texas barbecue world reacts like the Inquisition.`,
  opts:[{t:"Back his entry",e:{H:8,f:{vegDone:1}},fx(){if(chance(.45)){ap({T:6});grant('vegjudge');return "Hank wins the \"Judges' Special Award.\" KWTX headline: \"Waco Buddhist Wins Over BBQ Judges with Jackfruit.\"";}ap({T:-4});return "One judge spits it out, then takes another bite. KWTX covers it anyway.";}},
    {t:"Urge him to keep a low profile",e:{c:{hank:-8},f:{vegDone:1}},r:"He enters secretly and wins \"Most Controversial.\""},
    {t:"Turn the cook-off into a tsok",e:{L:2,D:600,f:{vegDone:1}},r:"After eating, a judge asks: \"Does this count as converting?\""}]});
E({id:'ercot',tag:"Texas Weather · Satire",title:"ERCOT Alert",ch:[3,4],months:[7,8],w:14,cond:()=>S.fac.cabin>0&&!S.f.ercotDone,
  text:()=>`The grid has issued a conservation alert. In the retreat cabin is a retreatant on day 40, and the air conditioning is the only thing keeping him from heatstroke.${S.f.meritcoin?" Your solar panels were bought by Trevor with MeritCoin.":''}`,
  opts:[{t:"Cut the shrine room AC to save the cabin",e:{c:{all:-4},f:{ercotDone:1}},r:"Sunday attendance drops by forty percent. Nextdoor: \"Buddhists don't even use AC. So devout.\""},
    {t:"Run the diesel generator",e:{D:-600,f:{ercotDone:1}},r:"Priya points out the carbon emissions. Hank asks if he can grill something while it's running."},
    {t:"Stop the retreat",e:{L:-6,f:{ercotDone:1}},r:"The retreatant falls apart. He later becomes a guest on Kayleigh's channel."}]});
E({id:'meritcoin',tag:"Arc 4 · MeritCoin",title:'MeritCoin',ch:[3],w:7,cond:()=>!S.f.coinDone&&ch()>=3,
  text:()=>`Trevor Nakamura-Blythe, a former tech executive who moved from San Francisco, proposes "MeritCoin": one token minted for every prostration, recorded permanently on-chain. He's willing to donate coins "worth a million dollars." Priya finds it efficient, Tenzin finds it sacrilegious, and Hank asks whether it can buy brisket.`,
  opts:[{t:"Accept",e:{D:20000,L:-6,H:15,f:{meritcoin:1,coinDone:1,refusedAll:false},q:[['coin_crash',9]]},r:"You cash out a portion. For the first time, the books show five figures."},
    {t:"Refuse",e:{L:2,M:2,f:{coinDone:1}},r:"Trevor says you've \"missed the dharma of Web3.\""},
    {t:"Accept it, but only as a keepsake—never cash out",e:{L:-1,H:5,f:{coinDone:1,coinKept:1},q:[['coin_crash',9]]},r:"The wallet key is written on a card tucked under the altar."}]});
E({id:'coin_crash',tag:"Arc 4 · MeritCoin",title:"Merit Deflation",
  text:()=>`MeritCoin has crashed. Trevor's wallet was hacked (or perhaps he just ran). KWTX headline: "Waco Buddhist Temple in Crypto Crash."${S.fac.stupa>0&&S.fac.stupa<3?" The stupa is half-built.":''}`,
  pre(){if(S.f.meritcoin){ap({D:-Math.min(Math.max(S.D,0),6000),T:-6,H:18});}else ap({H:6});},
  opts:[{t:"Open all the books",e:{T:3},r:"The accounts are perfectly clear: you made nothing and didn't lose much. No one reads them."},
    {t:"Sue Trevor",e:{D:-1500},r:"The lawyer can't find Trevor."},
    {t:"A member insists on using it to count prostrations",e:{L:1,ach:'deflation'},r:"Hank says: \"The coin's gone, the prostrations are still here.\" He's up to eighty-one thousand."}]});
E({id:'deathrow',tag:"Arc 5 · Silence",title:"Huntsville",at:'2026-03',
  text:()=>`A letter from the prison in Huntsville. A death row inmate is requesting a Buddhist chaplain to be with him at his execution (a 2022 Supreme Court ruling protects this right). He has been reading sutras in prison for eight years and has never met another Buddhist.`,
  opts:[{t:"Go",e:{M:8,H:10,L:3,B:8,f:{huntsville:1}},fx(){ap({T:-3});return "You drive for three hours. He asks you: \"What can I still practice?\" You give him refuge. By the time you drive home, Kayleigh has already edited \"Buddhist Prays for Murderer.\"";}},
    {t:"Recommend an experienced Buddhist prison chaplain",e:{M:1,L:-1},r:"You give him an address and phone number. It is a responsible choice. You sit in front of the altar for a long time."},
    {t:"Don't go",e:{L:-4},r:"You write back a very short letter. There's a line in the bodhisattva vows; you can recite it by heart."}]});
E({id:'tenzin_white',tag:"People · Conscience of Purity",title:"White Buddhism",ch:[3],w:6,cond:()=>has('tenzin'),
  text:()=>`During the tea break Tenzin asks you: "Have you noticed that apart from me and the Nguyens, almost everyone here is white? They wear shawls bought in India and chant Tibetan they don't understand. My father asked me whether this is spreading the dharma or collecting us."`+(S.origin==='convert'?"He doesn't look at you as he says it, but you know who he means.":''),
  opts:[{t:"Ask Tenzin to lead a fully Tibetan-style puja",e:{L:3,c:{tenzin:15,all:-2}},r:"Half the room can't keep up the whole way through. For the first time, Tenzin laughs out loud in the shrine room."},
    {t:"Argue that the lineage knows no borders",e:{c:{tenzin:-10}},fx(){if(S.origin==='convert')ap({c:{tenzin:-6}});return "You make your case well. When you finish, he says: \"You people always make your case well.\"";}},
    {t:"Invite his father to visit from Dharamsala",req:()=>S.D>=1200,rq:"Requires $1,200",e:{D:-1200,L:4,c:{tenzin:20},f:{tenzinFather:1}},r:"The old man sits by the lake all afternoon and finally says: \"The wind is the same.\""}]});
E({id:'retreat_crisis',tag:"Practice · Retreat",title:"Day Thirty in the Cabin",qonly:1,
  text:()=>`On day thirty, the retreatant rings the cabin's doorbell. He says he saw light, and saw his dead brother. He doesn't know whether this is realization or breakdown. Neither do you.`,
  opts:[{t:"End the retreat at once and take him to the hospital",e:{L:-2,M:2},r:"The doctor says it's severe sleep deprivation. Three months later, he comes back to volunteer."},
    {t:"Let a qualified retreat guide assess it",req:()=>S.f.guide||S.f.localGuide,rq:"Requires a qualified retreat guide",e:{L:2},r:"The guide talks with him for two hours and adjusts his practice and schedule. He stays."},
    {t:"Let him continue",e:{},fx(){if(chance(.5)){ap({L:4});return "A week later he emerges calm, and says something you will remember for a long time.";}ap({T:-8,H:15});return "His family calls the police. \"Waco\" is in a headline again.";}}]});
E({id:'rfra',tag:"Arc 2 · Mirror Church",title:"Religious Freedom Act",ch:[3],w:5,cond:()=>!S.f.rfraDone,
  text:()=>`Conservative legislators are pushing the "Texas Religious Freedom Enhancement Act." Pastor Dawson needs an example of "minority religions being protected too," and asks you to testify at the state capitol. The bill really would protect your stupa from being torn down over zoning.`,
  opts:[{t:"Testify",e:{T:3,L:-1,r:{dawson:8},f:{rfra:1,rfraDone:1}},r:"You become his political prop. The bill passes, and your stupa is safe."},
    {t:"Refuse to be a prop",e:{L:2,r:{dawson:-5},f:{rfraDone:1}},r:"The bill passes anyway, just without you."},
    {t:"Issue a statement of support, but don't attend",e:{T:1,f:{rfra:1,rfraDone:1}},r:"When the statement is quoted, everything after the \"but\" is cut."}]});
E({id:'donor',tag:"Dana",title:"Naming Rights",ch:[3],w:5,cond:()=>has('priya')&&!S.f.donorDone,
  text:()=>`Priya is willing to give $10,000 to renovate the shrine room, on condition that it be renamed "Priya Raman Meditation Hall." She says it's "to inspire other donors."`,
  opts:[{t:"Accept",e:{D:10000,L:-3,f:{refusedAll:false,donorDone:1}},r:"The bronze plaque is beautifully made. Tenzin walks around it every time he passes."},
    {t:"Refuse",e:{L:1,M:2,c:{priya:-6},f:{donorDone:1}},r:"She says she understands, then cuts her offerings in half."}]});
E({id:'protector_open',tag:"Protector Shrine",title:"Open to the Public?",qonly:1,
  text:()=>`The protector shrine is finished. Mahakala is black, wrathful, and crowned with skulls. Traditionally, protector shrines are closed to outsiders. The Beasleys are already taking photos at the door.`,
  opts:[{t:"Keep it closed",e:{L:3},r:"A padlock goes on the door. Nextdoor: \"What are they hiding in there?\""},
    {t:"Open it, with detailed placards",e:{T:2,H:6,L:-1},r:"The placard runs to four hundred words. Most visitors read only one: \"wrathful.\""}]});
E({id:'guide_ready',tag:"Practice · Lineage",title:"Local Teacher",qonly:1,
  text:()=>`Six months of training in ritual and retreat guidance are over. Rinpoche says you may now appoint a local retreat master.`,
  opts:()=>{const c=act().filter(x=>x.c>=55).sort((a,b)=>b.c-a.c).slice(0,3);
    const o=c.map(x=>({t:`Appoint ${x.n}`,e:{L:3,c:{[x.id]:10}},fx(){S.f.localGuide=x.n;S.f.localGuideId=x.id;if(x.id==='dale')return "Dale becomes keeper of the retreat cabin. \"Quietest post I ever stood,\" he says.";return `${x.n} takes the keys.`;}}));
    o.push({t:"Not yet",e:{},fx(){S.f.guideAsked=0;S.stats.guide=3;return "You decide it isn't time.";}});return o;}});
E({id:'linda_flag',tag:"Neighbors · Satire",title:"A Blessing for Grandson",ch:[3,4],w:6,cond:()=>S.f.hoaMet&&!S.f.lindaDone,
  text:()=>`Linda Kowalczyk (Linda of Section 4.2) comes down to the lake. Her grandson is applying to Baylor. "I hear you folks can... do something?" She produces a printed copy of the application. "Not that I believe in any of this, of course."`,
  opts:[{t:"Bless the grandson, and have her hang a string of prayer flags herself",e:{T:3,L:-1,r:{linda:10},f:{lindaDone:1},ach:'art42'},r:"She hangs the prayer flags on tiptoe. \"This doesn't violate Section 4.2, does it?\""},
    {t:"Decline: the Dharma doesn't do exams",e:{L:1,f:{lindaDone:1}},r:"\"Then how are you any different from our church?\" she says, and laughs."}]});
E({id:'vets_va',tag:"People · Dale",title:"A Letter from the VA",ch:[3,4],w:6,cond:()=>has('dale')&&mem('dale').c>=60&&!S.f.vaDone,
  text:()=>`The VA's mental health office writes: they would like to list you as a "community meditation resource," provided the religious content goes. Dale sets the letter on your desk. "I know what you're going to think. I just want more guys like me to know this place exists."`,
  opts:[{t:"Start a separate secular class",e:{T:4,L:-1,f:{vaDone:1,va:1},c:{dale:10}},r:"Nine veterans come to the first session. Two of them later stay on to learn Tibetan."},
    {t:"Decline",e:{L:1,c:{dale:-6},f:{vaDone:1}},r:"\"It's fine,\" Dale says. When Dale says it's fine, it usually isn't."}]});

/* ===== 虚构历史线 · 2027 ===== */
function world(x){S.world=S.world||[];S.world.unshift({t:S.turn,x});S.f.altHistory=1;log("[World] "+x);}
function chineseMember(){return act().find(x=>['Mei Chen','Bao Tran','Ivy Tran'].includes(x.n)&&x.n==='Mei Chen')||null;}
E({id:'xj_nuke',tag:"World · Fictional History",title:"South of Kashgar",at:'2027-02',
  pre(){world("China uses nuclear weapons in southern Xinjiang. The oasis belt between Hotan and Kashgar vanishes from satellite imagery.");},
  text:()=>`Before dawn, every news channel cuts to the same picture: China has used nuclear weapons in southern Xinjiang. The official statement is one sentence long. On the satellite images, a stretch of oasis between Hotan and Kashgar is simply gone.
In Waco, Tenzin doesn't sleep; he spends the night scrolling the Dharamsala group chat. At ten in the morning the imam of the Islamic Center of Waco calls you. He asks whether you might do something together tonight.`,
  opts:[{t:"Hold an interfaith vigil with the mosque",e:{T:5,M:5,H:6,r:{marcus:3},f:{vigil:1}},r:"The imam recites a passage of scripture; you recite a dedication. Among those who come is a Uyghur graduate student from Baylor, holding a photograph of her family. She never puts it down."},
    {t:"Practice and dedicate merit for the dead in the shrine room",e:{L:3,M:3,c:{all:3}},r:"Nobody leaves early that night. When you reach the dedication prayer, someone is crying."},
    {t:"Make no public statement",e:{H:-2,c:{tenzin:-8}},r:"You say the shrine room doesn't do politics. \"This isn't politics,\" says Tenzin."}]});
E({id:'dam',tag:"World · Fictional History",title:"Below Yichang",at:'2027-04',
  pre(){world("The Three Gorges Dam collapses. The flood surges down the Yangtze; Yichang, Jingzhou, Yueyang and Wuhan go under one after another.");},
  text:()=>{const asian=S.origin==='asian';const m=chineseMember();
    return `The Three Gorges Dam has failed. The flood runs down the Yangtze: Yichang, Jingzhou, the Dongting Lake country, Wuhan, one city after the next. The death toll is updated every hour, and nobody believes the number.
${asian?"For three days you haven't been able to get through to your mother's hometown in Hubei. ":m?`${m.n}'s aunt lives in Jingzhou. She came this Sunday and sat in the back row, her phone lit the whole time. `:"Outside Waco's Chinese grocery someone has set up a donation table, and the line runs out into the parking lot. "}${has('hanh')?"The Nguyen grandmother says that with so many gone, somebody has to chant for them.":''}`;},
  opts:[{t:"Send this month's offerings to disaster relief",e:{D:-1500,T:4,M:6},r:"You tape the receipt to the shrine room door. Nobody asks where the money went."},
    {t:"Hold a great memorial puja with the Nguyens",req:()=>has('hanh'),rq:"Requires the Nguyens",e:{L:2,T:3,M:4,c:{hanh:8}},r:"Tibetan, Vietnamese and Mandarin chanting take turns. Many Chinese families come who have never come before."},
    {t:"Dedicate merit in the shrine room only",e:{L:1,M:2},r:"One hundred and eight butter lamps burn through the night."},

E({id:'visit',tag:"Teacher & Lineage",title:"Rinpoche's Annual Visit",months:[9],rep:1,cd:11,w:0,cond:()=>Y()>=2020&&Y()<=2027&&Y()!==2026,
