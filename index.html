:root{
  --ink:#0b1220; --panel:#14203a; --panel2:#1b2b4a; --edge:#05080f; --hi:#2c4370; --lo:#0a1222;
  --line:#2a3d63; --line2:#3d5688;
  --bone:#f1e7cf; --mute:#a3b3cc; --dim:#6f82a3;
  --gold:#f0be4c; --golddk:#9c7426; --goldhi:#ffe39a;
  --cinnabar:#e0533a; --malachite:#4fbf8f; --azurite:#5f95e6; --rust:#d77a3c;
  --px:"Fusion Pixel","Zpix","SimSun",monospace;
  --display:var(--px); --body:var(--px); --num:var(--px);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:auto}
body{background-color:var(--ink);color:var(--bone);font-family:var(--px);font-size:12px;line-height:22px;
  -webkit-font-smoothing:none;-moz-osx-font-smoothing:unset;font-smooth:never;text-rendering:optimizeSpeed;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 40px;
  background-image:linear-gradient(45deg,rgba(255,255,255,.018) 25%,transparent 25%,transparent 75%,rgba(255,255,255,.018) 75%),linear-gradient(45deg,rgba(255,255,255,.018) 25%,transparent 25%,transparent 75%,rgba(255,255,255,.018) 75%);
  background-size:4px 4px;background-position:0 0,2px 2px;}
img,canvas{image-rendering:pixelated;image-rendering:crisp-edges}
button{font:inherit;color:inherit;cursor:pointer;border-radius:0}
button:focus-visible,input:focus-visible{outline:2px dashed var(--gold);outline-offset:2px}
.num{font-family:var(--px);font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--px);font-weight:400;margin:0;text-wrap:balance}
b,strong{font-weight:400;color:var(--goldhi)}

/* 像素窗框 */
.pxbox,.panel,.stage,.scene,.ov .box,.card,.act,.choice,.fac .f,.ach div,.toast{
  border:2px solid var(--edge);
  box-shadow:inset 2px 2px 0 var(--hi),inset -2px -2px 0 var(--lo);
  clip-path:polygon(2px 0,calc(100% - 2px) 0,100% 2px,100% calc(100% - 2px),calc(100% - 2px) 100%,2px 100%,0 calc(100% - 2px),0 2px);
}

/* header */
.top{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;max-width:1360px;margin:0 auto 12px;padding:8px 12px;background:var(--panel);
  border:2px solid var(--edge);box-shadow:inset 2px 2px 0 var(--hi),inset -2px -2px 0 var(--lo),0 4px 0 var(--edge)}
.brand{display:flex;align-items:center;gap:10px}
.brand img{width:48px;height:48px}
.brand h1{font-size:24px;line-height:24px;color:var(--gold);letter-spacing:.08em;text-shadow:2px 2px 0 var(--edge)}
.brand small{display:block;font-size:12px;letter-spacing:.3em;color:var(--mute);line-height:16px;margin-top:4px}
.date{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-left:auto}
.date .big{font-size:24px;line-height:24px;color:var(--bone);text-shadow:2px 2px 0 var(--edge)}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--panel2);border:2px solid var(--edge);box-shadow:inset 0 -2px 0 var(--lo);padding:0 8px;font-size:12px;color:var(--mute);line-height:22px}
.chip.warn{color:#ffb4a3;background:#3a1c1c}
.chip.gold{color:var(--gold);background:#2b2412}
.iconbtn{background:var(--panel2);border:2px solid var(--edge);box-shadow:inset 2px 2px 0 var(--hi),inset -2px -2px 0 var(--lo);padding:0 10px;font-size:12px;color:var(--bone);line-height:22px}
.iconbtn:hover{color:var(--gold)}
.iconbtn:active{box-shadow:inset -2px -2px 0 var(--hi),inset 2px 2px 0 var(--lo)}

.main{display:grid;grid-template-columns:250px minmax(0,1fr) 280px;gap:14px;max-width:1360px;margin:0 auto;align-items:start}
.col{display:flex;flex-direction:column;gap:14px;min-width:0}
.panel{background:var(--panel);padding:0 12px 12px}
.panel h3{font-size:12px;color:var(--gold);margin:0 -12px 10px;padding:4px 12px;background:var(--lo);border-bottom:2px solid var(--edge);display:flex;justify-content:space-between;align-items:center;gap:8px;line-height:20px;letter-spacing:.1em}
.panel h3:before{content:"";width:8px;height:8px;background:var(--gold);box-shadow:2px 2px 0 var(--golddk);margin-right:6px;flex:none}
.panel h3 small{margin-left:auto;font-size:12px;color:var(--dim);letter-spacing:0}
.label{font-size:12px;color:var(--dim);letter-spacing:.06em}

/* ropes */
.rope{margin:2px 0 10px}
.rope .row{display:flex;justify-content:space-between;align-items:baseline}
.rope .nm{font-size:12px;color:var(--bone)}
.rope .nm em{font-style:normal;font-size:12px;color:var(--dim);margin-left:6px}
.rope svg{display:block;width:100%;height:36px;image-rendering:pixelated}
.mini{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mini div{padding-top:2px}
.mini b{display:block;font-size:24px;line-height:26px;color:var(--bone)}
.bar{height:8px;position:relative;margin-top:4px;background:repeating-linear-gradient(90deg,var(--lo) 0 6px,transparent 6px 8px)}
.bar i{position:absolute;left:0;top:0;bottom:0;color:var(--gold);background:repeating-linear-gradient(90deg,currentColor 0 6px,transparent 6px 8px)}
.tension{font-size:12px;color:var(--mute);margin-top:6px;background:var(--lo);padding:4px 8px;border-left:4px solid var(--gold)}

/* scene */
.scene{position:relative;background:#05080f;overflow:hidden;padding:0}
.scene canvas{display:block;height:auto}
.scene .cap{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;font-size:12px;color:var(--mute);padding:4px 10px;background:var(--panel);border-top:2px solid var(--edge)}
.scene .cap b{font-size:12px;color:var(--gold)}
.tip{position:fixed;pointer-events:none;background:var(--edge);color:var(--bone);border:2px solid var(--gold);padding:0 6px;font-size:12px;line-height:20px;white-space:nowrap;z-index:3;display:flex;gap:6px;align-items:center}
.tip img{width:32px;height:32px}
.tip[hidden]{display:none}
.scene canvas{touch-action:none;cursor:pointer;max-width:none}
.farmwrap{overflow:auto;max-height:820px;background:#05080f}
.hud{max-width:1360px;margin:0 auto 12px;display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:18px;padding:10px 14px}
.hudropes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.hud .rope{margin:0}.hud .rope svg{height:30px}
.hudside .mini{grid-template-columns:repeat(4,minmax(0,1fr))}
.hudside .tension{margin-top:6px}
.scene{max-width:1360px;margin:0 auto}
.main2{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:14px;max-width:1360px;margin:14px auto 0;align-items:start}
.tip{white-space:normal;max-width:340px;align-items:flex-start;padding:6px 8px}
.tip img{width:48px;height:48px;flex:none}
.tip div{display:flex;flex-direction:column;line-height:18px}
.tip div b{color:var(--gold)}
.tip div span{color:var(--mute)}
@media (max-width:900px){.hud{grid-template-columns:1fr}.main2{grid-template-columns:1fr}}
@media (max-width:600px){.hudropes{grid-template-columns:1fr}.hudside .mini{grid-template-columns:repeat(2,1fr)}}
.pb-land{background:#2b2412;margin:0 -10px;padding:6px 10px}
.planbar{display:flex;flex-direction:column;gap:6px;padding:8px 10px;background:var(--panel);border-top:2px solid var(--edge)}
.pb-row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.pb-row .label{min-width:32px}
.iconbtn.on{color:#1a1205;background:var(--gold)}
.photo{display:block;width:100%;max-width:720px;height:auto;margin:10px 0;border:2px solid var(--edge)}
.album{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px;margin-top:8px}
.albthumb{background:var(--panel2);border:2px solid var(--edge);padding:6px;text-align:left;display:flex;flex-direction:column}
.albthumb.on{border-color:var(--gold)}
.albthumb small{color:var(--dim)}
.pb-eval{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;border-top:2px dotted var(--line);padding-top:6px}
.pb-eval .ok{color:#9ff0c8}.pb-eval .no{color:#ffb1a0}

/* stage */
.stage{background:var(--panel);padding:14px;min-height:260px}
.stage h2{font-size:24px;line-height:30px;color:var(--gold);text-shadow:2px 2px 0 var(--edge)}
.hint{color:var(--mute);font-size:12px;margin:6px 0 12px;max-width:68ch}
.acts{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.act{text-align:left;background:var(--panel2);padding:8px 10px;display:flex;flex-direction:column;gap:2px;min-height:76px;position:relative}
.act b{font-size:12px;color:var(--bone);padding-left:16px;position:relative}
.act b:before{content:"";position:absolute;left:0;top:7px;width:8px;height:8px;border:2px solid var(--line2)}
.act span{font-size:12px;color:var(--mute);line-height:18px}
.act:hover{background:#21345a}
.act.on{background:#2b2412;box-shadow:inset 2px 2px 0 var(--goldhi),inset -2px -2px 0 var(--golddk)}
.act.on b{color:var(--gold)}
.act.on b:before{background:var(--gold);border-color:var(--goldhi)}
.act[disabled]{opacity:.35;cursor:not-allowed}
.slots{display:flex;gap:6px;align-items:center;margin:12px 0 4px;flex-wrap:wrap}
.slot{width:28px;height:12px;border:2px solid var(--golddk);background:var(--lo)}
.slot.f{background:var(--gold);box-shadow:inset 0 -3px 0 var(--golddk)}
.slot.x{border-color:var(--cinnabar);background:repeating-linear-gradient(45deg,transparent 0 2px,var(--cinnabar) 2px 4px)}
.dil{margin-top:14px;border-top:2px dashed var(--line);padding-top:10px}
.dil .ends{display:flex;justify-content:space-between;font-size:12px;color:var(--mute);gap:10px}
.dilwrap{position:relative;margin:6px 0}
.dilwrap input{width:100%;-webkit-appearance:none;appearance:none;height:16px;background:repeating-linear-gradient(90deg,var(--line2) 0 6px,var(--lo) 6px 8px);border:2px solid var(--edge);outline:none}
.dilwrap input::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:22px;background:var(--gold);border:2px solid var(--edge);box-shadow:inset -2px -2px 0 var(--golddk),inset 2px 2px 0 var(--goldhi);cursor:pointer}
.dilwrap input::-moz-range-thumb{width:12px;height:20px;background:var(--gold);border:2px solid var(--edge);border-radius:0;cursor:pointer}
.dil .lock{font-size:12px;color:var(--rust)}
.go{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;align-items:center}
.btn{background:var(--gold);color:#1a1205;border:2px solid var(--edge);padding:4px 16px;letter-spacing:.06em;font-size:12px;line-height:20px;
  box-shadow:inset 2px 2px 0 var(--goldhi),inset -2px -3px 0 var(--golddk),0 3px 0 var(--edge)}
.btn:hover{filter:brightness(1.08)}
.btn:active{transform:translateY(2px);box-shadow:inset 2px 2px 0 var(--golddk),0 1px 0 var(--edge)}
.btn.ghost{background:var(--panel2);color:var(--gold);box-shadow:inset 2px 2px 0 var(--hi),inset -2px -3px 0 var(--lo),0 3px 0 var(--edge)}
.btn[disabled]{opacity:.4;cursor:not-allowed}

/* event card */
.card{max-width:660px;margin:0 auto;padding:16px 18px;background:#1a2846;position:relative;
  box-shadow:inset 2px 2px 0 var(--hi),inset -2px -2px 0 var(--lo),inset 0 0 0 4px #1a2846,inset 0 0 0 6px var(--golddk)}
.card .tag{font-size:12px;color:var(--cinnabar);letter-spacing:.12em}
.card h2{font-size:24px;line-height:30px;color:var(--gold);margin:2px 0 10px;text-shadow:2px 2px 0 var(--edge)}
.card p{margin:0 0 10px;max-width:62ch}
.who{float:right;margin:0 0 8px 14px;text-align:center;width:88px}
.who img{width:80px;height:80px;background:var(--lo);border:2px solid var(--edge);box-shadow:inset 0 0 0 2px var(--golddk);display:block;margin:0 auto}
.who span{display:block;font-size:12px;line-height:16px;color:var(--mute);margin-top:4px}
.opts{display:flex;flex-direction:column;gap:6px;margin-top:12px;clear:both}
.opt{text-align:left;background:var(--lo);border:2px solid var(--edge);box-shadow:inset 2px 2px 0 var(--panel2);padding:6px 10px;display:flex;gap:10px;align-items:flex-start}
.opt:hover{background:#22355c}
.opt:hover .k{background:var(--gold);color:#1a1205}
.opt .k{font-size:12px;color:var(--gold);min-width:20px;text-align:center;border:2px solid var(--golddk);line-height:16px}
.opt small{display:block;color:var(--rust);font-size:12px}
.opt[disabled]{opacity:.4;cursor:not-allowed}
.result{border-top:2px dashed var(--line2);margin-top:12px;padding-top:12px;clear:both}
.deltas{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 12px}
.d{font-size:12px;padding:0 6px;border:2px solid var(--line2);background:var(--lo)}
.d.up{color:#9ff0c8;border-color:#2f7a5e}.d.dn{color:#ffb1a0;border-color:#83402f}
.count{font-size:12px;color:var(--dim);margin-top:10px}

/* report */
.rep{display:grid;grid-template-columns:1fr 1fr;gap:2px 24px;max-width:600px}
.rep div{display:flex;justify-content:space-between;border-bottom:2px dotted var(--line);padding:2px 0;font-size:12px;gap:8px}
.notes{margin:12px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:2px;font-size:12px;color:var(--mute)}
.notes li:before{content:"▸ ";color:var(--gold)}

/* members */
.mem{display:grid;grid-template-columns:48px minmax(0,1fr);gap:8px;padding:6px 0;border-bottom:2px dotted var(--line);align-items:center}
.mem:last-child{border-bottom:0}
.mem img{width:48px;height:48px;background:var(--lo);border:2px solid var(--edge)}
.mem .nm{font-size:12px;line-height:16px;color:var(--bone)}
.mem .rl{font-size:12px;line-height:16px;color:var(--dim)}
.mem .cbar{height:6px;margin-top:4px;position:relative;background:repeating-linear-gradient(90deg,var(--lo) 0 4px,transparent 4px 6px)}
.mem .cbar i{position:absolute;inset:0 auto 0 0;color:var(--malachite);background:repeating-linear-gradient(90deg,currentColor 0 4px,transparent 4px 6px)}
.mem .cbar i.lo{color:var(--cinnabar)}
.mem .cbar.ng i{color:var(--azurite)}
.mem .cbar.ng i.done{color:var(--gold)}
.mem.away{opacity:.45}
.badge{font-size:12px;line-height:14px;color:#1a1205;background:var(--gold);padding:0 3px;margin-left:4px}
.memlist{max-height:520px;overflow:auto;padding-right:4px}
.feed{display:flex;flex-direction:column;gap:4px;font-size:12px}
.feed div{border-left:4px solid var(--line2);padding-left:8px;color:var(--mute);line-height:18px}
.feed div b{color:var(--bone)}

/* log */
.log{max-height:220px;overflow:auto;font-size:12px;color:var(--mute);display:flex;flex-direction:column;gap:0;line-height:20px}
.log span{color:var(--dim);margin-right:6px}

/* overlay */
.ov{position:fixed;inset:0;background:rgba(5,8,15,.88);display:flex;align-items:flex-start;justify-content:center;overflow:auto;z-index:20;
  padding:max(24px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px))}
.ov .box{background:var(--panel);max-width:880px;width:100%;padding:22px;margin:auto 0}
.ov .box h2{font-size:24px;line-height:30px;color:var(--gold)}
.intro h1{font-size:48px;line-height:52px;color:var(--gold);letter-spacing:.08em;text-shadow:4px 4px 0 var(--edge),4px 4px 0 var(--golddk)}
.intro .en{letter-spacing:.4em;color:var(--mute);font-size:12px}
.intro p{max-width:66ch;color:var(--bone)}
.cast{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 16px}
.cast figure{margin:0;text-align:center;width:64px}
.cast img{width:48px;height:48px;background:var(--lo);border:2px solid var(--edge);display:block;margin:0 auto}
.cast figcaption{font-size:12px;line-height:14px;color:var(--dim);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:8px;margin:8px 0 16px}
.choice{text-align:left;background:var(--panel2);padding:10px 12px;display:grid;grid-template-columns:48px 1fr;gap:4px 10px;align-items:start}
.choice img{width:48px;height:48px;grid-row:span 4;background:var(--lo);border:2px solid var(--edge)}
.choice b{font-size:12px;color:var(--bone);display:block}
.choice span{display:block;font-size:12px;color:var(--mute);line-height:18px}
.choice .up{color:#9ff0c8}.choice .dn{color:#ffb1a0}
.choice.s{grid-template-columns:1fr}
.choice.on{background:#2b2412;box-shadow:inset 2px 2px 0 var(--goldhi),inset -2px -2px 0 var(--golddk)}
.choice.on b{color:var(--gold)}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:12px;max-width:420px}
.field input{background:var(--ink);border:2px solid var(--edge);box-shadow:inset 2px 2px 0 var(--lo);color:var(--bone);padding:6px 10px;font:inherit;border-radius:0}
.fac{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.fac .f{background:var(--panel2);padding:10px;display:flex;flex-direction:column;gap:4px}
.fac .f b{font-size:12px;color:var(--bone)}
.fac .f span{font-size:12px;color:var(--mute);line-height:18px}
.fac .f .row{display:flex;justify-content:space-between;align-items:center;margin-top:auto;gap:8px}
.fac .f.built{background:#163126}
.ach{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}
.ach div{background:var(--panel2);padding:8px 10px;font-size:12px;color:var(--dim);line-height:18px}
.ach div b{display:block;font-size:12px;color:var(--dim)}
.ach div.got{background:#2b2412;color:var(--mute)}
.ach div.got b{color:var(--gold)}
.ach div.got b:before{content:"★ "}
.toast{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:max(16px,env(safe-area-inset-bottom,0px));background:var(--panel2);padding:10px 14px;z-index:30;max-width:320px;animation:tin .25s steps(4)}
.toast b{color:var(--gold);font-size:12px;display:block}
@keyframes tin{from{transform:translateY(12px);opacity:0}to{transform:none;opacity:1}}

/* silent */
.silent{text-align:center;padding:30px 10px}
.silent p{max-width:46ch;margin:14px auto;color:var(--mute)}
.lamp{width:70px;margin:0 auto}
.flame{transform-origin:35px 40px;animation:fl 1.6s steps(3) infinite}
@keyframes fl{0%,100%{transform:scale(1,1)}50%{transform:scale(.9,1.1)}}
@media (prefers-reduced-motion:reduce){.flame,.toast{animation:none}}

.ending h1{font-size:48px;line-height:52px;color:var(--gold);text-shadow:4px 4px 0 var(--edge)}
.ending .img{font-size:12px;color:var(--bone);border-left:4px solid var(--cinnabar);padding-left:12px;margin:10px 0 16px;max-width:60ch;background:var(--lo);padding:8px 12px}
details summary{list-style:none}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-track{background:var(--lo)}::-webkit-scrollbar-thumb{background:var(--line2);border:2px solid var(--lo)}

@media (max-width:1100px){.main{grid-template-columns:240px minmax(0,1fr)}.right{grid-column:1 / -1;display:grid;grid-template-columns:1fr 1fr;gap:14px}}

function build(id){

  if(S.D<cost_(c)) return;
  S.D-=cost_(c); S.fac[id]=lv+1;
  if(IT[id]&&(id!=='stupa'||lv===0)){const ok=placeOrTray(id);if(!ok)log(`${IT[id].n}暂时没有空地，放进了仓库。`);}

  else if(id==='stupa'){
    if(lv===0&&!S.f.stupaStyle){queue('stupa_design',0);}
    S.L+=6;S.H+=12; const sw=S.f.rfra?ri(0,4):ri(-7,6); S.T+=sw;

    if(lv+1===3){S.f.stupaDone=1;if(S.f.refusedAll)grant('wusuode');}
  } else {
    log(`建成：${f.n}。`);
    if(id==='protector') queue('protector_open',0);
  }
  if(S.phase==='plan'&&S.pending.length===0&&id==='stupa'&&!S.f.stupaStyle){}
  save(); render(); if(document.getElementById('facbox')) openBuild();
}

function ap(e){
  if(!e) return;
  const tm=(S.camera>0?(tk('B4')?1.5:2):1)*(1+S.H/(tk('B4')?500:250));
  if(e.L) S.L+=e.L; if(e.T) S.T+=Math.round(e.T*tm*(e.T<0&&tk('C4')?.8:1)); if(e.D) S.D+=e.D; if(e.H) S.H+=e.H;
  if(e.M) S.M+=e.M; if(e.B) S.B+=e.B; if(e.HA) S.HA+=e.HA; if(e.HP) S.HP+=e.HP; if(e.KN) S.KN+=e.KN; if(e.S) S.self+=e.S; if(e.RT) S.RT+=e.RT;
  if(e.r) for(const k in e.r) S.npc[k]=(S.npc[k]||0)+e.r[k];
  if(e.c) for(const k in e.c){ if(k==='all') act().forEach(x=>x.c+=e.c[k]); else {const x=mem(k); if(x&&!x.left) x.c+=e.c[k];} }
  if(e.add) [].concat(e.add).forEach(id=>{addMember(id);log(`${MT[id].n} 加入了。`);});
  if(e.gen) for(let i=0;i<e.gen;i++){const g=addGeneric(e.tourist,e.student);log(`${g.n}（${g.r}）开始来共修。`);}
  if(e.rm) [].concat(e.rm).forEach(id=>leave(mem(id),'离开了'));
  if(e.f) Object.assign(S.f,e.f);
  if(e.q) e.q.forEach(([id,d])=>queue(id,d));
  if(e.ach) grant(e.ach);
  if(e.cam) S.camera=Math.max(S.camera,e.cam);
  if(e.au) S.auth.you+=e.au; if(e.ac) S.auth.chad+=e.ac;
  clampAll();
}
function clampAll(){
  S.L=clamp(S.L,0,100);S.T=clamp(S.T,0,100);S.H=clamp(S.H,0,100);S.B=clamp(S.B,0,100);
  S.self=clamp(S.self,0,100);S.RT=clamp(S.RT,0,100);S.M=clamp(S.M,0,100);if(S.HA!=null){S.HA=clamp(S.HA,0,100);S.HP=clamp(S.HP,0,100);S.KN=clamp(S.KN,0,100);}
  S.members.forEach(x=>x.c=clamp(x.c,0,100));
  S.auth.you=clamp(S.auth.you,0,100);S.auth.chad=clamp(S.auth.chad,0,100);
}
function sc(d,v){return d>0?d*clamp((100-v)/55,.08,1):d*clamp(v/55,.15,1);}
function soft(fn){const l=S.L,t=S.T;const r=fn();S.L=clamp(l+sc(S.L-l,l),0,100);S.T=clamp(t+sc(S.T-t,t),0,100);return r;}

/* ===== 第一章 ===== */
E({id:'zoom_mute',tag:'成员人生 · 喜剧',title:'你静音了',ch:[1],cond:covid,w:6,
  text:()=>`周日共修第二十分钟，你在念皈依文。屏幕上Rosa举着一张纸：YOU ARE MUTED。九个小方格里，有三个人已经睡着了，一个人在煎鸡蛋。`,
  opts:[{t:'从头再念一遍',e:{L:1,B:2},r:'大家又听了一遍。Ethan说这是“重复的力量”。'},
    {t:'宣布刚才是“止语禅修”',e:{L:-1,c:{all:2}},r:'噶举派没有这个说法，但没人纠正你。下周出席率略升。'},
    {t:'买个像样的麦克风',e:{D:-150,f:{mic:1}},r:'$149.99。“直播事故”变少了。'}]});
E({id:'landlord',tag:'邻里与市政',title:'前主人发现“宗教活动”',at:'2020-05',
  text:()=>`农场的前主人Jake Pruitt按约定回来修热水器，看见客厅里的唐卡、十二个坐垫和一张写满藏文的仪轨表。他的酒吧因为疫情关门三个月了。“我卖给你的是农场，”他说，“这里是在搞什么？”`,
  opts:[{t:'实话实说，请他坐下喝杯茶',e:{T:2,r:{jake:3}},fx(){if(chance(.5)){S.f.jakeCurious=1;return '他坐了十分钟，没说话，走时问：“周日几点？”';}return '他礼貌地喝完茶，说要“考虑一下”。';}},
    {t:'说这是“读书会”',e:{L:-2,T:1,f:{lied:1},q:[['landlord2',6]]},r:'他点点头。你知道这事还没完。'},
    {t:'坚持付他修理费和一笔辛苦钱',e:{D:-600,r:{jake:6}},r:'他沉默了一会儿：“说实话，这钱我挺需要的。”'}]});
E({id:'landlord2',tag:'邻里与市政',title:'“读书会”',
  text:()=>`Jake在Facebook上看到了你们“读书会”的直播：法螺、金刚铃和二十分钟的藏文念诵。他发来一条短信：“你们读的是什么书？”`,
  opts:[{t:'道歉，坦白',e:{T:1,r:{jake:2},L:1},r:'“下次直说就行，”他回，“我又不是HOA。”'},
    {t:'回复：“《心经》，很短的一本”',e:{T:-2,r:{jake:-3}},r:'他没再回复。热水器后来是你自己修的。'}]});
E({id:'dale_arrives',tag:'人物',title:'不用信什么的那种',at:'2020-07',
  text:()=>`一个穿Fort Hood连帽衫的男人站在门口，在门垫上来回蹭了三次鞋才进来。他叫Dale Whitmore，退役军士。“VA的医生说冥想对我有好处，”他说，“这里有没有不用信什么的那种？”`,
  opts:[{t:'有。我们从数呼吸开始',e:{add:'dale',L:-1,c:{dale:6}},r:'他坐在最靠门的位置。四十分钟后他说：“这是我这个月第一次没想着门口。”'},
    {t:'有，但我们会念藏文。你可以只是坐着',e:{add:'dale'},r:'他坐着，听你们念了一小时听不懂的话。走时他说：“像无线电静噪。挺好的。”'},
    {t:'我们是宗教团体，建议他去VA的正念课',e:{L:1,M:1,f:{daleLost:1},q:[['dale_return',10]]},r:'他点点头，走了。门垫上留下两道湿印。'}]});
E({id:'dale_return',tag:'人物',title:'Dale又来了',
  text:()=>`VA的正念课每次限十二人，候补名单排到明年。Dale又站在了你门口，这次没穿连帽衫。`,
  opts:[{t:'请他进来',e:{add:'dale',M:1},r:'他说：“我还是想试试有人念那些听不懂的话的那种。”'}]});
E({id:'hoa42',tag:'邻里与市政 · 讽刺',title:'第4.2条',ch:[1],cond:()=>S.loc==='home'&&S.turn>=6,w:8,
  text:()=>`隔壁湖畔别墅区Lake Shore Estates的HOA主席Linda Kowalczyk带着《社区美学守则》上门：你挂在农场围栏上的经幡从她们小区看得见，违规了，尽管你根本不在她们小区。第4.2条允许悬挂的旗帜仅限美国国旗、德州州旗、军旗与“公认大学运动队旗”。她已经用荧光笔划好了。`,
  opts:[{t:'把经幡印上贝勒熊队的绿色与金色',e:{T:2,L:-1,r:{linda:1},f:{hoaMet:1,baylorFlags:1}},r:'Linda看了很久，找不到能反驳的条款。“贝勒经幡”成了邻居们拍照的地方。'},
    {t:'查阅德州宗教自由法条并回信',e:{f:{hoaMet:1,lawWar:1},r:{linda:-6}},r:'你的回信有六页。Linda的回信有七页。你们成了长期笔友，以最不愉快的方式。'},
    {t:'拆下经幡，改挂一面“In God We Trust”旗',e:{T:4,L:-4,c:{tenzin:-12},f:{hoaMet:1},ach:'baohu'},r:'在德州，这是法律鼓励的。Tenzin路过时停了一下，没说话。'},
    {t:'请Linda进来喝茶，讲讲经幡的意思',e:{f:{hoaMet:1}},fx(){if(chance(.5)){S.npc.linda+=6;ap({T:2});return 'Linda听完说：“所以风一吹就等于念了一遍？这比我们教会的效率高。”她走时没再提第4.2条。';}ap({H:6,T:-2});return 'Linda全程开着录音。第二天，录音出现在了Nextdoor上，标题是《HOA主席实地调查》。';}}]});
E({id:'chad_ig',tag:'教法与纯度 · 讽刺',title:'摆错方向',ch:[1],w:5,cond:()=>S.turn>=5,
  text:()=>`一个叫@karma.senge.dharma的账号在你的佛龛照片下留言：“The shrine faces the wrong direction. Respectfully. 🙏 (Tib. mchod gshom, pron. [tɕʰø ɕom])”。他的简介写着：Three-year retreat, Nepal.`,
  opts:[{t:'回复感谢指正，把佛龛转了个方向',e:{L:1,ac:3,r:{chad:2}},r:'他回了一个合十。你的佛龛现在正对着冰箱。'},
    {t:'不回',e:{ac:4},r:'他又在另外三张照片下面留了言。'},
    {t:'回复：“请问您在尼泊尔哪里闭关？”',e:{H:3,r:{chad:-6},f:{chadAsked:1}},r:'他删掉了评论，然后拉黑了你。'}]});
E({id:'dawson_sermon',tag:'跨宗教 · 讽刺',title:'末世迹象',ch:[1,2],w:5,cond:()=>S.turn>=6,
  text:()=>`Woodway丰盛生命教会的Pastor Rick Dawson在周日讲道中提到“Hewitt一个客厅里的东方神秘主义团体”，作为“末世迹象”之一。讲道视频有一万两千次播放。这周你的Zoom出席人数翻了一倍。`,
  opts:[{t:'给他写一封诚恳的感谢信',e:{T:3,r:{dawson:5}},r:'他回信了，用的是教会的信纸，抬头印着咖啡厅和攀岩墙的照片。“愿主祝福你的旅程。”'},
    {t:'在共修开示里拿“末世”开个玩笑',e:{H:5,T:-1,c:{all:3}},r:'成员们笑了。有人把录屏剪了发到TikTok上。'},
    {t:'什么都不做',e:{gen:1},r:'一位新面孔说：“我是看了那个讲道才来的。”'}]});
E({id:'uri',tag:'德州环境',title:'冬夜',at:'2021-02',
  text:()=>`Uri风暴第二夜，全城停电，室外−12°C。你家有燃气壁炉，是整条街唯一还暖和的屋子。住在路口的前主人Jake带着两个孩子敲门。隔壁的老太太也在。`,
  opts:[{t:'开放客厅，撤走坐垫，收起佛龛',e:{T:9,L:-2,r:{jake:9},M:3},r:'这周共修取消了。凌晨三点，Jake的小女儿睡在本该是佛龛的地方，你在一旁默念了一遍皈依文。'},
    {t:'开放客厅，但保留佛龛和酥油灯',e:{T:6,H:4,r:{jake:5},q:[['butter_alarm',1]]},r:'孩子们盯着酥油灯看了很久。火光从窗户里透出去，一整夜。'},
    {t:'送去毯子和热水，但说明屋内在闭关',e:{T:-5,L:3,r:{jake:-7},c:{dale:6}},r:'Dale说他理解：“任务就是任务。”Jake没再说话。'},
    {t:'把大家送去浸信会的避难所，并一起帮忙',e:{T:6,M:4,B:6,f:{marcusMet:1},r:{marcus:6}},r:'避难所的组织者叫Marcus Bell，East Waco浸信会执事。他递给你一个保温壶：“你会煮咖啡吗？会就留下。”'}]});
E({id:'butter_alarm',tag:'邻里与市政',title:'酥油灯报警',
  text:()=>`凌晨两点，消防车停在你家门口。没有起火——是街尾一户人家看见你窗户里一整夜摇曳的火光。`,
  opts:[{t:'解释酥油灯是什么',e:{T:-1,H:4},r:'消防员认真听完，问：“它们是黄油做的？真的黄油？”'},
    {t:'从此换成LED酥油灯',e:{L:-2,T:2,f:{led:1}},r:'Tenzin看着LED灯说：“我奶奶会怎么想呢。”保险附加费降了。'},
    {t:'送消防员一盒馍馍',e:{T:3,D:-40},r:'消防队的Facebook发了一张照片：“Hewitt的邻居请我们吃了饺子（？）”'}]});
E({id:'recorded',tag:'教法与纯度',title:'录播灌顶',ch:[1,2],w:5,cond:()=>S.turn>=8,
  text:()=>`几位成员在YouTube上找到一段“完整的绿度母灌顶录像”，四十七万次播放。“仁波切又来不了，”他们说，“我们一起看这个不行吗？”`,
  opts:[{t:'坚持：灌顶只能当面从上师处领受',e:{L:2,c:{all:-3}},r:'有人失望，有人松了口气。Tenzin朝你点了点头。'},
    {t:'组织大家看录播',e:{L:-6,c:{all:5},q:[['recorded_conseq',4]]},r:'大家看得很投入。弹幕里有人问这是不是“Netflix新剧”。'},
    {t:'请仁波切通过Zoom给一次口传',e:{D:-300,L:4,RT:3,f:{lung:1}},r:'不是灌顶，但是真的。仁波切的Wi-Fi断了两次，第三次连上时他在笑。'}]});
E({id:'recorded_conseq',tag:'上师与传承',title:'仁波切听说了',
  text:()=>`仁波切的侍者在电话里很客气，客气得让人发冷：“仁波切听说你们那里在看录像修本尊法。”`,
  opts:[{t:'承认并请求忏悔',e:{L:-1,RT:-3,S:2},r:'电话那头沉默了很久，然后说：“念一万遍百字明。”'},
    {t:'解释是成员自发的',e:{L:-3,RT:-8},r:'侍者说他会转达。你知道他会原样转达。'}]});
E({id:'nguyen',tag:'人物',title:'为祖先做法事',ch:[1,2],w:7,cond:()=>!has('hanh')&&!S.f.nguyenNo&&S.turn>=7,
  text:()=>`Hạnh和她丈夫Minh开一家美甲店，带着祖母来找你。祖母去年在越南的哥哥过世了，疫情里没能回去。他们想为他做一场法事。他们家里拜的是阿弥陀佛。`,
  opts:[{t:'以噶举的方式为亡者回向',e:{add:'hanh',L:1},r:'祖母听不懂藏文，但一直握着念珠。结束后她把一个红包塞进了供养箱。'},
    {t:'学着做一场净土念佛',e:{add:'hanh',L:-3,T:2,D:300,c:{hanh:12}},r:'你念“南无阿弥陀佛”的发音让祖母笑出了声。她说：“心到了就行。”'},
    {t:'介绍他们去休斯顿的越南寺院',e:{L:1,M:1,f:{nguyenNo:1}},r:'他们道谢离开。一个月后你在H-E-B碰见Minh，他说休斯顿开车太远了。'}]});
E({id:'hartley_meet',tag:'人物 · 学术',title:'田野',ch:[1,2],w:5,cond:()=>!has('hartley')&&!S.f.hartleyNo&&S.turn>=12,
  text:()=>`贝勒大学宗教系副教授Dr. Evelyn Hartley发来邮件，想把你们作为“德州中部少数宗教”研究项目的田野点。邮件末尾附了伦理审查批号。`,
  opts:[{t:'欢迎她来做田野',e:{add:'hartley',f:{hartley:1},T:2},r:'她第一次来带了录音笔，第三次来带了坐垫。'},
    {t:'只欢迎她以修行者身份来',e:{},fx(){if(chance(.55)){addMember('hartley',50);S.f.hartley=1;log('Dr. Evelyn Hartley 加入了。');return '她犹豫了一周，回信说：“那我先当一个笨拙的修行者吧。”';}S.f.hartleyNo=1;return '她回信说理解，但这超出了她的研究设计。';}},
    {t:'婉拒',e:{L:1,f:{hartleyNo:1}},r:'她回信很礼貌。你后来在一篇期刊论文的脚注里看到自己：“一个拒绝受访的团体”。'}]});
E({id:'tibetan_lonely',tag:'人物',title:'家里的电话',ch:[1,2,3],w:4,cond:()=>S.origin==='tibetan'&&S.turn>=6,
  text:()=>`达兰萨拉的母亲在视频里问你：什么时候成家，什么时候回去，那些美国人是不是真的懂。你在韦科说英语开示，回家说藏语时，舌头反而慢了。`,
  opts:[{t:'说实话：我也不知道',e:{B:-6,S:2},r:'母亲沉默了一会儿，说：“那就好好修。”'},
    {t:'报喜不报忧',e:{B:6,L:1},r:'挂掉电话后，你在佛堂里坐到天亮。'}]});

/* ===== 第二章 ===== */
E({id:'store_move',tag:'章节',title:'盖一座佛堂',at:'2022-01',
  text:()=>`农舍客厅已经坐不下了，上周有人在厨房里打坐。银行愿意给你们一笔$6,000的建设贷款，每月还$300。你可以自己设计：用“建造建筑”画一栋楼，再在里面画出“佛堂”房间（每格坐0.8人）；也可以请承包商按标准图纸盖一座能坐四十人的。佛堂所在的楼必须挨着连到县道的路。`,
  opts:[{t:'贷款$6,000，自己设计佛堂',e:{D:6000,f:{storefront:1,hallLoan:1}},fx(){S.loc='store';log('拿到了$6,000建设贷款。');return '钱到账了。用地图下方的“建造建筑”画楼，再用“布置房间”画出佛堂。';}},
    {t:'贷款，请承包商按标准图纸盖',e:{f:{storefront:1,hallLoan:1}},fx(){S.loc='store';const ok=autoBuildHall(10,5,true);log(ok?'承包商盖好了一座10×5的佛堂。':'承包商找不到地方，把钱退给了你。');if(!ok)S.D+=6000;return ok?'Tenzin站在空荡荡的新佛堂中央拍了一下手，回声很长。':'地不够大。贷款已经打到账上，你可以先买地，再自己盖。';}},
    {t:'再等等，留在农舍客厅',e:{},fx(){if(Y()<=2024) queue('store_move_again',4);return '客厅里又加了两个坐垫。';}}]});
E({id:'store_move_again',tag:'章节',title:'承包商又来了',
  text:()=>`银行又打来电话，建设贷款的额度还在：$6,000，每月还$300。`,
  opts:[{t:'贷款，自己设计',e:{D:6000,f:{storefront:1,hallLoan:1}},fx(){S.loc='store';log('拿到了$6,000建设贷款。');return '用“建造建筑”和“布置房间”盖你的佛堂。';}},
    {t:'还是不搬',e:{L:1},fx(){if(Y()<=2024) queue('store_move_again',6);return '你说：“慢一点也是一种策略。”';}}]});
E({id:'flags_protest',tag:'邻里与市政',title:'抗议横幅',ch:[2],w:7,cond:()=>S.loc==='store',
  text:()=>`一位开车路过的游客向县里投诉：你农场门口挂着“一串彩色抗议横幅”。县里的检查员站在门口，很认真地问：“你们在抗议什么？”`,
  opts:[{t:'解释经幡的意思',e:{T:1},r:'检查员在表格上写下：“风力祈祷装置，非政治性”。'},
    {t:'“我们在抗议痛苦。”',e:{H:6},fx(){const s=ri(-2,4);ap({T:s});return s>=0?'检查员笑了，这句话后来上了Tribune-Herald的“本周金句”。':'检查员没笑，在表格上写下：“态度不配合”。';}},
    {t:'把经幡移到室内',e:{L:-2,T:1},r:'Magnolia的一家礼品店第二周开始卖一种“禅意农舍风”风铃。'}]});
E({id:'baylor_wave',tag:'成员人生',title:'一学期的人流',ch:[2,3],months:[9],w:20,rep:1,cd:12,
  text:()=>`开学了。贝勒一门“世界宗教导论”课要求学生“参访一个非基督教宗教场所并写一篇反思”。这周六来了十四个学生，大部分人穿着Baylor Bears的T恤。`,
  opts:[{t:'办一场学生专场，讲浅一点',e:{gen:3,student:true,L:-1,D:200},r:'他们很热情。你知道他们大多只会待一个学期。'},
    {t:'照常共修',e:{gen:1,student:true,L:1},r:'有十三个人在第二个小时离开了。留下的那个问你借了一本书。'},
    {t:'与Dr. Hartley合作开学分实践课',req:()=>has('hartley'),rq:'需要Dr. Hartley在',e:{gen:2,student:true,T:3,L:1,c:{hartley:5}},r:'课程名称是“宗教实践的参与式观察”。学生们管它叫“打坐课”。'}]});
E({id:'anniv30',tag:'媒体与舆论',title:'三十周年',at:'2023-04',
  text:()=>`KWTX制作专题《韦科的宗教版图：1993年三十年后》。记者Danielle Okafor请求采访你。她在电话里说：“我想做一个不一样的报道。”每个记者都这么说。`,
  opts:[{t:'接受，并邀请她参观全部空间，包括护法殿',e:{H:16,r:{danielle:6}},fx(){const s=ri(-12,12);ap({T:s});return s>=0?`报道很温和，结尾镜头是酥油灯。信任${s>0?'上升':'持平'}。`:'报道里有一个三秒的镜头：黑色愤怒的护法像，配乐是低音鼓。';}},
    {t:'接受，但只谈冥想与社区服务',e:{H:6,T:3,L:-2,c:{tenzin:-8}},r:'报道标题是《韦科的正念角落》。Tenzin说：“所以我们是一家水疗馆。”'},
    {t:'拒绝',e:{H:-3,q:[['anniv30_refuse',1]]},r:'Danielle说理解。她的语气里有一种你不喜欢的理解。'},
    {t:'请Dr. Hartley以学者身份代为受访',req:()=>has('hartley'),rq:'需要Dr. Hartley在',e:{H:6,T:4,c:{hartley:5}},r:'她讲得很好，只是在第二分钟称你们为“我的研究对象”。'}]});
E({id:'anniv30_refuse',tag:'媒体与舆论',title:'神秘团体拒绝采访',
  text:()=>`专题播出了。在讲到你们的那一段，画面是你们紧闭的玻璃门，旁白说：“该团体拒绝了我们的采访请求。”`,
  opts:[{t:'发一份简短声明',e:{T:-2,H:4},r:'声明被引用了一句，刚好是最不重要的那句。'},
    {t:'忍着',e:{T:-4,L:1},r:'一周后热度过去了。Nextdoor上的帖子没过去。'}]});
E({id:'karmapa',tag:'噶举内部政治',title:'两位噶玛巴',ch:[2,3],w:5,
  text:()=>`荟供后的茶歇，一位新成员问：“我们跟的是哪一位噶玛巴？”Tenzin放下了茶杯。另一位成员掏出手机，开始放一段YouTube视频。`,
  opts:[{t:'明确表态，依本派传承立场',e:{L:2,RT:3},fx(){act().filter(x=>x.pref<50).forEach(x=>x.c-=8);return '你讲得清楚。有两个人当晚退出了群聊。';}},
    {t:'模糊处理：“两位都是值得尊敬的上师”',e:{L:-1,c:{tenzin:-6}},r:'大部分人松了口气。Tenzin说你“像个政客”。'},
    {t:'不谈，直接开始修上师瑜伽',e:{L:1,c:{all:-2}},r:'有人觉得你在回避，有人觉得这就是回答。'}]});
E({id:'momo_bbq',tag:'文化碰撞 · 喜剧',title:'馍馍与烤肉',ch:[2,3],months:[6,7,8],w:12,
  text:()=>`Nguyen家提议办慈善晚宴，Marcus说他表弟有烟熏炉。菜单之争：藏式馍馍、越南春卷、德州牛胸肉。素食成员在群里发了一篇关于“不杀生”的长文。`,
  opts:[{t:'全素晚宴',e:{L:2,D:Math.round(300),r:{marcus:-1}},r:'Marcus盯着菠萝蜜“手撕猪肉”看了很久：“我会告诉我表弟这是一个误会。”'},
    {t:'荤素分区：“烤肉归烤肉，功德归功德”',e:{D:1800,T:5,c:{all:-2}},r:'晚宴座无虚席。你在素食区和烤肉区之间站了一晚上，像一条三八线。'},
    {t:'把争论本身做成一场关于“不杀生”的公开对谈',req:()=>has('hartley'),rq:'需要Dr. Hartley在场',e:{T:3,L:2,D:700,f:{hankSeed:1}},r:'Marcus的表弟Hank在后排举手：“我烤了四十年肉。你们说的这个，我得想想。”'}]});
E({id:'two_visitors',tag:'地缘政治 · 讽刺',title:'两位访客',ch:[2],w:5,cond:()=>S.turn>=26,
  text:()=>`周二，FBI圣安东尼奥分局的Special Agent Ruiz来访，礼貌地询问你们与“境外势力”的关系，还问玛哈嘎拉是不是某种代号。周四，某“文化交流协会”的代表Wang来访，提议资助一个“藏文化节”。Tenzin本周请了病假。`,
  opts:[{t:'接受资助',e:{D:6000,L:-4,rm:'tenzin',f:{refusedAll:false,ruizTwice:1}},r:'Tenzin没有回来。Ruiz第二次来访时带了一位同事。'},
    {t:'拒绝资助，并告诉Ruiz',e:{T:3},r:'Ruiz谢过你。此后他每个季度都会“顺路看看”。'},
    {t:'两边都请来参加周日荟供',e:{H:14,ach:'zhongguan'},r:'两人在你的停车场里互相拍照。荟供后，他们都拿走了一块饼干。'},
    {t:'把两张名片都交给Dr. Hartley写论文',req:()=>has('hartley'),rq:'需要Dr. Hartley在',e:{c:{hartley:4},f:{jordanChapter:1}},r:'她的研究生Jordan的论文多了一章。'}]});
E({id:'tithe',tag:'跨宗教 · 讽刺',title:'奉献挑战',ch:[2],w:5,
  text:()=>`丰盛生命教会发起“90天奉献挑战：十一奉献，上帝百倍归还”，教会大屏幕上有一个实时进度条。你的三名成员来问：我们能不能也有一个？`,
  opts:[{t:'讲一堂关于“无所得”的课',e:{L:3,D:-200},fx(){const g=act().filter(x=>x.gen).slice(0,2);g.forEach(x=>leave(x,'去丰盛生命教会“试试看”了'));return '讲得很好。有两个人去了丰盛生命教会“试试看”。';}},
    {t:'办“90天大礼拜挑战”',e:{L:1,D:600,f:{knee:1}},r:'第六十天，有人膝盖受伤。第九十天，所有人的大礼拜进度都多了一截。'},
    {t:'什么都不做，只在社交媒体上发一张空钵的照片',e:{H:8},fx(){post(12000);S.f.bowlViral=1;return '这张照片被转发了一万二千次。Brooke发来消息：能不能印在T恤上？';}}]});
E({id:'cited',tag:'媒体与舆论 · 政治',title:'被引用',at:'2024-09',
  text:()=>`大选年。一位州议员候选人的广告片说“韦科不需要更多的异教徒”，背景画面是你的经幡。另一位候选人的广告片说“韦科欢迎所有信仰”，背景画面也是你的经幡。`,
  opts:[{t:'要求两边都撤下',e:{H:-4},r:'两边都没理你。'},
    {t:'什么都不说',e:{},fx(){const a=act().filter(x=>x.gen);if(a.length) leave(pick(a),'因为你“没立场”退出了');ap({gen:1});return '有人因为你“没立场”退出，也有人因为你“没立场”加入。';}},
    {t:'发一条推文：“我们的经幡不参选。”',e:{H:16},fx(){post(40000);return '被转发四万次。Brooke已经做好了T恤。';}}]});
E({id:'security',tag:'德州 · 弧线五',title:'安保志愿队',ch:[2],w:6,cond:()=>has('dale')&&S.loc!=='home',
  text:()=>`又一起教堂枪击的新闻。德州法律允许在教堂持枪，大多数教会都有武装志愿安保队。Dale站在你办公室门口：“我有持枪许可。周日我可以坐在门口。我不会让任何人伤害这里的人。”这不是一个讽刺问题。`,
  opts:[{t:'同意',e:{L:-5,f:{armed:1,armedEver:1},q:[['harass_armed',4]],c:{dale:12}},fx(){const t=mem('tenzin');if(t&&!t.left){t.away=S.turn+3;queue('tenzin_back',3);}return '从此佛堂右上角多了一个小盾牌。Tenzin说他需要离开一阵子。';}},
    {t:'拒绝',e:{L:3,c:{dale:-15},q:[['harass_unarmed',4]]},r:'Dale点点头。他听到的是：“你不信任我。”'}]});
E({id:'harass_armed',tag:'德州 · 弧线五',title:'周日上午十点',
  text:()=>`一个醉醺醺的男人在共修时闯进来，大喊着“异教徒滚出去”，手里拿着一个看不清的东西。Dale站了起来，没有拔枪。他只是挡在门口，平静地和那人说话，直到警察到来。那个东西是一部手机。`,
  opts:[{t:'事后感谢Dale',e:{T:2,c:{dale:10}},r:'Dale说：“我什么都没做。”他的手还在抖。'},
    {t:'和大家一起为那个男人回向',e:{L:2,M:2},r:'有成员不理解。Dale理解。'}]});
E({id:'harass_unarmed',tag:'德州 · 弧线五',title:'周日上午十点',
  text:()=>`一个醉醺醺的男人在共修时闯进来大喊大叫。你们只能报警。警察二十分钟后到了，问的第一个问题是：“你们是不是那种……”他没说完。`,
  opts:[{t:'请Dale帮你一起做笔录',e:{c:{dale:6},T:-1},r:'Dale在笔录上签名时，在“职业”一栏写下了“佛堂志愿者”。'},
    {t:'带大家把剩下的仪轨念完',e:{L:2,c:{all:-2}},r:'念完时，有三个人在哭。'}]});
E({id:'tenzin_back',tag:'人物',title:'Tenzin回来了',cond:()=>has('tenzin'),
  text:()=>`三个月后的一个周日，Tenzin在开始前十分钟出现，把一袋H-E-B买的酥油放在厨房，什么都没说。`,
  opts:[{t:'给他倒一杯茶',e:{c:{tenzin:6}},r:'他说：“盾牌还在？”你说是。他说：“好吧。”'}]});
E({id:'documentary',tag:'媒体 · 弧线三',title:'纪录片',ch:[2,3],w:8,cond:()=>S.H>=50&&!S.f.docDone,
  text:()=>`流媒体纪录片导演Max Feldstein来访，想拍《韦科：三十年后，新的信仰》。他承诺“尊重地呈现”，并说他“个人非常喜欢佛教，在巴厘岛上过冥想课”。`,
  opts:[{t:'配合拍摄',e:{H:10,cam:6,f:{docDone:1},q:[['doc_release',6]]},r:'摄像机进了佛堂。接下来半年，Chad变得更正统，Dale变得更沉默。'},
    {t:'拒绝',e:{H:-5,f:{docDone:1}},r:'Max拍了外景，以及Chad。'},
    {t:'要求审片权',e:{D:-500,cam:6,f:{docDone:1,docReview:1},q:[['doc_release',6]]},r:'律师费$500。Max签了一份他显然没读的协议。'}]});
E({id:'doc_release',tag:'媒体 · 弧线三',title:'韦科的影子',
  text:()=>`预告片上线了。配乐是低音鼓，你们的荟供与1993年的档案画面交叉剪辑。标题从《新的信仰》改成了《韦科的影子》。${S.f.docReview?'你的审片意见只被采纳了一条：把你的名字拼对了。':''}`,
  opts:[{t:'起诉',e:{D:-4000,T:2,H:6},r:'官司会打两年。律师说胜算“取决于你对胜利的定义”。'},
    {t:'发公开信',e:{T:3,H:6},r:'公开信写得很克制。转发量是预告片的百分之一。'},
    {t:'借势办开放日',e:{D:2500,T:-3,L:-2,gen:3,tourist:true},r:'猎奇游客排到了街角。有人问护法殿“能不能拍照打卡”。'}],
  pre(){ap({D:1500,T:-8,H:20,r:{kayleigh:-5}});}});
E({id:'chad_center',tag:'弧线一 · 正统之战',title:'Authentic Dharma Waco',ch:[2],w:9,cond:()=>!S.f.chadCenter&&S.turn>=ds2t('2022-05'),
  text:()=>`对街两百米，一家新中心开张了：Authentic Dharma Waco。创始人Chad Ravenscroft，法名Karma Senge，自称在尼泊尔闭关三年。他的藏语发音比Tenzin还标准。开幕式上他说：“韦科值得拥有正统的佛法。”`,
  opts:[{t:'带一条哈达去拜访',e:{r:{chad:5},M:1,f:{chadCenter:1},ac:40},r:'他收下哈达，纠正了你“哈达”的发音。'},
    {t:'在Instagram上回击',e:{H:6,au:3,r:{chad:-10},f:{chadCenter:1},ac:42},r:'评论区打成一片。全城只有37个佛教徒，其中12个在评论区。'},
    {t:'专注修行，不予理会',e:{L:2,f:{chadCenter:1},ac:45},r:'两个贝勒学生开始两边跑。'}]});
E({id:'brooke',tag:'人物 · 供养线诱惑',title:'品牌合作',ch:[2,3],w:6,cond:()=>!S.f.brookeDone&&S.turn>=26,
  text:()=>`瑜伽工作室老板Brooke Lindqvist约你喝咖啡。她想合作一个“正念周末”系列：她出场地和客户，你出“真实的佛教老师”。她的PPT第三页写着：Authenticity is our moat.`,
  opts:[{t:'合作',e:{add:'brooke',D:1500,L:-4,f:{brookeAlly:1,brookeDone:1}},r:'第一场周末就卖光了。解锁行动“有偿静修营”。'},
    {t:'欢迎她来修行，但不合作',e:{f:{brookeDone:1}},fx(){addMember('brooke',30);log('Brooke Lindqvist 加入了。');return '她来了，坐了二十分钟，拍了一张佛堂的照片发在Instagram上，配文“slow living”。';}},
    {t:'拒绝',e:{L:1,f:{brookeRival:1,brookeDone:1}},r:'三个月后，她和Chad合作了。'}]});
E({id:'priya',tag:'人物',title:'效率',ch:[2,3],w:6,cond:()=>!has('priya')&&!S.f.priyaDone&&S.turn>=26,
  text:()=>`Priya Raman从奥斯汀搬来远程办公。她第一次来就供养了$1,000，然后问：“完成四加行的最短路径是什么？我可以每天早上五点修两小时。”`,
  opts:[{t:'给她做一张加行追踪表',e:{add:'priya',D:1000,L:-1,c:{priya:10},f:{priyaDone:1}},r:'她把追踪表做成了一个Notion模板，分享给了三十个人。'},
    {t:'讲“慢”的意义',e:{D:1000,L:1,f:{priyaDone:1}},fx(){if(chance(.6)){addMember('priya',45);log('Priya Raman 加入了。');return '她皱着眉听完，说：“好吧，我把这个当成一个长期项目。”';}return '她礼貌地道谢，再也没来过。';}},
    {t:'请她管财务',e:{add:'priya',D:1000,f:{priyaCFO:1,priyaDone:1}},r:'第二周你收到一份有数据透视表的预算。'}]});
E({id:'beasley',tag:'人物 · 游客',title:'农舍感',ch:[2,3],w:5,cond:()=>!S.f.beasleyDone&&S.loc!=='home',
  text:()=>`Carla和Jim Beasley从俄亥俄来韦科逛Magnolia Silos，导航把他们带上了你的农场土路。Carla说：“这里好有氛围！就是可以再多一点农舍感。”`,
  opts:[{t:'欢迎，还给他们做了一次佛堂导览',e:{add:'beasley',D:200,L:-1,f:{beasleyDone:1}},r:'他们每个月都开车回来。“游客佛教”从此有了两张固定的脸。'},
    {t:'告诉他们这里不是景点',e:{T:-1,L:1,f:{beasleyDone:1}},r:'他们在Google上给了四星：“很真实，有点凶。”'}]});
E({id:'c3',tag:'行政',title:'IRS的信',
  text:()=>`501(c)(3)非营利组织申请批下来了。信封上的回邮地址是Ogden, Utah。`,
  opts:[{t:'在佛堂门口贴上免税编号',e:{f:{c3:1},T:2},r:'供养从此可以抵税。几位成员的供养金额悄悄变多了。'}]});
E({id:'zoning',tag:'行政 · Boss',title:'区划委员会听证',
  text:()=>`县规划委员会主席翻着你的申请：“农业用地变更为宗教集会用途，停车位不足。”隔壁的牧场主坐在第一排，手里拿着一叠打印出来的经幡照片。`,
  opts:[{t:'请律师',req:()=>S.D>=2500,rq:'需要 $2,500',e:{D:-2500,f:{zoned:1}},r:'律师说了十五分钟你听不懂的话。申请通过。'},
    {t:'自己出席陈述',e:{},fx(){if(chance(.55+S.T/250)){S.f.zoned=1;return '你讲了五分钟，最后一句是“我们周日上午十点就散了，比隔壁牧场的牛还安静”。通过。';}S.f.zoneAsked=0;S.stats.admin=4;return '主席说“材料不全”。下次再来。';}},
    {t:'请Marcus动员邻居出席',req:()=>S.f.marcusMet,rq:'需要认识Marcus Bell',e:{T:3,r:{marcus:2},f:{zoned:1}},r:'East Waco来了二十个人，大部分人不知道佛教是什么，但都知道Marcus。通过。'}]});
E({id:'kayleigh',tag:'媒体 · 讽刺',title:'我逃离了韦科佛教邪教',ch:[2,3,4],w:5,cond:()=>S.H>=30&&!S.f.kayDone,
  text:()=>`前成员Kayleigh Dunn（待了六周）上传了《我逃离了韦科佛教邪教（第1集）》。38万次播放。主要指控：被要求洗碗。第二指控：“他们让我坐着不动。”`,
  opts:[{t:'公开回应',e:{H:8,f:{kayDone:1}},fx(){const s=ri(-3,3);ap({T:s});return '你的回应视频有4,100次播放。她的回应你的回应有52万。';}},
    {t:'私信邀请她回来喝茶',e:{f:{kayDone:1}},fx(){if(chance(.4)){ap({T:3});return '她来了，洗了碗，拍了第2集：《我回去了，他们还是让我洗碗》。评论区意外地温和。';}ap({H:6,T:-2});return '她把私信截图做成了第2集的封面。';}},
    {t:'不理',e:{T:-2,f:{kayDone:1}},r:'她的视频播放量比你所有法会出席人数总和高一百倍。'}]});
E({id:'faith_q',tag:'跨宗教',title:'你们拜的是不是魔鬼？',rep:1,cd:0,qonly:1,
  text:()=>pick([`跨信仰青年论坛上，一个浸信会高中生举手：“你们拜的那些有很多手的神，是不是魔鬼？”他是真心想知道。`,`贝勒神学院的辩论会上，一位博士生问：“如果没有造物主，你们的功德记在谁的账上？”`,`天主教会的守护圣母节上，一位老太太指着你的念珠：“你也念玫瑰经吗？”`]),
  opts:[{t:'认真讲解',e:{T:1,L:1},r:'有人在记笔记，有人在看手机。'},
    {t:'用对方熟悉的语言打比方',e:{T:3,L:-1},r:'你说：“就像天使，只是更……多手。”全场笑了。'},
    {t:'邀请他们来看一次共修',e:{H:2},fx(){if(chance(.5)){ap({T:3,gen:1});return '真有人来了。';}return '他们说会考虑。';}}]});
E({id:'council_seat',tag:'跨宗教',title:'韦科跨信仰理事会',
  text:()=>`Marcus打来电话：韦科跨信仰理事会有一个空缺席位。“我提了你的名字。没人反对——主要是因为没人知道你是谁。”`,
  opts:[{t:'接受',e:{T:8,f:{councilSeat:1},B:4},r:'你的名牌上写着“Buddhist Representative”。坐在你旁边的是一位拉比和一位穆斯林医生。'},
    {t:'婉拒，专注道场',e:{L:2},r:'Marcus说：“位置给你留着。”'}]});
E({id:'losar',tag:'历法',title:'洛萨',months:[2],rep:1,cd:11,w:30,cond:()=>!(Y()===2021),
  text:()=>`藏历新年。Nguyen家问能不能和农历春节一起办，祖母已经开始包饺子了。Tenzin说洛萨是洛萨。`,
  opts:[{t:'与农历春节合办',e:{T:3,D:Math.round(400),c:{hanh:5,tenzin:-3}},fx(){S.D+=Math.round(300*chMult());return '舞狮队和法螺同时开始。没人知道该听哪边。';}},
    {t:'传统藏历新年',e:{L:3,c:{tenzin:6}},r:'你们挂上了新的经幡，烧了桑烟。邻居打电话问是不是着火了。'}]});
E({id:'thanksgiving',tag:'历法',title:'感恩节社区晚餐',months:[11],rep:1,cd:11,w:30,
  text:()=>`感恩节。Marcus说East Waco的社区中心缺一个厨房帮手。你自己的成员也想办一场荟供。`,
  opts:[{t:'办社区晚餐',e:{T:4,D:-200,M:2,r:{marcus:3}},r:'你切了四十磅土豆。有个老人问你“佛教徒吃火鸡吗”，你说今天可以吃土豆泥。'},
    {t:'只做内部荟供',e:{L:2,c:{all:2}},r:'很温暖，也很小。'}]});
E({id:'parade',tag:'历法 · 喜剧',title:'韦科圣诞游行',months:[12],rep:1,cd:11,w:22,cond:()=>ch()>=2,
  text:()=>`韦科圣诞游行报名开始了。去年有一个消防队、两个教会、一个高中乐队和一辆装着巨型充气耶稣诞生场景的皮卡。`,
  opts:[{t:'报名“佛教花车”',e:{H:8},fx(){const s=ri(-3,5);ap({T:s});return s>=0?'你们的花车是一座会转的经轮。小孩子们追着跑。':'有人对着花车喊了一句“Merry Christmas!”，语气像是在纠正你。';}},
    {t:'不参加',e:{},r:'你们在佛堂里修了一晚上祈愿法会。'},
    {t:'以志愿者身份在路边发热可可',e:{T:3,M:1,D:-80},r:'没人知道你是谁。这正是重点。'}]});
E({id:'shadow',tag:'韦科阴影',title:'韦科阴影',rep:1,cd:5,w:0,qonly:1,
  text:()=>`${pick(SHADOW_HEAD)}。你的名字出现在了第三段。`,
  opts:[{t:'公开透明：邀请记者参观所有空间，包括护法殿',e:{H:6},fx(){const s=ri(-6,6);ap({T:s});return s>=0?'报道后来被评为“本月最无聊的新闻”，你觉得这是表扬。':'护法像的照片被单独截了出来。';}},
    {t:'沉默',e:{T:-2,H:-4},r:'过了两周，大家去关注别的事了。'},
    {t:'幽默化解',e:{H:4},fx(){const s=ri(-2,5);ap({T:s});return s>=0?'你发了一张照片：佛堂门口的鞋架，配文“我们唯一的武器是拖鞋”。':'有人觉得这不好笑。1993年死了很多人。';}},
    {t:'请Marcus或Dr. Hartley背书',req:()=>has('hartley')||S.npc.marcus>=8,rq:'需要Dr. Hartley在，或与Marcus关系较好',e:{T:4,H:2},r:'一段视频：一位浸信会执事和一位宗教学教授坐在你的佛堂里，说“他们是好邻居”。'}]});
E({id:'life',tag:'成员人生',title:'成员人生',rep:1,cd:2,w:9,
  prep(){const a=here(); if(a.length<2) return false; const m=pick(a); const v=pick(LIFE); S.ctx={m:m.id,v:v.k}; return true;},
  text:()=>{const m=ctxMem(); const v=LIFE.find(x=>x.k===C().v); return m&&v?v.t(m.n):'一位成员遇到了困难。';},
  opts:()=>{const m=ctxMem(); const id=m?m.id:''; return [
    {t:'陪伴，并提供实际的帮助',e:{B:5,M:2,D:C().v==='job'?-300:0,c:{[id]:14}},fx(){S.stats.bypass=0;if(C().v==='move'&&chance(.5)){leave(ctxMem(),'搬去了奥斯汀');return '你帮他把最后一箱书搬上车。他说会回来的。';}return '你们在佛堂里坐了很久。没说什么大道理。';}},
    {t:'建议他多打坐',e:{c:{[id]:-5}},fx(){S.stats.bypass++;if(S.stats.bypass>=10)grant('bypass');if(C().v==='move'&&chance(.6)){leave(ctxMem(),'搬去了奥斯汀');}return '他点点头。你们都知道这不算回答。';}},
    {t:'请其他成员轮流照顾',e:{c:{[id]:8,all:1}},fx(){S.stats.bypass=0;if(C().v==='move'&&chance(.5)){leave(ctxMem(),'搬去了奥斯汀');}return 'Rosa排了一张值班表。这个小团体第一次像个僧团。';}}];}});
E({id:'tornado',tag:'德州环境',title:'龙卷风警报',ch:[2,3,4],months:[4,5],rep:1,cd:10,w:8,
  text:()=>`仪轨念到一半，所有人的手机同时尖叫起来：龙卷风警报。天空变成了黄绿色。`,
  opts:[{t:'中断，全体躲进掩体或最里面的房间',e:{L:-1,T:1},r:'你们在储藏室里挤着念完了剩下的部分。警报解除时，有人说这是最专注的一次。'},
    {t:'继续念诵',e:{L:2},fx(){if(on('shelter'))return '大家知道掩体就在旁边，念诵一句没乱。风过去了。';if(chance(.3)){ap({D:-1500});return '冰雹砸坏了屋顶。修缮费$1,500。';}return '风过去了。念诵没断。';}},
    {t:'打开大门，让路过的人进来避难',e:{T:4,M:2},r:'一个外卖员、一对老夫妇和一只狗。狗留了下来。'}]});
E({id:'crystal',tag:'教法与纯度 · 喜剧',title:'能量水晶',ch:[2,3],w:4,
  text:()=>`一位新成员带来一盒水晶和一副塔罗牌，想在共修前“为佛堂净化能量”。她说她“对所有传统都很开放”。`,
  opts:[{t:'温和地拒绝',e:{L:1},r:'她把水晶带回去了，塔罗牌留在了图书角。'},
    {t:'允许放在角落',e:{L:-2,gen:1,tourist:true},r:'第二周，又来了一个带灵摆的人。'}]});
E({id:'cowboy',tag:'文化碰撞 · 喜剧',title:'牛仔帽上的六字真言',ch:[2,3,4],w:4,
  text:()=>`一位成员定做了一顶牛仔帽，帽檐上绣着六字真言。他戴着它去了一家酒吧，一个陌生人问他这是不是“某种乐队”。`,
  opts:[{t:'告诉他六字真言不宜放在头以下的位置……帽檐算吗？',e:{L:1},r:'你们讨论了半小时“帽檐的宗教地位”。没有结论。'},
    {t:'夸他有创意',e:{T:2,L:-1,H:2},r:'他又定做了五顶。'}]});
E({id:'livefail',tag:'Zoom · 喜剧',title:'直播事故',w:4,rep:1,cd:10,cond:()=>S.fac.zoom&&!S.f.mic,
  text:()=>`直播开示进行到第十分钟，屏幕上出现了一只猫的屁股。猫在键盘上躺了下来，直播标题变成了“kkkkkkkkkkkkkkk”。`,
  opts:[{t:'继续讲',e:{H:3},r:'这段直播的播放量是平时的二十倍。'},{t:'关掉直播',e:{},r:'猫没有被追究责任。'}]});
E({id:'dallas',tag:'噶举内部政治',title:'达拉斯的电话',ch:[2,3],w:4,cond:()=>!S.f.dallasDone,
  text:()=>`达拉斯一家噶举中心的负责人打来电话：明年仁波切巡回，能不能共享行程，分摊机票？顺便，他们听说你们“在搞跨宗教”，想问问是不是太“稀释”了。`,
  opts:[{t:'合作',e:{f:{dallas:1,dallasDone:1}},r:'仁波切来访的分摊选项从此更稳了。'},
    {t:'各办各的',e:{L:1,f:{dallasDone:1}},r:'你们挂掉电话，各自继续在德州小城里努力。'}]});

E({id:'lake_buy',tag:'章节',title:'佛堂加建',at:'2025-01',
  text:()=>`佛堂又坐不下了。银行愿意再贷$15,000，每月还$1,100，用来扩建佛堂或者再盖一栋。I-35扩建让建材一年比一年贵。`,
  opts:[{t:'贷款$15,000扩建',e:{D:15000,f:{expLoan:1}},fx(){S.loc='lake';log('拿到了扩建贷款。');return 'Jake从路口走过来，指着风车说：“它每年四月要上一次油。”现在去把佛堂画大一点吧。';}},
    {t:'接受大额捐赠人出资，附带命名权',req:()=>has('priya')||S.f.meritcoin,rq:'需要Priya在，或已有MeritCoin',e:{D:15000,L:-5,f:{naming:1,refusedAll:false}},fx(){S.loc='lake';log('捐赠人出资扩建佛堂。');return '门口的牌子写着：The Raman Family Dharma Grove。';}},
    {t:'与达拉斯中心合资',e:{D:7500,L:-2,f:{shared:1}},fx(){S.loc='lake';log('与达拉斯中心合资扩建。');return '扩建出来的部分有一半属于达拉斯中心，决定权也是。';}},
    {t:'不加建',e:{L:1},fx(){if(Y()<=2026) queue('lake_again',6);return '你说：“道场不在地上。”Tenzin说：“那在哪？”';}}]});
E({id:'lake_again',tag:'章节',title:'加建的报价',
  text:()=>`扩建贷款的额度还在：$12,000，每月还$1,100。`,
  opts:[{t:'贷款扩建',e:{D:12000,f:{expLoan:1}},fx(){S.loc='lake';log('拿到了扩建贷款。');return '这次你没有犹豫。';}},
    {t:'还是不买',e:{},fx(){if(Y()<=2026) queue('lake_again',8);return '也好。';}}]});
E({id:'stupa_design',tag:'第三章 · 讽刺',title:'现代农舍风',qonly:1,
  text:()=>`建筑师带来三版佛塔方案。游客委员会（Beasley夫妇代表）要求“更韦科一点”：白色竖板墙面、黑框窗，再加一个写着“gather”的手写体标语。`,
  opts:[{t:'传统藏式佛塔',e:{L:4,H:3,f:{stupaStyle:'trad'}},r:'游客评论：“有点吓人。”Tenzin把照片发给了达兰萨拉的父亲，父亲回了一个大拇指。'},
    {t:'农舍风佛塔',e:{D:1500,T:3,L:-3,f:{stupaStyle:'farm'}},r:'Tenzin拍照发给达兰萨拉的父亲，父亲回了一个省略号。'},
    {t:'传统佛塔，旁边建一个农舍风礼品店',e:{D:800,T:2,L:-1,f:{stupaStyle:'trad',merchOK:1}},r:'解锁“周边商品”。第一件T恤总是最难的。'}]});
E({id:'visa',tag:'上师与传承',title:'仁波切的签证',at:'2026-09',
  text:()=>`仁波切的宗教工作者签证卡在领事馆。灌顶日期已定，一百二十人报名，其中四十人是Chad的成员。移民律师报价一万美元。`,
  opts:[{t:'付钱',req:()=>S.D>=10000,rq:'需要 $10,000',e:{D:-10000,L:10,RT:8},fx(){S.lastVisit=S.turn;S.stats.visits++;return '签证在灌顶前三天批下来了。仁波切下飞机时说的第一句话是：“德州好热。”';}},
    {t:'改为Zoom灌顶',e:{L:-6},fx(){S.D-=0;return '一半报名者退款。Tenzin说：“至少不是录播。”';}},
    {t:'请Pastor Dawson的国会议员朋友帮忙',req:()=>S.npc.dawson>=3,rq:'需要与Pastor Dawson有交情',e:{L:8,RT:4,T:2,f:{owesDawson:1}},fx(){S.lastVisit=S.turn;S.stats.visits++;return '成功了。代价是你在议员的竞选广告里出现了两秒。';}}]});
E({id:'thesis',tag:'学术 · 讽刺',title:'论文答辩',ch:[3],w:6,cond:()=>has('hartley'),
  text:()=>`Hartley的研究生Jordan的论文《后世俗德州的去殖民佛教空间：一项民族志》通过答辩。致谢里感谢了“韦科的受访者们”。你发现自己在第四章被称为“信息提供者A”。`,
  opts:[{t:'要求署名',e:{c:{hartley:-8},f:{ethicsChain:1}},r:'Hartley说她会和Jordan谈谈。Jordan把你拉黑了。'},
    {t:'把论文放进图书室',e:{L:-1,T:1},r:'成员读完后，要求“去殖民”你的佛龛布置。'},
    {t:'邀请Jordan回来做一周义工洗碗',e:{},r:'Jordan消失了两年。后来以“顾问”身份回来，索要费用。'}]});
E({id:'hank_arrive',tag:'人物',title:'烤了四十年肉',ch:[3],w:9,cond:()=>!has('hank')&&!S.f.hankNo&&(S.f.marcusMet||S.f.hankSeed),
  text:()=>`Marcus的表弟Hank “Smoke” Dalton，退休烧烤大师，开着一辆后斗绑着烟熏炉的皮卡来到湖边。“我烤了四十年肉，”他说，“上次你们说的那个不杀生，我想了一年。”`,
  opts:[{t:'欢迎他',e:{add:'hank'},r:'他说：“三摩地就是低温慢烤十四小时。”你决定不纠正他。'},
    {t:'建议他先从减压课程开始',e:{f:{hankNo:1}},r:'他说：“我不需要减压，我需要搞清楚这四十年。”然后去了Chad那里。'}]});
E({id:'vegbbq',tag:'喜剧',title:'素食烤肉',ch:[3,4],w:7,cond:()=>has('hank')&&!S.f.vegDone,
  text:()=>`Hank皈依后想发明“佛教烤肉”：菠萝蜜加烟熏豆腐。他想报名全市烤肉大赛。德州烤肉界的反应堪比宗教裁判所。`,
  opts:[{t:'支持他参赛',e:{H:8,f:{vegDone:1}},fx(){if(chance(.45)){ap({T:6});grant('vegjudge');return 'Hank获得“评委特别奖”。KWTX标题：《韦科佛教徒用菠萝蜜征服烤肉评委》。';}ap({T:-4});return '一位评委吐了出来，然后又吃了一口。KWTX照样报道了。';}},
    {t:'劝他低调',e:{c:{hank:-8},f:{vegDone:1}},r:'他偷偷参赛，获得“最具争议奖”。'},
    {t:'把比赛变成一场荟供',e:{L:2,D:600,f:{vegDone:1}},r:'裁判吃完后问：“这算不算皈依？”'}]});
E({id:'ercot',tag:'德州环境 · 讽刺',title:'ERCOT预警',ch:[3,4],months:[7,8],w:14,cond:()=>S.fac.cabin>0&&!S.f.ercotDone,
  text:()=>`电网发布节电预警。闭关小屋里有一名第40天的闭关者，空调是他不中暑的唯一保障。${S.f.meritcoin?'你的太阳能板是Trevor用功德币买的。':''}`,
  opts:[{t:'关掉佛堂空调保小屋',e:{c:{all:-4},f:{ercotDone:1}},r:'周日出席率掉了四成。Nextdoor：“佛教徒都不用空调，真虔诚。”'},
    {t:'开柴油发电机',e:{D:-600,f:{ercotDone:1}},r:'Priya指出了碳排放问题，Hank问能不能顺便烤点东西。'},
    {t:'中止闭关',e:{L:-6,f:{ercotDone:1}},r:'闭关者崩溃了。他后来成了Kayleigh频道的嘉宾。'}]});
E({id:'meritcoin',tag:'弧线四 · 功德币',title:'MeritCoin',ch:[3],w:7,cond:()=>!S.f.coinDone&&ch()>=3,
  text:()=>`从旧金山搬来的前科技高管Trevor Nakamura-Blythe提出“MeritCoin”：每做一个大礼拜铸造一枚代币，链上永久记录。他愿意捐出“等值一百万美元”的币。Priya觉得这很高效，Tenzin觉得这是亵渎，Hank问能不能用来买烤肉。`,
  opts:[{t:'接受',e:{D:20000,L:-6,H:15,f:{meritcoin:1,coinDone:1,refusedAll:false},q:[['coin_crash',9]]},r:'你兑换了一部分，账上第一次有了五位数。'},
    {t:'拒绝',e:{L:2,M:2,f:{coinDone:1}},r:'Trevor说你“错过了Web3的佛法”。'},
    {t:'收下，但只当纪念品，不兑换',e:{L:-1,H:5,f:{coinDone:1,coinKept:1},q:[['coin_crash',9]]},r:'钱包密钥写在一张卡片上，压在佛龛下面。'}]});
E({id:'coin_crash',tag:'弧线四 · 功德币',title:'功德通缩',
  text:()=>`MeritCoin崩盘了。Trevor的钱包被盗（也可能是他跑了）。KWTX标题：《韦科佛寺加密货币崩盘》。${S.fac.stupa>0&&S.fac.stupa<3?'佛塔建了一半。':''}`,
  pre(){if(S.f.meritcoin){ap({D:-Math.min(Math.max(S.D,0),6000),T:-6,H:18});}else ap({H:6});},
  opts:[{t:'公开全部账目',e:{T:3},r:'账目很清楚：你们没赚，也没亏多少。没人看。'},
    {t:'起诉Trevor',e:{D:-1500},r:'律师找不到Trevor。'},
    {t:'有成员坚持用它记大礼拜的数',e:{L:1,ach:'deflation'},r:'Hank说：“币没了，礼拜还在。”他已经数到第八万一千个。'}]});
E({id:'deathrow',tag:'弧线五 · 静默',title:'亨茨维尔',at:'2026-03',
  text:()=>`亨茨维尔监狱的一封信。一名死刑犯申请佛教牧师在行刑时陪伴（2022年最高法院的判例保障了这项权利）。他在牢里读了八年佛经，不认识任何别的佛教徒。`,
  opts:[{t:'前往',e:{M:8,H:10,L:3,B:8,f:{huntsville:1}},fx(){ap({T:-3});return '你开了三个小时车。他问你：“我还能修什么？”你教他皈依。回程时Kayleigh已经剪好了《佛教徒为杀人犯祈祷》。';}},
    {t:'推荐一位有经验的佛教监狱牧师',e:{M:1,L:-1},r:'你给了地址和电话。这是一个负责任的选择。你在佛龛前坐了很久。'},
    {t:'不去',e:{L:-4},r:'你回了一封很短的信。菩萨戒里有一条，你背得出来。'}]});
E({id:'tenzin_white',tag:'人物 · 纯度线良心',title:'白人佛教',ch:[3],w:6,cond:()=>has('tenzin'),
  text:()=>`茶歇时Tenzin问你：“你有没有注意到，这里除了我和Nguyen家，几乎都是白人？他们穿着印度买的披肩，念着他们不懂的藏文。我父亲问我，这是在传法，还是在收藏我们？”`+(S.origin==='convert'?'他说这话时没有看你，但你知道他在说谁。':''),
  opts:[{t:'请Tenzin主导一场完全藏式的法会',e:{L:3,c:{tenzin:15,all:-2}},r:'有一半人全程跟不上。Tenzin第一次在佛堂里笑出声。'},
    {t:'为法脉无国界辩护',e:{c:{tenzin:-10}},fx(){if(S.origin==='convert')ap({c:{tenzin:-6}});return '你讲得很好。他听完说：“你们总是讲得很好。”';}},
    {t:'请他父亲从达兰萨拉来访',req:()=>S.D>=1200,rq:'需要 $1,200',e:{D:-1200,L:4,c:{tenzin:20},f:{tenzinFather:1}},r:'老人在湖边坐了一下午，最后说：“风是一样的。”'}]});
E({id:'retreat_crisis',tag:'修行 · 闭关',title:'小屋里的第三十天',qonly:1,
  text:()=>`闭关者在第三十天敲响了小屋的门铃。他说他看见了光，也看见了他死去的哥哥。他不知道这是成就还是崩溃。你也不知道。`,
  opts:[{t:'立即中止闭关，陪他去医院',e:{L:-2,M:2},r:'医生说是严重的睡眠剥夺。三个月后，他回来做了义工。'},
    {t:'由合格的闭关指导判断处理',req:()=>S.f.guide||S.f.localGuide,rq:'需要合格的闭关指导',e:{L:2},r:'指导和他谈了两个小时，调整了修法和作息。他留了下来。'},
    {t:'让他继续',e:{},fx(){if(chance(.5)){ap({L:4});return '一周后他平静地出关，说了一句你会记很久的话。';}ap({T:-8,H:15});return '他的家人报了警。新闻标题里又出现了“韦科”。';}}]});
E({id:'rfra',tag:'弧线二 · 镜像教会',title:'宗教自由法案',ch:[3],w:5,cond:()=>!S.f.rfraDone,
  text:()=>`保守派议员推动“德州宗教自由强化法案”。Pastor Dawson需要一个“少数宗教也受保护”的例子，请你去州议会作证。法案确实能保护你的佛塔不被区划拆除。`,
  opts:[{t:'出席作证',e:{T:3,L:-1,r:{dawson:8},f:{rfra:1,rfraDone:1}},r:'你成了他的政治道具。法案通过了，你的佛塔安全了。'},
    {t:'拒绝成为道具',e:{L:2,r:{dawson:-5},f:{rfraDone:1}},r:'法案还是通过了，只是没有你。'},
    {t:'发表支持声明，但不出席',e:{T:1,f:{rfra:1,rfraDone:1}},r:'声明被引用时删掉了“但”之后的半句。'}]});
E({id:'donor',tag:'供养',title:'命名权',ch:[3],w:5,cond:()=>has('priya')&&!S.f.donorDone,
  text:()=>`Priya愿意捐$10,000用于佛堂翻修，条件是佛堂改名为“Priya Raman Meditation Hall”。她说这是“为了激励其他捐赠人”。`,
  opts:[{t:'接受',e:{D:10000,L:-3,f:{refusedAll:false,donorDone:1}},r:'铜牌做得很漂亮。Tenzin每次经过都会绕开。'},
    {t:'拒绝',e:{L:1,M:2,c:{priya:-6},f:{donorDone:1}},r:'她说她理解，然后少供养了一半。'}]});
E({id:'protector_open',tag:'护法殿',title:'是否对公众开放',qonly:1,
  text:()=>`护法殿落成。玛哈嘎拉是黑色的、愤怒的、戴着骷髅冠的。传统上护法殿不对外开放。Beasley夫妇已经在门口拍照了。`,
  opts:[{t:'不对外开放',e:{L:3},r:'门上挂了一把锁。Nextdoor：“他们在里面藏了什么？”'},
    {t:'开放，配详细的解说牌',e:{T:2,H:6,L:-1},r:'解说牌写了四百字。大部分游客只看了“愤怒”两个字。'}]});
E({id:'guide_ready',tag:'修行 · 传承',title:'本地导师',qonly:1,
  text:()=>`六个月的仪轨与闭关指导训练结束了。仁波切说可以指定一位本地的闭关指导。`,
  opts:()=>{const c=act().filter(x=>x.c>=55).sort((a,b)=>b.c-a.c).slice(0,3);
    const o=c.map(x=>({t:`指定 ${x.n}`,e:{L:3,c:{[x.id]:10}},fx(){S.f.localGuide=x.n;S.f.localGuideId=x.id;if(x.id==='dale')return 'Dale成了闭关小屋的管理员。他说：“这是我这辈子守过的最安静的岗位。”';return `${x.n}接过了钥匙。`;}}));
    o.push({t:'暂不指定',e:{},fx(){S.f.guideAsked=0;S.stats.guide=3;return '你觉得还不到时候。';}});return o;}});
E({id:'linda_flag',tag:'邻里 · 讽刺',title:'为孙子祈福',ch:[3,4],w:6,cond:()=>S.f.hoaMet&&!S.f.lindaDone,
  text:()=>`Linda Kowalczyk——第4.2条的Linda——来到湖边。她的孙子在申请贝勒大学。“我听说你们……可以做点什么？”她拿出一张打印的申请表，“当然，我不是说我信这个。”`,
  opts:[{t:'为孙子祈福，并请她亲手挂一串经幡',e:{T:3,L:-1,r:{linda:10},f:{lindaDone:1},ach:'art42'},r:'她踮着脚挂上了经幡，说：“这个应该不违反第4.2条吧？”'},
    {t:'婉拒：佛法不保佑考试',e:{L:1,f:{lindaDone:1}},r:'她说：“那你们和我们教会有什么区别？”然后笑了。'}]});
E({id:'vets_va',tag:'人物 · Dale',title:'VA的来信',ch:[3,4],w:6,cond:()=>has('dale')&&mem('dale').c>=60&&!S.f.vaDone,
  text:()=>`VA的心理健康部门来信，想把你们列为“社区冥想资源”，前提是去掉宗教内容。Dale把信放在你桌上：“我知道你会怎么想。我只是想让更多像我这样的人知道这里。”`,
  opts:[{t:'单独开一个世俗班',e:{T:4,L:-1,f:{vaDone:1,va:1},c:{dale:10}},r:'第一期来了九个退伍军人。有两个人后来留下来念藏文。'},
    {t:'婉拒',e:{L:1,c:{dale:-6},f:{vaDone:1}},r:'Dale说：“没事。”他说没事的时候通常有事。'}]});

function world(x){S.world=S.world||[];S.world.unshift({t:S.turn,x});S.f.altHistory=1;log('【世界】'+x);}
function chineseMember(){return act().find(x=>['Mei Chen','Bao Tran','Ivy Tran'].includes(x.n)&&x.n==='Mei Chen')||null;}
E({id:'xj_nuke',tag:'世界 · 虚构历史',title:'喀什以南',at:'2027-02',
  pre(){world('中国在新疆南部动用核武器。和田与喀什之间的绿洲地带在卫星图像上消失。');},
  text:()=>`凌晨，所有新闻频道切到同一个画面：中国在新疆南部动用了核武器。官方声明只有一句话。卫星图像上，和田与喀什之间的一片绿洲不见了。\n在韦科，Tenzin整夜没睡，一直在刷达兰萨拉的群聊。上午十点，Islamic Center of Waco的伊玛目给你打来电话。他问你，今晚能不能一起做点什么。`,
  opts:[{t:'与清真寺一起办跨信仰守夜',e:{T:5,M:5,H:6,r:{marcus:3},f:{vigil:1}},r:'伊玛目念了一段经文，你念了一段回向。来的人里有一位贝勒的维吾尔族研究生，她手里拿着一张家人的照片，一直没有放下。'},
    {t:'在佛堂内为亡者修法回向',e:{L:3,M:3,c:{all:3}},r:'那一晚没有人提前离开。念到回向文时，有人哭了。'},
    {t:'不对外表态',e:{H:-2,c:{tenzin:-8}},r:'你说佛堂不谈政治。Tenzin说：“这不是政治。”'}]});
E({id:'dam',tag:'世界 · 虚构历史',title:'宜昌以下',at:'2027-04',
  pre(){world('三峡大坝溃坝。洪水沿长江而下，宜昌、荆州、岳阳、武汉相继被淹。');},
  text:()=>{const asian=S.origin==='asian';const m=chineseMember();
    return `三峡大坝溃坝了。洪水沿长江而下，宜昌、荆州、洞庭湖区、武汉，一座城接一座城。死亡人数每小时更新一次，没有人相信那个数字。\n${asian?'你母亲在湖北的老家，你已经连续三天打不通电话。':m?`${m.n}的姑姑住在荆州。她这周日来了，坐在最后一排，手机一直亮着。`:'韦科的华人超市门口摆了一张募捐桌，排队的人一直排到停车场。'}${has('hanh')?'Nguyen家的祖母说，这么多人走了，要有人给他们念经。':''}`;},
  opts:[{t:'把本月随喜全部转给赈灾机构',e:{D:-1500,T:4,M:6},r:'你在佛堂门口贴了一张收据。没有人问钱去了哪里。'},
    {t:'与Nguyen家合办超度大法会',req:()=>has('hanh'),rq:'需要Nguyen一家在',e:{L:2,T:3,M:4,c:{hanh:8}},r:'藏文、越南文和普通话的念诵交替进行。来了很多从没来过的华人家庭。'},
    {t:'只在佛堂内回向',e:{L:1,M:2},r:'一百零八盏酥油灯点了一整夜。'},
    {t:'飞回中国找家人',req:()=>S.origin==='asian'&&S.D>=2500,rq:'仅亚裔住持 · 需要 $2,500',e:{D:-2500,B:15,S:-3,f:{wentChina:1}},r:'你在武汉的临时安置点找了九天。回到韦科时，你在佛堂里坐了很久才开口。'}]});
E({id:'hunan',tag:'世界 · 虚构历史',title:'迁往湖南',at:'2027-07',
  pre(){world('南疆幸存的维吾尔族人被整体迁往湖南省。');},
  text:()=>`官方宣布：南疆幸存的维吾尔族人将被整体迁往湖南。那是一个他们大多数人从没去过的省份，洪水刚退，湖南自己也还满地淤泥。\n少数人辗转到了美国。一家人被安置到了韦科：Ablikim、他的妻子Dilnur和两个孩子。安置机构的社工打来电话，问城里的宗教团体能不能帮忙。Marcus说他的教会可以出家具，清真寺可以出人。`,
  opts:[{t:'参与安置，腾出一间屋、陪他们办手续',e:{D:-800,T:5,M:6,B:6,f:{uyghurFamily:1},r:{marcus:3}},r:'Dilnur的女儿在佛堂门口画画，画的是一座她记得的清真寺。他们每周五去清真寺，周日偶尔来你这里喝茶。'},
    {t:'捐款给安置机构',e:{D:-500,T:2,M:2},r:'社工发来一张感谢卡，卡上有孩子写的英文：THANK YOU。'},
    {t:'不参与',e:{},r:'后来你在H-E-B见过Ablikim一次，他在熟食柜台打工，就在Tenzin隔壁。'}]});
E({id:'revival',tag:'世界 · 虚构历史',title:'复兴',at:'2027-10',
  pre(){world('中国汉族人中出现大规模皈依基督教的浪潮。');S.church.att=Math.round(S.church.att*1.25);S.church.give=Math.round(S.church.give*1.3);},
  text:()=>`灾难之后，汉族人开始成批地信耶稣：家庭教会挤满了人，城市里排着长队等候受洗。西方媒体称之为“东方大复兴”。\n丰盛生命教会立刻发起了“中国丰收”奉献计划，大屏幕上有一个计数器，每有一千人受洗就跳一下。Pastor Dawson邀请你去参加祷告早餐会，说他需要“一位理解东方的朋友”上台讲几句。同一周，一位刚在Brazos河里受洗的贝勒中国留学生来到你的佛堂。`,
  opts:[{t:'参加Dawson的祷告早餐会',e:{T:3,L:-1,r:{dawson:5}},r:'你上台说：“愿他们在信仰里找到平安。”掌声比你预想的大，照片第二天上了教会的通讯。'},
    {t:'和那位留学生长谈',e:{L:1,M:3},r:'她说她奶奶信观音，她现在信耶稣，问你这算不算背叛。你说：这个问题，你奶奶会比我答得好。'},
    {t:'开示：人为什么在灾难之后寻找神',e:{L:2,c:{all:2}},r:'那天出席的人比平时多。有几位是浸信会的。'}]});
E({id:'tibet_india',tag:'世界 · 虚构历史',title:'向北',at:'2027-12',
  pre(){world('大批印度人越过喜马拉雅前往西藏：朝圣者、商人与定居者。');S.f.indiaTibet=1;},
  text:()=>`边境局势变了。成千上万的印度人越过喜马拉雅前往西藏：去冈仁波齐的朝圣者、做生意的商人，还有拿到土地的定居者。拉萨八廓街上，印地语开始比汉语多。\n达兰萨拉的流亡社区吵成了两派：现在回去，还是再等等？${has('tenzin')?'Tenzin的父亲打来电话，说他想在死前回一次日喀则。Tenzin问你，能不能请几个月假。':'你的群聊里，有人转发了一张大昭寺门口挤满朝圣者的照片。'}${has('priya')?'Priya说她的父母也在考虑去冈仁波齐转山。':''}`,
  opts:()=>{const o=[];
    if(has('tenzin')){
      o.push({t:'支持Tenzin回去，给他路费',req:()=>S.D>=1500,rq:'需要 $1,500',e:{D:-1500,L:2,M:3,c:{tenzin:12}},fx(){const t=mem('tenzin');t.away=S.turn+6;queue('tenzin_return',6);return '他走的那天，把佛龛的钥匙交给了Rosa。';}});
      o.push({t:'请他留下，这里需要他',e:{},fx(){if(chance(.5)){ap({c:{tenzin:-12}});return '他留下了，但那几个周日他都没怎么说话。';}leave(mem('tenzin'),'回西藏去了');return '他还是走了。临走前说：“我会替你们在大昭寺磕个头。”';}});
    }
    o.push({t:'请仁波切开示',e:{RT:3,L:2},r:'仁波切只回了一句：“地方会变，法不会。”'});
    o.push({t:'组织一次冈仁波齐朝圣团',req:()=>S.D>=1000,rq:'需要 $1,000 定金',e:{D:1500,L:-1,H:4,f:{kailash:1}},r:'报名的有十四个人，其中五个是印度裔。Tenzin问你：我们是去朝圣，还是去旅游？'});
    return o;}});
E({id:'tenzin_return',tag:'人物 · 虚构历史',title:'从日喀则回来',qonly:1,cond:()=>has('tenzin'),
  text:()=>`Tenzin回来了，瘦了一圈。父亲在日喀则的老房子里住了三个星期，然后在那里去世了。他说扎什伦布寺门口全是印度朝圣者，诵经声里混着印地语的祈祷；有个印度老人跪在他父亲的灵前，念的是他听不懂的经。`,
  opts:[{t:'为他父亲做完整的四十九天法事',e:{L:3,D:-600,c:{tenzin:15}},r:'第四十九天，Tenzin第一次在佛堂里领诵。'},
    {t:'问他：你还会留在韦科吗',e:{},fx(){const t=mem('tenzin');if(t.c<60&&chance(.5)){leave(t,'回西藏定居了');return '他想了很久，说：“我父亲回去了。现在轮到我了。”';}ap({c:{tenzin:6}});return '他说：“这里也有我要守的东西。”';}}]});

/* ===== 第四章 ===== */
E({id:'rinpoche_health',tag:'上师与传承',title:'仁波切的身体',at:'2028-03',
  text:()=>`侍者Lobsang从印度打来电话。仁波切住院了，医生说他以后每年最多来一次，也可能不来了。“他让我转告你，”Lobsang说，“‘不要等我。’”${S.f.indiaTibet?'他还说，仁波切想在走之前回一次楚布寺。':''}`,
  opts:[{t:'带全体成员为仁波切修长寿法',e:{L:3,c:{all:4}},r:'那一周，佛堂里的灯一直亮着。'},
    {t:'飞去印度探望',req:()=>S.D>=2500,rq:'需要 $2,500',e:{D:-2500,RT:10,S:4},r:'仁波切在病床上握着你的手，只问了一句：“你自己修了吗？”'}]});
E({id:'chad_truth',tag:'弧线一 · 正统之战',title:'三个月',at:'2028-05',cond:()=>S.f.chadCenter,
  text:()=>`Lobsang在尼泊尔的朋友证实：Chad的“三年闭关”是三个月，其中六周在博卡拉的咖啡馆。他的中心现在有五十名成员。`,
  opts:[{t:'公开',e:{T:3,H:18,ac:-40},fx(){ap({gen:4});return 'Chad的成员一半来了你这儿，一半离开了佛教。Kayleigh做了三期视频。';}},
    {t:'私下谈',e:{},fx(){if(chance(.55)){ap({gen:5,L:-1,ac:-30});grant('three');S.f.merged=1;return 'Chad在你的佛堂里哭了。两座中心合并了。他现在负责周日的茶水。';}ap({H:10,T:-4});return 'Chad先发制人，指控你“诽谤”。他的律师信写得比他的藏语还标准。';}},
    {t:'什么都不做',e:{L:2,M:4},r:'三年后，Chad被任命为某国际佛教理事会成员。'}]});
E({id:'silent',tag:'静默回合',title:'行刑日',qonly:1,silent:1,text:()=>'',opts:[]});
E({id:'pham',tag:'人物',title:'Mrs. Pham',at:'2028-11',cond:()=>has('hanh'),
  text:()=>`Nguyen家的祖母Mrs. Pham在睡梦中过世了。Hạnh问你：能不能按“你们的”方式办？Minh说祖母一辈子念的是阿弥陀佛。`,
  opts:[{t:'完整的藏传葬礼仪轨',e:{L:4,D:-800,c:{hanh:6}},r:'四十九天。每七天一次法会。Minh每次都来了。'},
    {t:'以净土仪轨为主',e:{L:-1,T:2,c:{hanh:16}},r:'你念阿弥陀佛的发音已经比第一次好多了。Hạnh说祖母会笑的。'},
    {t:'两者合办',req:()=>S.D>=1200,rq:'需要 $1,200',e:{D:-1200,L:2,T:3,c:{hanh:12}},r:'藏文与越南文的念诵交替进行。没有人觉得奇怪。'}]});
E({id:'dawson_fall',tag:'弧线二 · 镜像教会',title:'一杯酥油茶',at:'2029-02',
  text:()=>`丰盛生命教会因财务丑闻崩塌：私人飞机、离岸账户、三年未审计的“奉献挑战”基金。Pastor Dawson出现在你的佛堂门口，没穿西装。他在后排坐了一个下午。`,
  opts:[{t:'请他留下来',e:{T:3,r:{dawson:10},H:6},r:'他问能不能帮忙做点什么。你给了他一把扫帚。'},
    {t:'礼貌地请他离开',e:{T:-1},r:'他点点头，说：“我理解。我也会这么做。”'},
    {t:'只给他一杯酥油茶',e:{M:4},r:'他喝了一口，皱眉，又喝了一口。“这比我们咖啡厅的拿铁好。”'}],
  pre(){S.church.give=2000;S.church.att=120;}});
E({id:'democracy',tag:'传承 · 制度',title:'民主治理',at:'2029-04',
  text:()=>`一位元老成员在年会上提议：道场由理事会投票治理，住持只负责教学。“我们不想再变成任何人的道场。”有人鼓掌，有人看向你。`,
  opts:[{t:'同意成立理事会',e:{L:-2,T:3,f:{democracy:1}},r:'第一次理事会开了四个小时，讨论的是停车场。'},
    {t:'维持上师—弟子制度',e:{L:2,c:{all:-3}},r:'提议被搁置了。有两个人在停车场里聊了很久。'},
    {t:'先制定一份伦理守则',e:{L:1,T:2},r:'守则有十二条。第七条是关于洗碗的。'}]});
E({id:'designate',tag:'上师与传承',title:'指定',at:'2029-06',
  pre(){
    if(S.RT>=70&&S.self>=60) S.f.designated='player';
    else if(has('tenzin')&&mem('tenzin').c>=65) S.f.designated='tenzin';
    else S.f.designated='lobsang';
    if(S.L>=62&&S.RT>=58) S.f.cert=1;
  },
  text:()=>{const d=S.f.designated;
    const who=d==='player'?'你':d==='tenzin'?'Tenzin Dorjee':'侍者Lobsang Tsering';

function sitGrid(t){ // 12x14 seated chibi
  const g=grid(12,14), skin=t.skin, sd=shade(skin,.82), hc=t.hc||HC.black, hd=shade(hc,.7), top=t.top, legs=shade(top,.6);

  // body
  R(g,2,8,9,11,top); torso(g,t,2,8,9,11);
  G(g,1,9,top);G(g,10,9,top);G(g,1,10,skin);G(g,10,10,skin);
  if(t.hair==='long'){R(g,2,4,2,9,hc);R(g,9,4,9,9,hc);}
  if(t.hair==='scarf'){R(g,2,2,9,9,hc);}
  // head
  R(g,3,3,8,7,skin); G(g,3,3,null);G(g,8,3,null);G(g,3,7,sd);G(g,8,7,sd);
  G(g,4,5,'#1a1410');G(g,7,5,'#1a1410');G(g,5,7,shade(skin,.7));G(g,6,7,shade(skin,.7));
  const H=t.hair;
  if(['short','long','bob','bun','pony','manbun'].includes(H)){R(g,3,2,8,3,hc);G(g,2,3,hc);G(g,9,3,hc);G(g,3,4,hc);G(g,8,4,hd);G(g,5,2,shade(hc,1.35));}
  if(H==='bob'){R(g,2,4,2,6,hc);R(g,9,4,9,6,hc);}
  if(H==='bun'){R(g,5,0,6,1,hc);}
  if(H==='manbun'){G(g,5,1,hc);G(g,6,1,hc);}

  if(H==='buzz'){R(g,3,2,8,2,hd);G(g,3,3,hd);G(g,8,3,hd);}
  if(H==='curly'){R(g,2,1,9,3,hc);G(g,2,1,null);G(g,9,1,null);G(g,2,4,hc);G(g,9,4,hc);}

  if(t.beard==='stubble'){G(g,4,7,shade(skin,.7));G(g,7,7,shade(skin,.7));}
  if(t.glass===1){G(g,3,5,'#222');G(g,5,5,'#222');G(g,6,5,'#222');G(g,8,5,'#222');}
  if(t.glass===2){R(g,3,5,8,5,'#111');}
  const hc2=t.hatc||'#444', hk=shade(hc2,.7);
  if(t.hat==='cap'){R(g,3,1,8,2,hc2);R(g,2,3,9,3,hk);if(t.hatm)G(g,5,1,t.hatm);}
  if(t.hat==='cowboy'){R(g,4,0,7,1,hc2);R(g,0,2,11,2,hc2);R(g,1,3,10,3,hk);G(g,0,2,null);G(g,11,2,null);}
  if(t.hat==='beanie'){R(g,3,1,8,3,hc2);R(g,3,3,8,3,hk);}
  if(t.hat==='kufi'||t.hat==='doppa'){R(g,4,1,7,2,hc2);if(t.hat==='doppa')G(g,5,1,'#fff');}

const SPR_CACHE=new Map();
function spriteCanvas(t,kind){
  const key=kind+JSON.stringify(t);
  if(SPR_CACHE.has(key)) return SPR_CACHE.get(key);
  const g=kind==='portrait'?portraitGrid(t):kind==='sit'?sitGrid(t):tinyGrid(t);
  const c=document.createElement('canvas');c.width=g[0].length;c.height=g.length;const x=c.getContext('2d');
  g.forEach((row,y)=>row.forEach((col,xx)=>{if(col){x.fillStyle=col;x.fillRect(xx,y,1,1);}}));
  SPR_CACHE.set(key,c); return c;
}
const URL_CACHE=new Map();
function spriteURL(t,kind='portrait'){const key=kind+JSON.stringify(t);if(!URL_CACHE.has(key))URL_CACHE.set(key,spriteCanvas(t,kind).toDataURL());return URL_CACHE.get(key);}

function ropeSVG(v,color){
  // 像素钢丝：两根柱子，绳子按 4px 台阶下垂，住持的小人站在当前数值处
  const W=150,H=18; const sag=Math.round(7-v/100*5);
  let s=`<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" shape-rendering="crispEdges" aria-hidden="true">`;
  s+=`<rect x="0" y="3" width="3" height="15" fill="#3d5688"/><rect x="${W-3}" y="3" width="3" height="15" fill="#3d5688"/><rect x="0" y="16" width="${W}" height="2" fill="#0a1222"/>`;
  const yAt=x=>{const t=x/W;return 5+Math.round(4*t*(1-t)*sag);};
  for(let x=3;x<W-3;x+=3) s+=`<rect x="${x}" y="${yAt(x)}" width="3" height="1" fill="${color}"/>`;
  const px=Math.round(3+v/100*(W-12)); const py=yAt(px+3);
  s+=`<image href="${spriteURL(playerTraits(),'tiny')}" x="${px}" y="${py-9}" width="7" height="9" style="image-rendering:pixelated"/>`;
  return s+'</svg>';
}

E({id:'land_P1',tag:'土地 · 东牧场',title:'越界的牛',qonly:1,

  text:()=>`在北坡平整地基时，挖掘机的铲斗碰到了一根比人还长的骨头。离这里不远就是Waco Mammoth国家纪念地。贝勒的古生物学家Dr. Lin第二天一早就到了，蹲在坑边，声音都在抖。`,
  opts:[{t:'停工，交给贝勒发掘',e:{T:5,H:8,M:2,f:{fossil:1}},r:'发掘持续了半年。论文的致谢里写着你们的名字，这次是真名。'},
    {t:'修一个小展示亭，对公众开放',e:{D:-800,T:3,H:5,f:{fossilShow:1}},fx(){placeOrTray('fossil');return '';},r:'展示亭的牌子上同时写着“更新世哥伦比亚猛犸象”和“诸行无常”。'},
    {t:'悄悄填回去，继续施工',e:{M:-3},fx(){queue('fossil_found',10);return '你告诉自己那只是一块石头。';}}]});
E({id:'fossil_found',tag:'媒体',title:'被埋回去的猛犸',qonly:1,
  text:()=>`一位成员在Facebook上发了当时挖掘机的照片，问：“这是什么？”Dr. Lin在评论区回复了一个感叹号。`,
  opts:[{t:'道歉，邀请贝勒重新发掘',e:{T:-2,H:10,f:{fossil:1}},r:'猛犸象又被挖了出来。这次它上了KWTX。'},
    {t:'删帖',e:{T:-5,H:6},r:'截图已经存在了。'}]});
E({id:'land_P4',tag:'土地 · 橡树林',title:'金颊黑背林莺',qonly:1,
  text:()=>`联邦鱼类及野生动物管理局的调查员在你新买的橡树林里听见了一种鸟叫：金颊黑背林莺，全世界只在德州中部繁殖的濒危鸟。“这片林子，”她说，“最好不要动。”`,
  opts:[{t:'承诺保护：这片林子只放闭关小屋和小物件',e:{T:4,L:2,M:3,f:{warblerProtect:1}},r:'你在林子入口挂了一块牌子：“林莺闭关中，请勿打扰。”'},
    {t:'申请许可，照常规划',e:{D:-600},r:'许可批下来了，附带一份二十页的施工季节限制。'},
    {t:'不理会',e:{},fx(){queue('warbler_fine',8);return '你把调查员的名片放进了抽屉。';}}]});
E({id:'warbler_fine',tag:'邻里与市政',title:'罚单',qonly:1,
  text:()=>`调查员带着一份罚单回来了：在繁殖季清理林下灌木，违反《濒危物种法》。`,
  opts:[{t:'交罚款，并承诺保护',e:{D:-3000,f:{warblerProtect:1}},r:'你多了一片不能盖房的林子，和一个经常来听鸟叫的联邦公务员。'},
    {t:'请律师抗辩',e:{D:-1500,T:-3},r:'律师说胜算“取决于鸟”。'}]});
E({id:'land_P5',tag:'土地 · 西北林地',title:'猎季',qonly:1,
  text:()=>`十一月，一个叫Wade的猎人带着猎鹿许可来敲门。前任地主每年都把西北林地租给他和兄弟们打鹿，“这是我爷爷那辈就有的规矩。”他说完看了一眼你的念珠。`,
  opts:[{t:'不再允许狩猎',e:{L:2,T:-2,f:{noHunt:1}},r:'Wade没说什么。第二年秋天，林子里的鹿多得像在开会。'},
    {t:'继续出租猎季',e:{L:-4,f:{huntLease:1}},r:'每年秋天多一笔租金。Tenzin问你，这和开烤肉店有什么区别。'},
    {t:'猎人可以来，但只能来坐坐',e:{L:1,T:1},fx(){if(chance(.4)){ap({gen:1});return 'Wade真的来了，坐在林子边上一个下午，一枪没开。后来他成了周日共修的常客。';}return 'Wade笑了：“坐着不就是打猎嘛，只是不开枪。”他再没来过。';}}]});
E({id:'land_P6',tag:'土地 · 洼地',title:'洪泛区',qonly:1,
  text:()=>`买下西南洼地之后，你才在县里的FEMA洪水地图上看到它被涂成了蓝色。小池塘在大雨天会变成一个大池塘。`,
  opts:[{t:'挖排水沟',e:{D:-1200,f:{drained:1}},r:'排水沟挖好了。池塘还在，只是不再往外跑。'},
    {t:'改成湿地，让它自己长',e:{L:1,T:1,f:{wetland:1}},r:'第二年春天来了一群白鹭。Hartley的研究生说这可以写进论文的“生态转向”一章。'},
    {t:'先不管',e:{},fx(){queue('pond_flood',ri(4,9));return '你看了看天，天很蓝。';}}]});
E({id:'pond_flood',tag:'德州环境',title:'池塘涨水',qonly:1,
  text:()=>`一夜暴雨，洼地的池塘漫过了田埂，水流进了停车场。周日早上，三辆车陷在泥里。`,
  opts:[{t:'全体成员一起推车，然后挖沟',e:{D:-1200,T:2,c:{all:2},f:{drained:1}},r:'推车比共修还团结。'},
    {t:'请Chuy开拖拉机来',req:()=>S.npc.chuy>=4,rq:'需要和Chuy有交情',e:{r:{chuy:2},T:2},r:'Chuy的拖拉机一辆一辆把车拖了出来，没收钱。'}]});
E({id:'land_P7',tag:'土地 · 湖岸',title:'陆军工程兵团',qonly:1,
  text:()=>`Lake Waco归美国陆军工程兵团管理。买下湖岸的第二周，工程兵团的Ms. Pruett开着一辆白色皮卡来了，带着一份湖岸使用许可的说明：码头要报批，水边不能随便施工。`,
  opts:[{t:'按规矩申请许可',e:{D:-400,f:{shorePermit:1}},r:'许可下来了。解锁“码头”。'},
    {t:'请她喝杯酥油茶',e:{},fx(){if(chance(.5)){S.f.shorePermit=1;return '她喝了一口，皱眉，又喝了一口。“流程照走，”她说，“但我会帮你催一下。”';}return '她礼貌地拒绝了：“我们不能收任何东西，包括茶。”';}}]});
E({id:'land_P8',tag:'土地 · 湖岸',title:'浅滩',qonly:1,
  text:()=>`湖岸南段有一片浅滩，傍晚的时候，夕阳正好落在对岸的树梢上。Tenzin说，这里适合做水供。Ms. Pruett的白色皮卡也在远处停了一下。`,
  opts:[{t:'申请码头许可',e:{D:-400,f:{shorePermit:1}},r:'解锁“码头”。'},
    {t:'就让它保持原样',e:{L:2},r:'你们在浅滩上放了一块平石头。傍晚会有人坐在上面。'}]});
E({id:'fangsheng',tag:'教法与纯度',title:'放生',ch:[2,3,4],w:7,cond:()=>S.layout&&S.layout.items.some(i=>i.t==='dock')&&!S.f.fangDone,
  text:()=>`萨嘎达瓦月，几位成员从鱼饵店买了两百条鱼，准备在码头放生。公园与野生动物局的巡查员恰好在湖边：“这些是外来鱼种，放进去会出事。”`,
  opts:[{t:'不放了，改为清理湖岸垃圾',e:{T:4,L:0,f:{fangDone:1}},r:'你们捡了十一袋垃圾，一个旧冰箱，和一块1993年的车牌。'},
    {t:'只放巡查员认可的本地鱼',e:{L:2,T:2,D:-200,f:{fangDone:1}},r:'巡查员帮你们挑鱼。放生的时候，他也合了一下掌。'},
    {t:'照旧放生',e:{L:1,f:{fangDone:1}},fx(){ap({D:-800,T:-4,H:8});return '罚单$800。KWTX标题：《韦科佛教徒向湖里“放生”外来物种》。';}}]});

/* --- 神父 Ortiz --- */
E({id:'ortiz',tag:'跨宗教 · 新人物',title:'神父',ch:[1,2],w:6,cond:()=>has('rosa')&&!S.f.ortizMet&&S.turn>=8,
  text:()=>`Rosa所在堂区的Father Ortiz来到农场。他说他不是来劝谁回去的，只是想看看“Rosa每周六去的地方”。他在佛龛前站了很久，看着绿度母：“她和瓜达卢佩圣母一样，都穿着绿色。”`,
  opts:[{t:'请他坐下，听一段度母赞',e:{T:3,r:{ortiz:5},f:{ortizMet:1}},r:'他听完说：“我们的圣母经也是这样一遍一遍地念。”'},
    {t:'和他认真辩论“圣母”与“度母”的区别',e:{L:1,r:{ortiz:2},f:{ortizMet:1}},r:'你们辩到天黑，谁也没说服谁，约好下次继续。'},
    {t:'礼貌地寒暄几句',e:{f:{ortizMet:1}},r:'他留下一张堂区的弥撒时间表。'}]});
E({id:'guadalupe',tag:'跨宗教 · Ortiz',title:'十二月十二日',months:[12],ch:[2,3],w:14,cond:()=>has('rosa')&&S.npc.ortiz>=3&&!S.f.guadDone,
  text:()=>`瓜达卢佩圣母节，堂区的游行会经过县道。Rosa提议：让一幅绿度母唐卡和圣母像一起走一段。Father Ortiz说他“个人不反对”，然后补了一句：“但主教可能会有意见。”`,
  opts:[{t:'抬着绿度母唐卡一起走',e:{T:5,L:-1,H:5,f:{guadDone:1},q:[['bishop',2]],c:{rosa:10}},r:'墨西哥街头乐队为两位绿衣女神演奏了同一首歌。Rosa哭了。'},
    {t:'只在路边献玫瑰',e:{T:3,f:{guadDone:1},c:{rosa:4}},r:'你们在县道边摆了一百朵玫瑰。游行队伍经过时，有人向你们点头。'},
    {t:'婉拒，不给神父添麻烦',e:{L:1,f:{guadDone:1}},r:'Rosa说她理解，但那天她没来共修。'}]});
E({id:'bishop',tag:'跨宗教 · Ortiz',title:'主教来信',qonly:1,
  text:()=>`Father Ortiz收到了主教办公室的信，要求他“澄清堂区与非基督宗教团体的关系”。他把信给你看，说：“我会回信的。我只是想让你知道。”`,
  opts:[{t:'主动淡出，不让他为难',e:{r:{ortiz:6},T:-1},r:'他握了握你的手：“谢谢你比我更懂我们的主教。”'},
    {t:'写一封公开信支持他',e:{H:6,r:{ortiz:2}},fx(){const s=ri(-3,4);ap({T:s});return s>=0?'信被转载到了天主教新闻网站上，评论区意外地温和。':'主教办公室没有回应。Ortiz被调去了另一个堂区三个月。';}},
    {t:'请他来喝茶，什么都不谈',e:{M:2,r:{ortiz:4}},r:'你们喝了一下午茶。谈的是棒球。'}]});
E({id:'ortiz_end',tag:'跨宗教 · Ortiz',title:'退休',ch:[4],w:8,cond:()=>S.npc.ortiz>=6&&!S.f.ortizEnd,
  text:()=>`Father Ortiz要退休了，回圣安东尼奥照顾他的姐姐。他最后一次来到农场，说：“我念了一辈子玫瑰经。今天，我想听你念一遍心经。”`,
  opts:[{t:'为他念心经',e:{M:4,L:1,f:{ortizEnd:1}},r:'念到“色即是空”时，他闭上了眼睛。'},
    {t:'他念玫瑰经，你念心经，一起',e:{T:4,M:3,f:{ortizEnd:1}},r:'两种念诵交织在一起，像两条河。Rosa站在门口，没有进来打扰。'}]});

/* --- 医院 Dr. Okonkwo --- */
E({id:'icu',tag:'人物 · 临终关怀',title:'ICU 的 iPad',at:'2020-12',
  text:()=>`韦科一家医院的灵性关怀主任Dr. Amara Okonkwo打来电话。ICU里有一位越南裔佛教徒新冠重症，家属进不去。“他的女儿问，有没有人能通过iPad给他念经？我找遍了城里，只找到你们。”`,
  opts:[{t:'立刻上线念诵',e:{M:5,L:1,T:2,r:{okonkwo:6}},r:'护士把iPad立在床头。你念了四十分钟。凌晨两点，Dr. Okonkwo发来一条短信：“他走了，很平静。谢谢你。”'},
    {t:'请Nguyen家一起用越南语念',req:()=>has('hanh'),rq:'需要Nguyen一家在',e:{M:6,T:3,r:{okonkwo:6},c:{hanh:10}},r:'Hạnh的祖母念的是阿弥陀佛。病人的女儿在家里跟着念，哭得说不出话。'},
    {t:'推荐休斯顿的越南寺院',e:{M:1,r:{okonkwo:2}},r:'寺院的法师当晚就上线了。Dr. Okonkwo把你的号码存进了手机。'}]});
E({id:'chaplain',tag:'人物 · 临终关怀',title:'志愿灵性关怀员',ch:[2,3],w:6,cond:()=>S.npc.okonkwo>=4&&!S.f.chaplain,
  text:()=>`Dr. Okonkwo想建立一个跨宗教的志愿灵性关怀员项目：每周去病房陪伴临终病人。“不用传教，”她说，“只需要坐在那里，不害怕。”`,
  opts:[{t:'带三位成员参加培训',e:{B:5,T:4,M:4,f:{chaplain:1}},fx(){here().slice(0,3).forEach(x=>x.c+=6);return '培训第一天，讲师说：“陪伴临终的人，最难的是不去修好他们。”三位成员都在笔记本上写下了这句话。';}},
    {t:'只你自己去',e:{B:8,S:3,M:3,f:{chaplain:1}},r:'每周四下午，你在医院的走廊里坐两个小时。'},
    {t:'婉拒',e:{},r:'她说没关系，名额给你留着。'}]});
E({id:'hospice',tag:'人物 · 临终关怀',title:'老兵的最后一夜',ch:[3,4],w:6,cond:()=>S.f.chaplain&&has('dale')&&!S.f.hospiceDone,
  text:()=>`Dr. Okonkwo打电话来：临终病房里有一位越战老兵，不信任何宗教，也不肯见牧师。护士说他一直在喊一个战友的名字。Dale听说后，站起来就去拿车钥匙。`,
  opts:[{t:'让Dale去，你陪他',e:{M:5,c:{dale:12},f:{hospiceDone:1}},r:'Dale在床边坐了一整夜，什么也没念，只是告诉老兵：“任务结束了，你可以回家了。”'},
    {t:'让Dale一个人去',e:{M:4,c:{dale:8},B:-3,f:{hospiceDone:1}},r:'第二天Dale回来，在佛堂后排坐了很久，然后开始做大礼拜。'}]});

/* --- 尼师 Sonam --- */
E({id:'sonam',tag:'上师与传承 · 新人物',title:'尼师',ch:[2,3],w:6,cond:()=>!S.f.sonamDone&&S.turn>=28,
  text:()=>`仁波切来信：他在尼泊尔的一位弟子，Ani Sonam Lhamo，完成了两次三年闭关，想来美国住三个月。“她不太会英语，”信里说，“但她会修法。”`,
  opts:[{t:'在农舍腾出一间房请她住下',e:{add:'sonam',L:4,RT:4,f:{sonamDone:1}},r:'她每天凌晨四点起床，五点钟农舍里就有了念诵声。三个月后她说：“这里安静，我不走了。”'},
    {t:'安排她住在达拉斯中心',e:{RT:-2,f:{sonamDone:1}},r:'达拉斯中心很高兴。仁波切回了一句：“好。”你听不出这个“好”是什么意思。'}]});
E({id:'sonam_lobsang',tag:'噶举内部政治',title:'谁来带闭关',ch:[2,3,4],w:6,cond:()=>has('sonam')&&!S.f.sonamQ,
  text:()=>`仁波切的侍者Lobsang来电，语气客气：“让一位尼师带领男众闭关，恐怕不太合适。”Sonam听完没有生气，只是笑了笑，继续剥豆子。`,
  opts:[{t:'支持Sonam带领闭关',e:{L:1,RT:-2,c:{sonam:10},f:{sonamQ:1,sonamLead:1}},r:'你说：“她闭关的时间比我们所有人加起来都长。”Lobsang沉默了很久。'},
    {t:'请仁波切裁决',e:{f:{sonamQ:1}},fx(){if(chance(.65)){S.f.sonamLead=1;ap({RT:2,c:{sonam:6}});return '仁波切的回复只有一句：“谁修得好，谁带。”';}ap({c:{sonam:-6}});return '仁波切说“再等等”。Sonam继续剥豆子。';}},
    {t:'按Lobsang说的办',e:{RT:2,c:{sonam:-15},f:{sonamQ:1}},r:'Sonam点点头。那天晚上，她一个人在湖边坐到很晚。'}]});
E({id:'sonam_retreat',tag:'修行 · 闭关',title:'女众闭关',ch:[3,4],w:8,cond:()=>has('sonam')&&S.f.sonamLead&&S.fac.cabin>0&&!S.f.sonamRetreat,
  text:()=>`Sonam提出带一期为期一个月的女众闭关。报名的有Rosa、Hạnh、两位贝勒研究生和一位从奥斯汀来的退休法官。`,
  opts:[{t:'全力支持',e:{L:5,M:3,f:{sonamRetreat:1}},fx(){if(!S.f.localGuide){S.f.localGuide='Ani Sonam Lhamo';S.f.localGuideId='sonam';}return '出关那天，退休法官说：“我判了三十年案子，第一次觉得自己被审判完了。”Sonam成了这里的闭关指导。';}},
    {t:'等男众闭关先办',e:{c:{sonam:-8},f:{sonamRetreat:1}},r:'Sonam说好。女众闭关推迟到了第二年。'}]});

/* --- Tex 与牛仔竞技 --- */
E({id:'tex',tag:'供养 · 新人物',title:'石油遗孀',ch:[3],w:6,cond:()=>!S.f.texDone,
  text:()=>`Bill “Tex” Haverford，七十八岁，靠二叠纪盆地的油井发家，妻子去年去世。她生前来过两次你们的周日共修。Tex开出一张$40,000的支票：“盖一座‘Haverford牧场佛寺’，大门口放一头铜铸长角牛。她喜欢长角牛。”`,
  opts:[{t:'接受，连铜牛一起',e:{D:40000,L:-6,H:8,f:{texDone:1,longhorn:1,refusedAll:false}},fx(){placeOrTray('longhorn');return '';},r:'铜牛立在了大门口，比佛塔还先完工。游客最喜欢和它合影。'},
    {t:'只接受不附条件的部分',e:{f:{texDone:1}},fx(){if(chance(.5)){ap({D:12000,M:2});S.f.refusedAll=false;return 'Tex哼了一声，划掉“牧场佛寺”几个字，改成$12,000。“她也不喜欢别人对她指手画脚。”';}ap({L:1});return 'Tex把支票收回了口袋：“我老婆说你们是倔的。她说对了。”';}},
    {t:'婉拒，请他每周日来坐坐',e:{L:2,M:3,f:{texDone:1,texSits:1}},r:'他真的来了。每周日坐在最后一排，戴着牛仔帽，一言不发。'}]});
E({id:'tex_rodeo',tag:'文化碰撞 · 喜剧',title:'牛仔竞技之夜',ch:[3,4],w:6,cond:()=>S.f.longhorn&&!S.f.rodeoDone,
  text:()=>`Tex想在农场办一场“牛仔竞技之夜”，纪念他妻子的生日：骑野马、套小牛，结尾放烟花。“你们不杀生，”他说，“这个也不杀，就是摔一摔。”`,
  opts:[{t:'同意，但不套小牛',e:{D:2500,T:4,L:-2,H:6,f:{rodeoDone:1}},r:'骑野马的年轻人被摔下来七次。Chuy说这是他见过最温柔的牛仔竞技。'},
    {t:'改成一场纪念晚餐和放河灯',e:{L:2,T:2,M:3,f:{rodeoDone:1}},r:'Tex在湖边放下第一盏河灯，用很轻的声音说了一句话。你没听清，也没问。'},
    {t:'拒绝',e:{f:{rodeoDone:1}},r:'Tex把竞技之夜办在了Chuy的牧场上，还是请你们去了。'}]});
E({id:'tex_end',tag:'人物 · Tex',title:'遗嘱',ch:[4],w:7,cond:()=>(S.f.texSits||S.f.longhorn||S.f.rodeoDone)&&!S.f.texEnd,
  text:()=>`Tex在睡梦中去世了。律师送来一个信封：遗嘱里留给你们一笔钱，附一张手写的便条，字很歪：“她说这里是全德州最安静的地方。替我们俩多坐一会儿。”`,
  opts:[{t:'为Tex和他妻子做四十九天法事',e:{D:15000,L:2,M:5,f:{texEnd:1}},r:'第四十九天，Chuy、Hank和几个老牛仔来了，站在后排，帽子拿在手里。'},
    {t:'把钱全部捐给Dr. Okonkwo的临终关怀项目',e:{T:5,M:8,f:{texEnd:1}},r:'项目改名叫“Haverford陪伴计划”。你觉得Tex会喜欢这个名字，因为里面没有“佛”字。'}]});

/* --- East Waco 的 Shirley --- */
E({id:'shirley',tag:'邻里 · 新人物',title:'你们一直在买地',qonly:1,
  text:()=>`Marcus的姑妈Shirley Washington，在East Waco住了七十年，由Marcus陪着来到农场。她看着新围栏，慢慢说：“我见过一个地方是怎么被买走的。先是一块地，然后是一条街。你们打算买到哪里为止？”`,
  opts:[{t:'承诺只买农场周边的空地，并资助East Waco的社区土地信托',e:{D:-500,T:5,r:{shirley:6,marcus:3},f:{landTrust:1}},r:'Shirley点点头：“我会记住你说的话。”她真的记住了，每年都来问一次。'},
    {t:'解释这是为了修行，不是投资',e:{T:1,r:{shirley:1}},r:'她说：“每个人都这么说。”'},
    {t:'请她留下来吃午饭',e:{T:2,r:{shirley:3}},r:'她吃了两个馍馍，说比她教会的饺子差一点。'}]});
E({id:'juneteenth',tag:'跨宗教 · 历法',title:'六月十九日',months:[6],ch:[2,3,4],rep:1,cd:11,w:12,cond:()=>S.npc.shirley>=1,
  text:()=>`六月十九日，Juneteenth，德州加尔维斯顿的消息在1865年的这一天终于传到了最后一批被奴役的人耳中。East Waco的社区公园有烧烤、游行和福音合唱。Shirley问你们来不来。`,
  opts:[{t:'全体去做志愿者',e:{T:4,M:2,r:{shirley:3,marcus:2}},r:'Hank负责烤架，用的是菠萝蜜。Shirley尝了一口：“下次还是放点肉吧，孩子。”'},
    {t:'带一面经幡去，挂在合唱台边',e:{T:2,H:3,r:{shirley:1}},r:'合唱团唱到“Lift Every Voice”时，风正好吹动了经幡。'},
    {t:'今年不去',e:{},r:'Shirley没说什么。第二天Marcus打来电话问你是不是病了。'}]});

/* --- 球员 Kyle --- */
E({id:'kyle',tag:'人物 · 新人物',title:'后卫',ch:[2,3],w:5,cond:()=>!S.f.kyleDone,
  text:()=>`贝勒橄榄球队的后卫Kyle Brennan，赛季中脑震荡，队医建议他试试冥想。他在Instagram上有二十万粉丝，进门前先问：“这里可以拍照吗？”`,
  opts:[{t:'欢迎，但请不要拍照',e:{add:'kyle',L:1,f:{kyleDone:1}},r:'他把手机交给了Dale保管。四十分钟后，他说这是他三个月来第一次不头疼。'},
    {t:'让他随便拍',e:{add:'kyle',H:12,L:-2,gen:3,tourist:true,f:{kyleDone:1}},r:'那条视频播放了一百万次。下周日来了三十个穿绿色球衣的人。'},
    {t:'介绍他去Dale的退伍军人班',req:()=>has('dale'),rq:'需要Dale在',e:{add:'kyle',c:{dale:5},f:{kyleDone:1}},r:'Dale和Kyle很快成了朋友。两个人都知道头被撞过是什么感觉。'}]});
E({id:'kyle_nil',tag:'供养 · 讽刺',title:'能量饮料',ch:[2,3,4],w:5,cond:()=>has('kyle')&&!S.f.nilDone,
  text:()=>`Kyle签了一份NIL代言合同，赞助商是一家能量饮料公司。他们想在你的佛堂里拍广告：Kyle在佛像前打坐，然后睁开眼睛，喝一口饮料，标语是“Find Your Zen. Then Crush It.”`,
  opts:[{t:'拒绝',e:{L:2,c:{kyle:-8},f:{nilDone:1}},r:'Kyle说他理解。广告最后在一家日式餐厅拍了。'},
    {t:'接受',e:{D:5000,L:-5,H:10,f:{nilDone:1}},r:'广告播出后，佛堂的Google评论多了两百条，大部分在问饮料哪里买。'},
    {t:'只能在牧场拍，不能进佛堂',e:{D:2500,L:-1,H:5,f:{nilDone:1}},r:'广告里出现了牛、风车和一片橡树林。没有佛像。赞助商说这样“更有德州感”。'}]});

/* --- 警员 Garza、拉比 Feld、Joy Kim 牧师 --- */
E({id:'garza',tag:'人物 · 社区',title:'社区联络警官',ch:[2,3,4],w:6,cond:()=>(S.seen.harass_armed!=null||S.seen.harass_unarmed!=null||S.seen.vandal!=null)&&!S.f.garzaDone,
  text:()=>`韦科警局的社区联络警官Luis Garza来到农场。他说上次的事他看了报告，觉得警局“做得不够”。他想请你去警校给新警员讲一节课：“遇到一个你不认识的宗教场所，该怎么做。”`,
  opts:[{t:'去讲课',e:{T:4,B:5,r:{garza:5},f:{garzaDone:1}},r:'第一个问题是：“进门要脱鞋吗？”你说要。全班四十个人都低头看了看自己的靴子。'},
    {t:'请Dale一起去讲',req:()=>has('dale'),rq:'需要Dale在',e:{T:5,c:{dale:8},r:{garza:5},f:{garzaDone:1}},r:'Dale讲的是退伍军人的创伤。教室里很安静。'},
    {t:'婉拒',e:{f:{garzaDone:1}},r:'Garza留下了他的私人电话。'}]});
E({id:'seder',tag:'跨宗教',title:'逾越节晚餐',months:[4],ch:[2,3,4],w:8,cond:()=>!S.f.sederDone,
  text:()=>`韦科一座犹太会堂的拉比Hannah Feld邀请你们参加逾越节晚餐。她在邀请函上写：“我们讲一个关于离开与流亡的故事。我想你们的藏族朋友会懂。”`,
  opts:[{t:'带Tenzin一起去',req:()=>has('tenzin'),rq:'需要Tenzin在',e:{T:3,c:{tenzin:8},f:{sederDone:1}},r:'读到“明年在耶路撒冷”时，Tenzin轻声说：“明年在拉萨。”拉比听见了，向他举了举杯。'},
    {t:'带一盘馍馍去',e:{T:3,H:1,f:{sederDone:1}},r:'馍馍是发面的。拉比笑着把它们放在了另一张桌子上：“逾越节不能吃发酵的东西，但明天可以。”'},
    {t:'婉拒',e:{f:{sederDone:1}},r:'拉比回信说：“明年也请你。”'}]});
E({id:'vandal',tag:'邻里 · 仇恨',title:'谷仓上的字',ch:[2,3],w:5,cond:()=>!S.f.vandalDone,
  text:()=>`周日早上，谷仓的红墙上被人用白漆喷了两个词：GO HOME。Tenzin站在墙前，说：“我的家在哪里，他们知道吗？”同一周，韩裔长老会的Joy Kim牧师的教堂窗户也被砸了。`,
  opts:[{t:'请邻居们一起来刷墙',e:{T:5,M:2,f:{vandalDone:1}},r:'来了四十个人，包括Chuy、Shirley和两个从没来过的浸信会家庭。刷完墙，大家在谷仓前吃了午饭。'},
    {t:'报警，并联系Joy Kim牧师一起守夜',e:{T:4,M:3,f:{vandalDone:1}},r:'守夜那晚，长老会的诗班唱了一首韩语圣诗，你们念了一段回向文。'},
    {t:'把字留着一个月，作为提醒',e:{L:1,H:5,f:{vandalDone:1}},r:'一个月里，有三十多个人专门开车来看那面墙。第三十一天，你们把它刷掉了。'}]});
E({id:'joykim',tag:'跨宗教',title:'联合祈祷',ch:[3,4],w:5,cond:()=>S.f.vandalDone&&!S.f.joyDone,
  text:()=>`Joy Kim牧师提议，每年由几个少数族裔宗教团体轮流主持一次联合祈祷：韩裔长老会、越南佛寺、伊斯兰中心、犹太会堂，还有你们。“我们要让韦科习惯我们。”`,
  opts:[{t:'承办第一届',e:{T:5,D:-400,H:4,f:{joyDone:1}},fx(){if(!S.f.councilAsked){S.f.councilAsked=1;queue('council_seat',2);}return '';},r:'谷仓佛堂第一次坐满了五种信仰的人。Marcus说这是他见过最拥挤的“韦科”。'},
    {t:'参加，但不承办',e:{T:2,f:{joyDone:1}},r:'第一届在清真寺办。你们带去的酥油茶被喝光了。'}]});
E({id:'drought',tag:'德州环境',title:'禁火令',ch:[2,3,4],months:[7,8],w:6,cond:()=>!S.f.burnBan||S.turn-S.f.burnBan>12,
  text:()=>`县里发布禁火令：连续五十天没下雨，室外禁止任何明火。消防局长特别打电话来提醒：“包括你们那些黄油灯。”`,
  opts:[{t:'户外的酥油灯全部熄灭',e:{L:-1,T:2},fx(){S.f.burnBan=S.turn;return '那个月，佛塔前第一次没有灯。有人在网上说：“连佛教徒都怕德州的夏天。”';}},
    {t:'把供灯都挪进室内',e:{D:-150},fx(){S.f.burnBan=S.turn;return '佛堂里热得像蒸笼。空调账单多了一百五十块。';}}]});
